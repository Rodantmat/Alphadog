name: NBA App Session Refresh (Sleeper / Fliff)

# Owner 2026-10-25 23:00 PT: "Create the same auto renew token for both". The Underdog refresher's pace and settings (every 6 hours,
# a random start up to 5 min after the slot, residential proxy, San Diego location, one fixed device per app): reopen the app with the
# stored session, save the renewed state; if the app signed it out, sign in again from the GitHub secrets (a one-time code cannot be
# answered unattended - the run fails loudly with LOGIN_CODE_SENT and `NBA App Login` takes it). Prints no secret.
# Slots 02:47 / 08:47 / 14:47 / 20:47 PT (09:47 / 15:47 / 21:47 / 03:47 UTC), 6 min after Underdog's.
on:
  schedule:
    - cron: '47 3,9,15,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        app: [sleeper, fliff]
    concurrency:
      group: nba-app-auth-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve proxy (credential store)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store"
          else
            echo "proxy: none"
          fi
      - name: System deps (Chrome fonts + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2t64 libgbm1 || \
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2 libgbm1
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase "proxy.py" "psycopg[binary]" curl_cffi
          sbase get chromedriver || true
      - name: Refresh the session
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP: ${{ matrix.app }}
          APP_MODE: refresh
          APP_OTP_WAIT_S: "0"
          SLEEPER_EMAIL: ${{ secrets.SLEEPER_EMAIL }}
          SLEEPER_PASSWORD: ${{ secrets.SLEEPER_PASSWORD }}
          FLIFF_EMAIL: ${{ secrets.FLIFF_EMAIL }}
          FLIFF_PASSWORD: ${{ secrets.FLIFF_PASSWORD }}
        run: python nba/app_login.py
