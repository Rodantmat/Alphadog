name: NBA Fliff Live

# Fliff Pick'Em live slips (owner 2026-10-26 14:22 PT: Fliff option 2 "deploy that") - nba/fliff_live_slip_engine.py. Manual entry
# point; the scheduled legs run inside P3 (board capture + pick, after the Sleeper pick) and P2A (grade). Nothing is sent to Fliff.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pick | grade"
        default: "pick"
        required: false
      date:
        description: "slate date YYYY-MM-DD (pick: blank = today PT; grade: blank = every ungraded slate before today)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-fliff-live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" numpy
      - name: Fliff live engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FL_MODE: ${{ github.event.inputs.mode }}
          FL_DATE: ${{ github.event.inputs.date }}
        run: python -u nba/fliff_live_slip_engine.py
