name: NBA UD Retest Failed

# Underdog re-test of the leg-level ideas PrizePicks tried and dropped (strategy doc §30p)
# -> nba_score.ud_cand_leg_features_x / ud_failed_signal_matrix. Writes only those two tables.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphadog-nba-ud-retest
  cancel-in-progress: false

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Retest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/build_ud_retest_failed.py
