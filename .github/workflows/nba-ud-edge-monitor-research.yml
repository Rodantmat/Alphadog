name: NBA UD Edge Monitor Research

# §31o: read-only research for an Underdog P5 break-even monitor.
on:
  workflow_dispatch:
    inputs:
      sims:
        default: "400"
        required: false
      table:
        description: "P5 backtest slip table (round 3 #4: nba_score.ud_slip_engine_slips_dlt_orig2_mf = the market-free twin)"
        default: "nba_score.ud_slip_engine_slips_dlt_orig2"
        required: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Research
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EM_SIMS: ${{ github.event.inputs.sims }}
          EM_TABLE: ${{ github.event.inputs.table }}
          UD_EXCL_CENTER: "1"
        run: python -u nba/ud_edge_monitor_research.py
