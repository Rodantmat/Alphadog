name: NBA Recalibration Map

# COMPASS 124/134: recalibration map v2 - report mode by default (out-of-sample gate shown per prop/kind); write=1 writes ONLY if
# the gate passes in both directions.
on:
  workflow_dispatch:
    inputs:
      write:
        description: "'1' = write if the gate passes; anything else = report"
        default: "0"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" numpy
      - name: Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RC_WRITE: ${{ github.event.inputs.write }}
        run: python -u nba/build_recalibration_map.py
