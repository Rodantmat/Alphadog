name: NBA G2 routing verify (one slate, unrouted vs routed vs restored)

# Strategy doc §31s G2. Rebuilds ONE historical slate's final_hp for the chosen props three times with the real builder:
# A unrouted (production depths) -> B routed (test depth lowered for one prop) -> C unrouted again (depth restored, ALWAYS).
# The slate ends exactly as it started (C == A is asserted); scratch tables are dropped at the end.

on:
  workflow_dispatch:
    inputs:
      date:
        default: "2026-01-15"
      season:
        default: "2025-26"
      props:
        default: "points,rebounds,pra,blocks"
      test_prop:
        default: "points"
      test_depth:
        default: "10"
      restore_depth:
        description: "the production certified depth of test_prop (config value before the test)"
        default: "14"

permissions:
  contents: read

concurrency:
  group: alphadog-nba-final-hp-write
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      G2_DATE: ${{ github.event.inputs.date }}
      G2_PROPS: ${{ github.event.inputs.props }}
      G2_TEST_PROP: ${{ github.event.inputs.test_prop }}
      G2_TEST_DEPTH: ${{ github.event.inputs.test_depth }}
      FE_SEASONS: ${{ github.event.inputs.season }}
      FE_PROPS: ${{ github.event.inputs.props }}
      FE_DATE: ${{ github.event.inputs.date }}
      FE_WRITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy scipy
      - name: Before (production state)
        run: python nba/verify_g2_routing.py capture before
      - name: A - unrouted build
        run: python nba/build_final_hp.py && python nba/verify_g2_routing.py capture a
      - name: Lower test depth
        run: python nba/verify_g2_routing.py setdepth "$G2_TEST_PROP" "$G2_TEST_DEPTH"
      - name: B - routed build
        run: python nba/build_final_hp.py && python nba/verify_g2_routing.py capture b
      - name: Restore depth (always)
        if: always()
        run: python nba/verify_g2_routing.py setdepth "$G2_TEST_PROP" "${{ github.event.inputs.restore_depth }}"
      - name: C - unrouted build again (always)
        if: always()
        run: python nba/build_final_hp.py && python nba/verify_g2_routing.py capture c
      - name: Compare
        run: python nba/verify_g2_routing.py compare
      - name: Cleanup (always)
        if: always()
        run: python nba/verify_g2_routing.py cleanup
