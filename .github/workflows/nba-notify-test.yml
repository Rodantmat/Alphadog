name: NBA Notify Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "psycopg[binary]"
      - name: Send test text
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: test
        run: python -u nba/p3_text.py
