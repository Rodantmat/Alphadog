name: One-time - copy DATABASE_URL secret to melaleuca-cart (value never printed)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set secret in Rodantmat/melaleuca-cart
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          T1: ${{ secrets.ALPHADOG_WORKER_GITHUB_TOKEN }}
          T2: ${{ secrets.SOCIAL_GITHUB_TOKEN }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "no DATABASE_URL here"; exit 1; }
          for T in "$T1" "$T2"; do
            [ -n "$T" ] || continue
            if printf '%s' "$DATABASE_URL" | GH_TOKEN="$T" gh secret set DATABASE_URL -R Rodantmat/melaleuca-cart 2>/tmp/err; then echo "secret set OK"; exit 0; fi
            echo "token could not set it: $(head -c 200 /tmp/err)"
          done
          exit 1
