name: NBA Overnight Queue

# Runs the remaining pre-engine work end to end, unattended, in dependency order.
# Every step reports loudly: no "|| echo failed" - that pattern is exactly how a missing 44% of the
# board (the combos ladder) went unnoticed for two days.

on:
  workflow_dispatch:
    inputs:
      asof:
        description: "slate date for the baseline load + coverage check"
        default: "2026-03-15"
        required: false

permissions:
  contents: write

concurrency:
  group: alphadog-nba-overnight
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy curl_cffi lxml html5lib

      # 1) Load the freshly built baseline artifact (singles + combos + periods) into Postgres,
      #    and record the run metadata the freshness gates read.
      - name: Load baseline ladder into Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOAD_ASOF: ${{ github.event.inputs.asof || '2026-03-15' }}
        run: python nba/load_baseline_ladder.py

      # 2) Prove the combos gap is closed, per player, against the real board.
      - name: Baseline vs board coverage
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COVER_DATE: ${{ github.event.inputs.asof || '2026-03-15' }}
        run: python nba/check_baseline_board_coverage.py

      # 3) Static context still missing: coach changes, All-Star / All-NBA, national TV.
      - name: Static context files
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/build_static_context.py

      - name: Commit any produced data files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/*.json || true
          if git diff --cached --quiet; then echo "No file changes."; exit 0; fi
          git commit -m "NBA overnight queue: static context [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
          done
          exit 1
