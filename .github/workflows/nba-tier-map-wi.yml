name: NBA Tier Map WI (gate-2 test legs)

# §31s G1: builds nba_score.tier_map_legs_wi (certified legs copied + whole-number legs, cross-fitted recalibration). Read-only on
# the certified tables.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/build_tier_map_wi.py
