name: NBA Starter Status Diagnostic

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_DIAGNOSTIC.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip curl_cffi

      - name: Run starter status diagnostic (small sample)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/diagnostic_starter_status.py
        continue-on-error: true

      - name: Commit diagnostic JSON to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/nba_starter_status_diagnostic.json || true
          if git diff --cached --quiet; then
            echo "No diagnostic JSON changes to commit."
            exit 0
          fi
          git commit -m "NBA starter status diagnostic data [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
