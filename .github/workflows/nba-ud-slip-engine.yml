name: NBA UD Slip Engine

# Underdog slip engine (strategy doc §30n) -> nba_score.ud_slip_engine_slips{suffix} / _legs{suffix}.
# Base build: suffix blank, rules off. Candidate rules are tested as side tables (suffix e.g. _minrise).

on:
  workflow_dispatch:
    inputs:
      cap:
        default: "5"
        required: false
      sizes:
        default: "2,3,4,5,6,7,8"
        required: false
      suffix:
        description: "table suffix ('' = base build)"
        default: ""
        required: false
      minrise_out:
        description: "1 = drop legs whose minutes rose >= 4"
        default: "0"
        required: false
      min_nv:
        description: "drop legs whose books' window no-vig for our side is below this (0 = off; §30x)"
        default: "0"
        required: false
      excl_hotform:
        description: "1 = drop legs whose recent form is >= +1 SD toward the pick"
        default: "0"
        required: false
      excl_center:
        description: "1 = drop legs on centers"
        default: "0"
        required: false
      legs_table:
        description: "tier-map leg table (§30r: nba_score.ud_tier_map_legs_curr = repriced)"
        default: "nba_score.ud_tier_map_legs"
        required: false
      haircut:
        description: "confidence haircut 'main,alt' on payout factors (§30r), e.g. 0.01,0.03"
        default: "0,0"
        required: false
      cells_json:
        description: "re-certified cells JSON {name:[prop,tier,side,rank,n,edge], _core:[...]} (blank = built-in cells)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-ud-engine-${{ github.event.inputs.suffix }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UD_CAP: ${{ github.event.inputs.cap }}
          UD_SIZES: ${{ github.event.inputs.sizes }}
          UD_TABLE_SUFFIX: ${{ github.event.inputs.suffix }}
          UD_MINRISE_OUT: ${{ github.event.inputs.minrise_out }}
          UD_MINFALL_PREF: ${{ github.event.inputs.minfall_pref }}
          UD_EXCL_HOTFORM: ${{ github.event.inputs.excl_hotform }}
          UD_EXCL_CENTER: ${{ github.event.inputs.excl_center }}
          UD_LEGS_TABLE: ${{ github.event.inputs.legs_table }}
          UD_CELLS_JSON: ${{ github.event.inputs.cells_json }}
          UD_HAIRCUT: ${{ github.event.inputs.haircut }}
        run: |
          IFS=, read -r UD_HC_MAIN UD_HC_ALT <<< "${UD_HAIRCUT:-0,0}"
          export UD_HC_MAIN UD_HC_ALT
          echo "haircut main=${UD_HC_MAIN} alt=${UD_HC_ALT} legs=${UD_LEGS_TABLE}"
          python -u nba/build_ud_slip_engine.py
