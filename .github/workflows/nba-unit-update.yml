name: NBA Unit Update (manual)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "last graded slate YYYY-MM-DD (blank = yesterday PT)"
        default: ""
        required: false
      dry:
        description: "1 = print only, roll back"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-unit-update
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" numpy pandas
      - name: Rebuild the unit record
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UNIT_DATE: ${{ github.event.inputs.date }}
          UNIT_DRY: ${{ github.event.inputs.dry }}
        run: python -u nba/unit_update.py
