name: NBA Honest Referee (daily scoreboard at real prices)

# Daily out-of-sample scoreboard (nba/NBA_HONEST_REBUILD.md section 8f). Refreshes the graded leg tables of this work (scratch tables _lr_app_legs,
# _lr_legs_h) and writes nba_score.honest_referee. Reads production, changes nothing live. Runs after overnight grading (P2A) and before P2B.
on:
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nba-honest-referee
  cancel-in-progress: false

jobs:
  referee:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" numpy scipy pandas
      - name: Refresh graded app legs
        run: |
          set -euo pipefail
          for app in underdog sleeper fliff pp26; do LR_APP=$app python -u nba/research_leg_roi_cache.py; done
      - name: Honest history of this season (certified recipe; singles then combos) - new slates get their honest number
        run: |
          set -euo pipefail
          BT_TEST=2026-27 python -u nba/research_honest_history_build.py
          BT_TEST=2026-27 HH_MODE=combos python -u nba/research_honest_history_build.py
      - name: Rebuild the honest leg table
        run: LH_APP=prizepicks,underdog,sleeper,fliff python -u nba/research_legs_h_build.py
      - name: Referee
        run: python -u nba/audit_honest_referee.py
      # The per-leg model, the per-leg store and the forward tracker of the one candidate (sections 8q-8u). Heavy database work: skipped when the
      # scheduler started this run late, so it can never run into the P2B window (08:06 PT).
      - name: Per-leg model (walk-forward), store, candidate tracker
        run: |
          set -euo pipefail
          now=$(TZ=America/Los_Angeles date +%H%M)
          if [ "$now" -gt 0610 ] && [ "$now" -lt 0930 ]; then echo "started at $now PT - too close to P2B, skipped today"; exit 0; fi
          for app in underdog prizepicks sleeper fliff; do LM_APP=$app LM_WRITE=1 python -u nba/research_leg_model_h.py | grep -v "LM|  " ; done
          python -u nba/research_legs_honest_store.py | head -12
          python -u nba/audit_top_list_tracker.py
