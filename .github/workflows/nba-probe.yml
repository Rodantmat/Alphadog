name: NBA Probe (no commit)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_PROBE.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip curl_cffi ably pdfplumber "psycopg[binary]" requests
      # PROXY FROM THE CREDENTIAL STORE (2026-10-08, full-system certification). The owner's rule keeps API keys and
      # credentials in nba_config.external_credentials; the proxy URL now lives there too ('proxy_url'), so a provider or
      # credential change is ONE row, not a secret edit in 30 workflows. The PROXY_URL secret stays as the fallback.
      # Every later step reads ${{ env.PROXY_URL || secrets.PROXY_URL }}. psql ships on the GitHub runner image.
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store -> $(echo "$P" | sed 's#.*@##')"
          else
            echo "proxy: credential store has no proxy_url row - using the PROXY_URL secret"
          fi

      - name: "Run the probe script named in the trigger file"
        env:
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETR_REFRESH_TOKEN: ${{ secrets.BETR_REFRESH_TOKEN }}
          BETR_CLIENT_ID: ${{ secrets.BETR_CLIENT_ID }}
          BETR_ACCESS_TOKEN: ${{ secrets.BETR_ACCESS_TOKEN }}
          BETR_SESSION_STATE: ${{ secrets.BETR_SESSION_STATE }}
        run: |
          f=nba/TRIGGER_NBA_PROBE.txt
          S=$(grep -E '^script:' $f | head -1 | sed 's/^script:[[:space:]]*//')
          echo "running $S"; python "nba/$S"
