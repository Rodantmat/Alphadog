name: NBA Measure Types Backfill

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_MEASURE_TYPES.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-measure-types
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip curl_cffi

      - name: Backfill Usage/Scoring/Four Factors (3 seasons, 12 bulk calls)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_backfill_measure_types.py
        continue-on-error: true

      - name: Commit JSON to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in nba/data/nba_backfill_player_usage.json nba/data/nba_backfill_player_scoring.json nba/data/nba_backfill_team_scoring.json nba/data/nba_backfill_team_four_factors.json nba/data/nba_backfill_measure_types_meta.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "NBA measure types backfill data [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
