name: NBA final_hp - Postseason (parallel by prop)

# strategy §31w P-4 (2026-10-08). build_final_hp.py with FE_POSTSEASON=1 replaces ONLY play-in / playoff rows (game ids 004/005)
# per (season, prop) - so prop groups can run in parallel without touching each other or any regular-season row (its board-key
# table is a session TEMP table). The serial maintenance task took ~45 min per season; this matrix does a season in the time of
# its slowest group. Optional first job: rebuild the as-of calibration (all seasons, oldest first - the postseason legs fit
# their own 5_postseason cells). Own concurrency group (never queued behind nba-maintenance).
on:
  workflow_dispatch:
    inputs:
      season:
        description: "2024-25 or 2025-26"
        required: true
      calibrate_first:
        description: "1 = rebuild nba_score.ladder_calibration_asof before pricing"
        default: "0"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-final-hp-postseason-${{ github.event.inputs.season }}
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy
      - name: As-of calibration (skipped unless calibrate_first = 1)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event.inputs.calibrate_first }}" != "1" ]; then echo "calibration not requested"; exit 0; fi
          python -u nba/build_asof_calibration.py

  price:
    needs: calibrate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # 3 at a time: nine concurrent jobs each copying + indexing the board-key table saturated the database's IO (2026-10-09
      # 01:00Z, terminated); the key table is now limited to April-June in postseason mode and three jobs share the IO
      max-parallel: 3
      matrix:
        props: ["points", "assists,threes_made", "rebounds", "pra", "pts_reb", "pts_ast", "reb_ast",
                "steals,blocks,turnovers,stocks", "fga,fg3a,ftm,fantasy_score,personal_fouls,double_double",
                "dreb,oreb,fgm,fta"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy
      - name: final_hp for the postseason games (${{ matrix.props }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FE_SEASONS: ${{ github.event.inputs.season }}
          FE_PROPS: ${{ matrix.props }}
          FE_WRITE: "1"
          FE_POSTSEASON: "1"
        run: python -u nba/build_final_hp.py
