name: NBA Baseline History (day-by-day, whole season)

# Produces the baseline hit probability for EVERY leg on EVERY game-day of a season - the parity
# requirement for simulating the scoring engine. One run per prop pair per season (the certified
# harness already scores every game-day from history strictly before it); output goes straight to
# Postgres (nba_score.baseline_history) because a season of one prop pair is ~500k rows.
# Fails loudly: no "|| echo failed".

on:
  workflow_dispatch:
    inputs:
      season:
        description: "season to build, e.g. 2024-25 or 2025-26"
        default: "2025-26"
        required: true
      pairs:
        description: "prop pairs, semicolon-separated"
        default: "points,rebounds;assists,steals;blocks,turnovers;threes_made,fg3a;fga,ftm;personal_fouls"
        required: false
      ladder_steps:
        description: "ladder depth (same as production)"
        default: "10"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-baseline-history-${{ github.event.inputs.season }}
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy scipy
      - name: Build + load every prop pair for the season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BT_TEST: ${{ github.event.inputs.season }}
          # TRAIN must be strictly BEFORE the test season - the harness default ("2023-24,2024-25") would put
          # 2024-25 inside its own training set (a leak, and it doubled memory: both 2024-25 attempts were
          # OOM-killed at ~117s). Matches how certification ran each season.
          BT_TRAIN: ${{ github.event.inputs.season == '2024-25' && '2023-24' || '2023-24,2024-25' }}
          BT_LADDER_STEPS: ${{ github.event.inputs.ladder_steps || '10' }}
          BT_INJURY: "1"
        run: |
          set -e
          IFS=';' read -ra PAIRS <<< "${{ github.event.inputs.pairs }}"
          for pair in "${PAIRS[@]}"; do
            echo "=== $BT_TEST :: $pair ==="
            BT_PROPS="$pair" python nba/baseline/build_baseline_history.py
            tag=$(echo "$pair" | tr ',' '-')
            f="nba/data/nba_baseline_history_$(echo $BT_TEST | tr '-' '_')_${tag}.json"
            test -s "$f"
            HISTORY_FILE="$f" python nba/load_baseline_history.py
            rm -f "$f"
          done
