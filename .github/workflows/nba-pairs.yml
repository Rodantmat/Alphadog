name: NBA Teammate Pairs (shared-court, as-of weekly)

# The layer the redistribution model needs: two-man teammate combinations with shared MINUTES, snapshot
# per week so a pair baseline is as-of correct. Box scores only say two players appeared in the same
# game, which is why both absence-panel attempts failed their conservation check.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "comma-separated"
        default: "2025-26"
        required: false
      every_days:
        description: "snapshot cadence in days"
        default: "7"
        required: false

permissions:
  contents: write

concurrency:
  group: alphadog-nba-pairs
  cancel-in-progress: false

jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip curl_cffi
      - name: Scrape pair snapshots
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PAIRS_SEASONS: ${{ github.event.inputs.seasons || '2025-26' }}
          PAIRS_EVERY_DAYS: ${{ github.event.inputs.every_days || '7' }}
        run: python nba/scrape_nba_pairs.py
      - name: Commit snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/nba_pairs_*.json || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "NBA teammate pair snapshots [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
          done
          exit 1
