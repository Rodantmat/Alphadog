name: NBA Game Line Snapshots (morning + window)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "start Pacific game date"
        default: "2024-10-22"
        required: false
      end:
        description: "end Pacific game date"
        default: "2026-04-12"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-game-lines
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests
      - name: Pull game-line snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GL_START: ${{ github.event.inputs.start || '2024-10-22' }}
          GL_END: ${{ github.event.inputs.end || '2026-04-12' }}
          GL_CREDIT_FLOOR: '250000'
        run: python nba/backfill_game_line_snapshots.py
