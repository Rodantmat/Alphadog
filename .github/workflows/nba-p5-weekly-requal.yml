name: NBA P5 Weekly Requalification

# The "adjust in all steps" loop, walk-forward. Monday 20:00 UTC (after P1 19:00). Rebuilds the certified chain
# on the data as it now stands (the live days are in the map), re-certifies with the frozen invariant list,
# re-runs the MLB-translated validation, and writes a verdict per live strategy to nba_score.weekly_requal.
# It NEVER edits the strategy list: a strategy that fails re-validation is set to 'red' (cap 0) in
# live_strategy_state and flagged for review. New strategies enter only through a reviewed edit of
# live_slip_engine.STRATEGIES. (MLB lesson: a system that rewrites its own strategy list cannot be trusted.)

on:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphadog-nba-p5
  cancel-in-progress: false

jobs:
  requalify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy

      - name: "1. Tier map + bands (all three ranks) - DELTA, only days past the high-water mark; bands re-swept in full"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TM_RANK: "final_hp,baseline_hp,final_score"
          TM_REBUILD: "1"
          TM_DELTA: "1"
          TM_NMAX: "25"
          TM_PCTMAX: "30"
        run: python -u nba/build_tier_map_bands.py

      - name: "1b. Selection leg table - the certified map + whole-number legs in the cells' currency, as the live pick selects (§31s G1 gate 2b)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/build_tier_map_sel.py

      - name: 2. Candidate certifier (per-season aggregate; full recompute is the exact form)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/certify_candidates.py

      - name: "3. Slip engine (certified rules, capped) - DELTA, only new days; phase bounds + correlation map from the whole history"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SE_CAP: "10"
          SE_SIZES: "2,3,4,5,6"
          SE_DELTA: "1"
          SE_LEGS_TABLE: nba_score.tier_map_legs_sel
        run: python -u nba/build_slip_engine.py

      - name: 3b. Slip engine, family C (Regular without steals, 28f) into the _nosteals tables - DELTA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SE_CAP: "10"
          SE_SIZES: "2,3,4,5,6"
          SE_EXCLUDE_CELLS: "steals_R,steals_R_U"
          SE_TABLE_SUFFIX: "_nosteals"
          SE_DELTA: "1"
          SE_LEGS_TABLE: nba_score.tier_map_legs_sel
        run: python -u nba/build_slip_engine.py

      # MARKET-FREE TWIN (round 2 P3#4, 2026-10-08): the live pipeline has no sportsbook feed, so its scores carry no market
      # term; the twin tables (*_mf / *_mf_nosteals) are the certified selection rescored exactly as live scores it
      # (nba_score.build_tier_map_legs_sel_mf, nba/sql). The live engine's hurdle calibration, anchor/edge references and
      # the verdicts below follow nba_config.classification_config['live_backtest_suffix'] ('_mf' since 2026-10-08).
      - name: "3c. Market-free selection table (live scoring: no market term), then its slip engines - DELTA"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SE_CAP: "10"
          SE_SIZES: "2,3,4,5,6"
          SE_DELTA: "1"
          SE_LEGS_TABLE: nba_score.tier_map_legs_sel_mf
        run: |
          python - <<'EOF'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              c.execute("SET statement_timeout = 0")
              n = c.execute("SELECT nba_score.build_tier_map_legs_sel_mf()").fetchone()[0]
              c.commit()
              print(f"tier_map_legs_sel_mf: {n:,} legs (market-free rescoring of the certified selection)", flush=True)
          EOF
          SE_TABLE_SUFFIX="_mf" python -u nba/build_slip_engine.py
          SE_TABLE_SUFFIX="_mf_nosteals" SE_EXCLUDE_CELLS="steals_R,steals_R_U" python -u nba/build_slip_engine.py

      - name: 4. Certification pass (frozen invariant list; any FAIL stops the loop here)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/certify_slip_system.py

      - name: "5. Validation (walk-forward, bootstrap, whole-board null, teammate ban) - weekly precision; monthly 10000/100"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SV_TOPK: "30"
          SV_BOOT: "2000"
          SV_NULL: "30"
        run: python -u nba/validate_slip_strategies.py

      - name: 5b. Validation, family C (no-steals tables)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SV_TOPK: "30"
          SV_BOOT: "2000"
          SV_NULL: "30"
          SE_TABLE_SUFFIX: "_nosteals"
          SV_TABLE_SUFFIX: "_nosteals"
        run: python -u nba/validate_slip_strategies.py

      - name: 5c. Validation, market-free twin (steals pool and no-steals pool)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SV_TOPK: "30"
          SV_BOOT: "2000"
          SV_NULL: "30"
        run: |
          SV_TABLE_SUFFIX="_mf" python -u nba/validate_slip_strategies.py
          SV_TABLE_SUFFIX="_mf_nosteals" python -u nba/validate_slip_strategies.py

      # 5d. VERDICT HISTORY (retention audit 2026-10-08): the validator and certifier tables are whole-table replaces - last
      #     week's inputs to the step-6 verdicts were gone. Snapshot them under this run's date (append-only, idempotent).
      - name: 5d. Snapshot the week's validator and certifier tables (history)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAP_TABLES: "nba_score.slip_validation,nba_score.slip_validation_nosteals,nba_score.slip_validation_mf,nba_score.slip_validation_mf_nosteals,nba_score.cand_certified,nba_score.tier_map_summary"
        run: python nba/snapshot_model_params.py

      - name: 6. Verdicts -> live strategy state (fail = red/cap 0, flagged; never auto-replaced)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import os, json, psycopg, datetime as dt, sys
          sys.path.insert(0, 'nba')
          from live_slip_engine import STRATEGIES, ROTATION_ONLY, ALLSTAR_ONLY, bt_suffix
          # state-gated strategies (drought-only, pre-break-week-only) are judged by their own state, not by a full-season
          # validation they are designed to fail; their verdict is recorded but never turns them red
          STATE_GATED = set(ROTATION_ONLY) | set(ALLSTAR_ONLY)
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              c.execute("""CREATE TABLE IF NOT EXISTS nba_score.weekly_requal (run_date date, strategy text, composition text, size int, structure text,
                           in_validation boolean, v2_pass boolean, v6_pass boolean, oos_roi double precision, oos_ci_lo double precision,
                           verdict text, PRIMARY KEY (run_date, strategy))""")
              today = dt.date.today()
              # the verdict tables follow the live engine's backtest (live_backtest_suffix: '_mf' = market-free twin)
              sfx = bt_suffix(c)
              val = {(r[0], r[1], r[2]): r[3:] for r in c.execute(
                  f"SELECT composition, size, structure, v2_pass, v6_pass, oos_roi, oos_ci_lo FROM nba_score.slip_validation{sfx}").fetchall()}
              # family C (Regular without steals, 28f) is validated in the no-steals run's table
              has_c = c.execute(f"SELECT to_regclass('nba_score.slip_validation{sfx}_nosteals') IS NOT NULL").fetchone()[0]
              val_c = dict()
              if has_c:
                  for r in c.execute(f"SELECT composition, size, structure, v2_pass, v6_pass, oos_roi, oos_ci_lo FROM nba_score.slip_validation{sfx}_nosteals").fetchall():
                      val_c[(r[0], r[1], r[2])] = r[3:]
              print(f"verdicts from nba_score.slip_validation{sfx} / {sfx}_nosteals", flush=True)
              for name, (comp, size, structure, cap, *_r) in STRATEGIES.items():
                  v = (val_c if name.startswith(('C_', 'D_', 'R_', 'W_')) else val).get((comp, size, structure))
                  if v is None:
                      verdict, v2, v6, roi, lo = 'NOT_IN_TOP30', None, None, None, None   # not selected on the prior-season window this week
                  else:
                      v2, v6, roi, lo = v
                      verdict = 'PASS' if (v2 and v6) else 'FAIL'
                  c.execute("""INSERT INTO nba_score.weekly_requal (run_date, strategy, composition, size, structure, in_validation, v2_pass, v6_pass, oos_roi, oos_ci_lo, verdict)
                               VALUES (%s,%s,%s,%s,%s,%s,%s,%s,%s,%s,%s) ON CONFLICT (run_date, strategy) DO UPDATE SET verdict=EXCLUDED.verdict, v2_pass=EXCLUDED.v2_pass,
                               v6_pass=EXCLUDED.v6_pass, oos_roi=EXCLUDED.oos_roi, oos_ci_lo=EXCLUDED.oos_ci_lo""",
                            (today, name, comp, size, structure, v is not None, v2, v6, roi, lo, verdict))
                  if verdict == 'FAIL' and name in STATE_GATED:
                      verdict = 'FAIL_STATE_GATED'   # recorded for review; the strategy's own state gates it
                  if verdict == 'FAIL':
                      c.execute("""UPDATE nba_score.live_strategy_state SET state='red', live_cap=0,
                                   hurdles = coalesce(hurdles,'{}'::jsonb) || jsonb_build_object('REQUAL','FAIL '||%s::text), updated_at=now() WHERE strategy=%s""", (today.isoformat(), name))
                  elif verdict == 'PASS':
                      # the ONLY path out of red: a clean weekly re-validation on a window that includes the live days that stopped it.
                      # THE LIVE DAYS MUST ACTUALLY BE IN THE WINDOW (2026-10-08, certification round 2, P2A#5): the validator's
                      # window is still 2024-25 -> 2025-26 (§29b rolls it later), so its PASS repeats every Monday regardless of
                      # the live season - a strategy stopped by live hurdles would have been released every week and re-stopped
                      # the next morning. Release now also requires the walk-forward test simulate_p5 applies: the day-blocked
                      # bootstrap lower bound of the strategy's certified OOS slips THIS season (from Nov 1, >= 40 slate days) > 0.
                      st = c.execute("SELECT state FROM nba_score.live_strategy_state WHERE strategy=%s", (name,)).fetchone()
                      if st and st[0] == 'red':
                          from live_slip_engine import boot_lo, bt_table
                          import datetime as _dt
                          tbl = bt_table(c, name)   # the configured backtest (market-free twin since round 2)
                          y0 = today.year if today.month >= 7 else today.year - 1
                          season_now = f"{y0}-{(y0 + 1) % 100:02d}"
                          g = c.execute(f"""SELECT count(*), sum(profit) FROM {tbl} WHERE composition=%s AND size=%s AND structure=%s AND k<=%s
                                             AND season=%s AND phase<>'final7' AND game_date >= %s AND game_date < %s GROUP BY game_date""",
                                        (comp, size, structure, cap, season_now, _dt.date(y0, 11, 1), today)).fetchall()
                          lo_live = boot_lo([(float(r[0]), float(r[0]) + float(r[1])) for r in g], 2000) if len(g) >= 40 else None
                          if lo_live is not None and lo_live > 0:
                              c.execute("""UPDATE nba_score.live_strategy_state SET state='paper', live_cap=%s,
                                           hurdles = jsonb_build_object('REQUAL','PASS '||%s::text), updated_at=now() WHERE strategy=%s AND state='red'""", (cap, today.isoformat(), name))
                              print(f"  {name:<20} red -> paper (live-season walk-forward lower bound {lo_live:+.0%} on {len(g)} days)")
                          else:
                              c.execute("""UPDATE nba_score.live_strategy_state SET hurdles = coalesce(hurdles,'{}'::jsonb) || jsonb_build_object('REQUAL','HOLD '||%s::text), updated_at=now()
                                           WHERE strategy=%s AND state='red'""", (today.isoformat(), name))
                              print(f"  {name:<20} stays red: validator PASS but live-season walk-forward not passed "
                                    f"({len(g)} days; lower bound {'n/a' if lo_live is None else f'{lo_live:+.0%}'})")
                  print(f"  {name:<20} {verdict:<12} {'' if roi is None else f'OOS {roi:+.0%} CI_lo {lo:+.0%}'}")
              c.commit()
          EOF

      # §31w P-5/P-6 (2026-10-08): during the play-in / playoffs the postseason certification is refreshed weekly on the nights
      # played so far (the live postseason final_hp rows join the two certified postseasons): postseason tier map -> cells
      # weighed against their certified p.m -> slip engine _post / _post_nosteals -> per-strategy postseason gate + board floor.
      # Outside the postseason (no 004/005 game in the last 8 days) it is a no-op. Never touches a regular-season table.
      - name: 7. Postseason certification refresh (play-in / playoff weeks only)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SE_CAP: "10"
          SE_SIZES: "2,3,4,5,6"
        run: |
          N=$(python -c "
          import os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as c:
              print(c.execute(\"SELECT count(*) FROM nba_calendar.games WHERE game_date BETWEEN current_date - 8 AND current_date AND (game_id LIKE '004%' OR game_id LIKE '005%')\").fetchone()[0])")
          if [ "$N" = "0" ]; then echo "no play-in / playoff games in the last 8 days - postseason certification not due"; exit 0; fi
          python -u nba/build_tier_map_legs_postseason.py
          python -u nba/certify_candidates_postseason.py
          INELIG=$(python -c "
          import os, psycopg
          with psycopg.connect(os.environ['DATABASE_URL']) as c:
              print(','.join(r[0] for r in c.execute('SELECT cell FROM nba_score.cell_postseason_eligibility WHERE NOT eligible ORDER BY 1').fetchall()))")
          SE_LEGS_TABLE=nba_score.tier_map_legs_post SE_LEGS_SELF=1 SE_PHASE=postseason SE_TABLE_SUFFIX="_post" SE_EXCLUDE_CELLS="$INELIG" python -u nba/build_slip_engine.py
          SE_LEGS_TABLE=nba_score.tier_map_legs_post SE_LEGS_SELF=1 SE_PHASE=postseason SE_TABLE_SUFFIX="_post_nosteals" SE_EXCLUDE_CELLS="steals_R,steals_R_U${INELIG:+,$INELIG}" python -u nba/build_slip_engine.py
          python -u nba/certify_postseason_strategies.py
