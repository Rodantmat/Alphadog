name: NBA Static Data Scraper

on:
  schedule:
    # Weekly differential check, per the person's own instruction (2026-08-31): teams/static
    # data changes rarely, so a weekly re-check is enough once backfill is done. Runs Monday
    # 09:00 UTC (matches the general weekly-differential convention already used for MLB).
    - cron: '0 9 * * 1'
  workflow_dispatch: {}
  push:
    # Real, working on-demand trigger that needs NO new tool capability and NO connector
    # reconnect: every chat already has github_put_file/github_patch_file (plain commit
    # capability), which has worked since the very first NBA worker was built. Bumping
    # nba/TRIGGER_NBA_SCRAPE.txt (any content change) fires this workflow via a normal push,
    # sidestepping the workflow_dispatch-API gap entirely (2026-08-31 - see NBA_PROJECT_LOG.md).
    paths:
      - 'nba/TRIGGER_NBA_SCRAPE.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-scraper
  cancel-in-progress: false

jobs:
  scrape-nba-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip requests

      - name: Scrape NBA teams from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_stats_teams.py

      - name: Commit NBA data JSON to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/nba_teams_current.json nba/data/nba_teams_current_meta.json
          if git diff --cached --quiet; then
            echo "No NBA teams JSON changes to commit."
            exit 0
          fi
          git commit -m "Update NBA teams JSON [skip ci]"
          git push origin HEAD:main
