name: NBA Static Data Scraper

on:
  schedule:
    # Weekly differential check, per the person's own instruction (2026-08-31): teams/static
    # data changes rarely, so a weekly re-check is enough once backfill is done. Runs Monday
    # 09:00 UTC (matches the general weekly-differential convention already used for MLB).
    - cron: '0 9 * * 1'
  workflow_dispatch: {}
  push:
    # Real, working on-demand trigger that needs NO new tool capability and NO connector
    # reconnect: every chat already has github_put_file/github_patch_file (plain commit
    # capability), which has worked since the very first NBA worker was built. Bumping
    # nba/TRIGGER_NBA_SCRAPE.txt (any content change) fires this workflow via a normal push,
    # sidestepping the workflow_dispatch-API gap entirely (2026-08-31 - see NBA_PROJECT_LOG.md).
    paths:
      - 'nba/TRIGGER_NBA_SCRAPE.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-scraper
  cancel-in-progress: false

jobs:
  scrape-nba-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip curl_cffi requests

      - name: Scrape NBA teams from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_stats_teams.py

      - name: Scrape NBA players from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_stats_players.py
        continue-on-error: true

      - name: Scrape NBA arenas from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_stats_arenas.py
        continue-on-error: true

      - name: Scrape NBA officials from Wikipedia
        run: python nba/scrape_nba_officials.py
        continue-on-error: true

      - name: Scrape NBA player bio/season profile from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_player_bio.py
        continue-on-error: true

      - name: Scrape NBA player tracking (speed/distance) from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_player_tracking.py
        continue-on-error: true

      - name: Scrape NBA team stats (pace/ratings) from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_team_stats.py
        continue-on-error: true

      - name: Scrape NBA on/off-court splits from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_onoff.py
        continue-on-error: true

      - name: Scrape DARKO DPM (free player-impact metric)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_darko.py
        continue-on-error: true

      - name: Scrape NBA season schedule from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_schedule.py
        continue-on-error: true

      - name: Scrape NBA play-type data from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_playtypes.py
        continue-on-error: true

      - name: Scrape NBA player tracking detail (Passing/Rebounding/Drives/etc) from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_tracking_detail.py
        continue-on-error: true

      - name: Scrape NBA shot quality (defender distance) + shot zones from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_shotquality.py
        continue-on-error: true

      - name: Scrape NBA lineup synergy (2/3/4/5-man units) from stats.nba.com
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_lineups.py
        continue-on-error: true

      - name: Commit NBA data JSON to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in nba/data/nba_teams_current.json nba/data/nba_teams_current_meta.json nba/data/nba_players_current.json nba/data/nba_players_current_meta.json nba/data/nba_arenas_current.json nba/data/nba_arenas_current_meta.json nba/data/nba_officials_current.json nba/data/nba_officials_current_meta.json nba/data/nba_player_bio_current.json nba/data/nba_player_bio_current_meta.json nba/data/nba_player_tracking_current.json nba/data/nba_player_tracking_current_meta.json nba/data/nba_team_stats_current.json nba/data/nba_team_stats_current_meta.json nba/data/nba_onoff_current.json nba/data/nba_onoff_current_meta.json nba/data/nba_darko_current.json nba/data/nba_darko_current_meta.json nba/data/nba_darko_debug_html_snippet.txt nba/data/nba_schedule_current.json nba/data/nba_schedule_current_meta.json nba/data/nba_schedule_debug_raw.json nba/data/nba_playtypes_player_current.json nba/data/nba_playtypes_player_current_meta.json nba/data/nba_playtypes_team_current.json nba/data/nba_playtypes_team_current_meta.json nba/data/nba_tracking_detail_current.json nba/data/nba_tracking_detail_current_meta.json nba/data/nba_shotquality_current.json nba/data/nba_shotquality_current_meta.json nba/data/nba_shotquality_delta_current.json nba/data/nba_shotquality_delta_current_meta.json nba/data/nba_shotzones_current.json nba/data/nba_shotzones_current_meta.json nba/data/nba_shotzones_debug_raw.json nba/data/nba_lineup_profile.json nba/data/nba_lineup_profile_meta.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No NBA teams JSON changes to commit."
            exit 0
          fi
          git commit -m "Update NBA teams JSON [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - another workflow pushed concurrently. Rebasing and retrying..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push after 5 attempts."
          exit 1
