name: NBA PP Break-even Cross-check

# §31p: correlation-preserving thinning vs the production independence break-even (read-only).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Cross-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/pp_breakeven_crosscheck.py
