name: NBA P1 Weekly Static

# PIPELINE 1 OF 3 (COMPASS fact 107). The slow-moving layer: rosters, team identity, weekly as-of
# tables, coaching changes. Things that shift on a WEEK scale, not a game scale.
#
# SCHEDULE: Mondays 12:00 PT. Deliberately far from the overnight pipeline (P2, daily 01:00 PT) so the
# two can never contend for the database or the repo. 12:00 PT Monday = 19:00 UTC Monday in PST and
# 19:00 UTC = 12:00 PDT — the season crosses DST, so the cron is set in UTC and the hour drifts by one
# between November and March. That is harmless here: nothing in this pipeline is cutoff-sensitive, which
# is exactly why the weekly layer is the right place for it.
#
# WHY WEEKLY AND NOT DAILY: these tables are as-of weekly by construction (COMPASS fact 51 / the parity
# doc) — refitting them daily would not change a value but would burn the NBA stats endpoints, which
# rate-limit hard and are the reason the delta pipeline exists at all.
#
# FAILURE POLICY: steps report loudly. The overnight-queue comment says it plainly — `|| echo failed`
# is how a missing 44% of the board went unnoticed for two days. Each step here either succeeds or the
# job goes red. The only tolerated failures are the ones marked, with the reason given.

on:
  workflow_dispatch:
    inputs:
      seasons_n:
        description: "how many seasons of weekly tables to refresh (1 = current only)"
        default: "1"
        required: false
  schedule:
    - cron: '0 19 * * 1'        # Mondays 19:00 UTC = 12:00 PT (11:00 PT during PDT)

permissions:
  contents: write

concurrency:
  group: alphadog-nba-p1-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # scipy IS REQUIRED (fixed 2026-09-23). build_defender_ratings.py does `from scipy import sparse`
      # for its two-way ridge. This line omitted scipy while P2 and P3 both install it, so the defender
      # step died with ModuleNotFoundError EVERY Monday - and because it dies mid-pipeline, the three
      # steps after it (static context, COMMIT, certify) were skipped, so the whole week's scraping was
      # thrown away uncommitted and never reached Postgres. That is why the static layer's timestamps sat
      # at 2026-09-03 and defender_ratings at 2026-04-09 while the cron ran fine every week.
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy curl_cffi lxml html5lib

      # --- identity: who is on which team. Trades and two-way call-ups move these weekly. -----------
      - name: Teams and arenas
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python nba/scrape_nba_stats_teams.py
          python nba/scrape_nba_stats_arenas.py

      - name: Players and bio
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python nba/scrape_nba_stats_players.py
          python nba/scrape_nba_player_bio.py

      # --- weekly AS-OF tables: every value computed from games strictly before the snapshot date ----
      - name: Weekly as-of season tables (pt_defend, hustle, clutch, coaches, all_players)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SEASONS_N: ${{ github.event.inputs.seasons_n || '1' }}
          MODE: "season"
        run: python nba/scrape_nba_season_tables.py

      - name: Team stats, on/off, playtypes, tracking
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python nba/scrape_nba_team_stats.py
          python nba/scrape_nba_onoff.py
          python nba/scrape_nba_playtypes.py
          python nba/scrape_nba_player_tracking.py

      - name: DARKO and shot quality
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python nba/scrape_nba_darko.py
          python nba/scrape_nba_shotquality.py

      # --- derived weekly models that the baseline reads ------------------------------------------
      - name: Defender ratings (two-way ridge, weekly as-of)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/build_defender_ratings.py

      - name: Static context (coach changes)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/build_static_context.py

      # RUN EVEN AFTER A FAILURE (2026-09-23). Every step above is a SCRAPE that already succeeded by the
      # time a later build step can fail. With the default `success()` condition, one broken build (the
      # scipy import, which failed every Monday for weeks) skipped this commit and threw the whole week's
      # scraping away - the loaders read these files from the repo, so nothing reached Postgres either.
      # Committing on always() preserves the data; the job still goes red because the failed step failed,
      # so nothing is hidden. This is not `|| echo failed` - no failure is swallowed, only data is saved.
      - name: Commit weekly data files
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/*.json || true
          if git diff --cached --quiet; then echo "No weekly file changes."; exit 0; fi
          git commit -m "NBA P1 weekly static [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
          done
          exit 1

      # 🔴 LOAD WHAT WE JUST SCRAPED (2026-09-24). THE TOP PRE-SEASON VERIFICATION IN
      # NBA_SYSTEM_DESIGN.md §2, answered - badly. P1 scrapes and commits JSON, and only
      # build_defender_ratings.py and build_static_context.py touch DATABASE_URL. Everything else -
      # teams, players, bio, team stats, on/off, play types, tracking, DARKO, shot quality, lineups -
      # was committed and then NEVER LOADED, because the writer Workers that read that JSON from GitHub
      # are only invoked by hand. §2 called it: "either those Workers are triggered separately (the
      # Coworker model), or P1 refreshes committed JSON that Postgres never sees."
      # MEASURED 2026-09-24: P1 ran green and committed, yet every static table still read 08-31 to
      # 09-08. Loading them by hand that day wrote 255 CHANGED PLAYERS and 1,858 aliases - a month of
      # roster movement (signings, team changes, rookies) the system did not have. Same failure family
      # as the officials, starter-status and injury backfills: mining works, landing does not.
      # The workers expose POST /run with NO auth (only their own outbound GitHub fetch is authenticated),
      # so this needs no secret - the earlier claim that it did was wrong.
      # Runs on always() for the same reason the commit does: a late failure must not discard the load.
      # PROFILE SNAPSHOTS (2026-09-26). Six profile tables are single-snapshot - no season, no as-of -
      # and every run of the writer workers below REWRITES them: last week's DARKO, playtypes, shot
      # quality, shot zones and tracking were gone each Monday, and the first run after opening night
      # would replace a full season's profiles with a week of samples. Under the owner's retention
      # rule these are INGREDIENTS. So before the loads: copy each table into <table>_asof with today's
      # date (idempotent per date). The workers are untouched; the research layer can read as-of.
      - name: Snapshot the profile tables as-of today (before the loads overwrite them)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m pip install -q "psycopg[binary]"
          python - <<'EOF'
          import os, psycopg
          TABLES = ["nba_stats.player_impact_rating", "nba_stats.player_playtype_profile", "nba_stats.player_shot_quality",
                    "nba_stats.player_shot_quality_delta", "nba_stats.player_shot_zone_profile", "nba_stats.player_tracking_detail"]
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              for t in TABLES:
                  hist = t + "_asof"
                  c.execute(f"CREATE TABLE IF NOT EXISTS {hist} (LIKE {t} INCLUDING DEFAULTS)")
                  c.execute(f"ALTER TABLE {hist} ADD COLUMN IF NOT EXISTS as_of_date date NOT NULL DEFAULT current_date")
                  c.execute(f"DELETE FROM {hist} WHERE as_of_date = current_date")
                  n = c.execute(f"INSERT INTO {hist} SELECT *, current_date FROM {t}").rowcount
                  print(f"  {hist}: {n:,} rows snapshotted as of {c.execute('SELECT current_date').fetchone()[0]}", flush=True)
              c.commit()
          EOF

      - name: Load static data into Postgres (writer workers)
        id: load
        if: always()
        env:
          WORKER_HOST: ${{ vars.ALPHADOG_WORKER_HOST || 'rodolfoaamattos.workers.dev' }}
        run: |
          # set +e DELIBERATELY: GitHub runs this shell with -e, so the first slow worker aborted the
          # whole loop and the remaining nine never ran (measured 2026-09-24: teams loaded, players
          # timed out, eight skipped). Each worker is independent - one being slow must not cost the
          # others. Failures are still collected and the step still fails, nothing is swallowed.
          #
          # AN ACKNOWLEDGEMENT IS NOT A ROW (measured 2026-09-24). The shot-quality worker completed and
          # wrote its rows twice while BOTH curl attempts timed out with 0 bytes received: the worker
          # finishes, the edge never returns the reply. So the HTTP result is a hint, not the verdict -
          # every unacknowledged worker is checked against Postgres by nba/verify_static_loads.py, which
          # asks whether its table was written after this step started. A single 150s wait is enough:
          # the fastest workers answer in seconds and the slow ones land the data whether or not we wait.
          set +e
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          failed=""
          for w in nba-static-teams nba-static-players nba-static-player-bio nba-static-team-stats \
                   nba-static-onoff nba-static-playtypes nba-static-tracking-detail \
                   nba-static-darko nba-static-shotquality nba-static-lineups; do
            url="https://alphadog-v2-$w.$WORKER_HOST/run"
            code=$(curl -sS --max-time 150 -o "/tmp/$w.json" -w '%{http_code}' -X POST "$url" -H 'content-type: application/json' -d '{}')
            ok=$(python -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('ok')).lower())" "/tmp/$w.json" 2>/dev/null)
            if [ "$code" = "200" ] && [ "$ok" = "true" ]; then
              echo "=== $w OK"
            else
              echo "=== $w NOT ACKNOWLEDGED (HTTP $code ok=$ok) - will verify by data"
              failed="$failed $w"
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Unacknowledged:${failed:- none}"

      - name: Verify unacknowledged loads by data
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOAD_STARTED_AT: ${{ steps.load.outputs.started_at }}
          FAILED_WORKERS: ${{ steps.load.outputs.failed }}
        run: python nba/verify_static_loads.py

      - name: Certify the weekly layer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPE: "p1"
        run: python nba/certify_pipeline.py
