name: NBA PP Payout Map

# Maps PrizePicks goblin/demon/Flex payouts server-side via the /game_types quote endpoint.
# Anonymous: PrizePicks issues its own session; no owner account is involved. Quotes only - nothing is placed.
#
# Modes (trigger-file line "mode: full|delta"; default full):
#   full  = research map: validation, bases, Flex compositions, alt x alt, same-game, Less side, every leg
#   delta = monitoring:   only legs never mined at their current line, plus a rotating DRIFT sample of
#                         already-mined legs re-quoted to catch repricing (line "drift: N", default 10)
# Trigger: push nba/TRIGGER_NBA_PP_MAP.txt (lines: max_quotes, altalt, mode, drift), or run manually.
# Output: nba/data/pp_payouts/pp_payout_map_<utc>.json, committed [skip ci], then every not-yet-loaded run is
#         loaded per leg into nba_market.pp_mined_leg (self-healing backfill).

on:
  workflow_dispatch:
    inputs:
      max_quotes:
        description: "Quote budget for this run"
        required: false
        default: "250"
  push:
    paths:
      - 'nba/TRIGGER_NBA_PP_MAP.txt'
  # STRATEGIC TIMES (owner 2026-10-09: "not multiple times a day but strategic times that match my slip-placing times and
  # our system needs - that reduces traffic cost"). Was every 6 h (4 full-page Chrome sessions a day through the metered
  # proxy). Now twice, both BEFORE the decision window (P3 = min(13:15 PT, first tip - 30 min)):
  #   16:30 UTC = 09:30 PDT / 08:30 PST - the morning board is up: mine the legs posted overnight
  #   19:45 UTC = 12:45 PDT / 11:45 PST - the board the slips are built from: new legs + the drift re-quotes
  # Scheduled runs are forced into delta mode and read max_quotes / drift from the trigger file.
  schedule:
    - cron: '30 16 * * *'
    - cron: '45 19 * * *'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-pp-payout-map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # the conflict-safe push rebases onto origin/main - needs history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # TRANSPORT LADDER (2026-10-09, PP_PAYOUT_FINDINGS §0j): one cheap curl_cffi probe quote with the NEWEST fingerprint
      # first; DataDome has refused every curl fingerprint since 2026-09-30 (real Chrome is 154, curl_cffi's newest 150 -
      # probe 38015965386), so today the quotes come from the web app's own page in a real Chrome (SeleniumBase UC + Xvfb
      # + the residential proxy). The cheap path comes back by itself when curl_cffi ships a current Chrome.
      - name: System deps (Chrome fonts + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji \
            libnss3 libxss1 libasound2t64 libgbm1 || \
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji \
            libnss3 libxss1 libasound2 libgbm1

      - run: |
          python -m pip install --upgrade pip curl_cffi "psycopg[binary]" seleniumbase "proxy.py"
          sbase get chromedriver || true

      # PROXY FROM THE CREDENTIAL STORE (owner rule: the proxy URL lives in nba_config.external_credentials 'proxy_url');
      # the PROXY_URL secret stays as the fallback.
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=""
          for i in 1 2 3; do
            P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null) && break
            echo "credential store not reachable (attempt $i/3)"; P=""; sleep $((i * 4))
          done
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store -> $(echo "$P" | sed 's#.*@##')"
          else
            echo "proxy: credential store has no proxy_url row - using the PROXY_URL secret"
          fi

      - name: Map PrizePicks payouts
        env:
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          PP_TRANSPORT: auto
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PP_MAX_QUOTES: ${{ github.event.inputs.max_quotes || '250' }}
        run: |
          f=nba/TRIGGER_NBA_PP_MAP.txt
          val() { grep -E "^$1:" "$f" | head -1 | sed "s/^$1:[[:space:]]*//" || true; }
          if [ -f "$f" ]; then
            Q=$(val max_quotes); if [ -n "${Q:-}" ]; then export PP_MAX_QUOTES="$Q"; fi
            A=$(val altalt);     if [ -n "${A:-}" ]; then export PP_ALTALT="$A"; fi
            M=$(val mode);       if [ -n "${M:-}" ]; then export PP_MODE="$M"; fi
            D=$(val drift);      if [ -n "${D:-}" ]; then export PP_DRIFT_SAMPLE="$D"; fi
            L=$(val league);     if [ -n "${L:-}" ]; then LG="$L"; fi
          fi
          # LEAGUE (line "league: nba|wnba", default nba). WNBA writes its OWN directory and table - never NBA's.
          case "${LG:-nba}" in
            wnba) export PP_LEAGUE=3 PP_OUT_DIR=nba/data/pp_payouts_wnba PP_MINED_TABLE=nba_market.pp_mined_leg_wnba ;;
            *)    export PP_LEAGUE=7 PP_OUT_DIR=nba/data/pp_payouts PP_MINED_TABLE=nba_market.pp_mined_leg ;;
          esac
          echo "PP_OUT_DIR=$PP_OUT_DIR" >> "$GITHUB_ENV"
          echo "PP_MINED_TABLE=$PP_MINED_TABLE" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "schedule" ]; then export PP_MODE=delta; fi
          echo "league: ${LG:-nba} ($PP_LEAGUE) | mode: ${PP_MODE:-full} | quote budget: $PP_MAX_QUOTES | altalt: ${PP_ALTALT:-20} | drift: ${PP_DRIFT_SAMPLE:-10}"
          python nba/pp_payout_map.py

      - name: Commit payout map
        if: always()
        # ONE push helper (nba/git_push_retry.sh): the old loop ended on `sleep` after 5 failed pushes, so a lost
        # commit exited 0 silently.
        run: bash nba/git_push_retry.sh "PP payout map [skip ci]" nba/data/pp_payouts/*.json nba/data/pp_payouts_wnba/*.json

      - name: Load per-leg prices into Postgres
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/load_pp_mined_legs.py

      - name: Load every quote (all sections, both leagues) into Postgres
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/load_pp_quotes.py
