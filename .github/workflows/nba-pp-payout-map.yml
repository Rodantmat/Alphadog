name: NBA PP Payout Map

# Maps PrizePicks goblin/demon/Flex payouts server-side via the /game_types quote endpoint.
# Anonymous: PrizePicks issues its own session; no owner account is involved. Quotes only - nothing is placed.
#
# Modes (trigger-file line "mode: full|delta"; default full):
#   full  = research map: validation, bases, Flex compositions, alt x alt, same-game, Less side, every leg
#   delta = monitoring:   only legs never mined at their current line, plus a rotating DRIFT sample of
#                         already-mined legs re-quoted to catch repricing (line "drift: N", default 10)
# Trigger: push nba/TRIGGER_NBA_PP_MAP.txt (lines: max_quotes, altalt, mode, drift), or run manually.
# Output: nba/data/pp_payouts/pp_payout_map_<utc>.json, committed [skip ci], then every not-yet-loaded run is
#         loaded per leg into nba_market.pp_mined_leg (self-healing backfill).

on:
  workflow_dispatch:
    inputs:
      max_quotes:
        description: "Quote budget for this run"
        required: false
        default: "250"
  push:
    paths:
      - 'nba/TRIGGER_NBA_PP_MAP.txt'
  schedule:                      # ENABLED 2026-09-21 - delta monitoring every 6 hours (owner may change or remove)
    - cron: '15 */6 * * *'       # 00:15 / 06:15 / 12:15 / 18:15 UTC. Scheduled runs are forced into delta mode and
                                 # read max_quotes / drift from the trigger file - a board surge is caught up gradually.

permissions:
  contents: write

concurrency:
  group: alphadog-nba-pp-payout-map
  cancel-in-progress: false

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --upgrade pip curl_cffi "psycopg[binary]"

      - name: Map PrizePicks payouts
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PP_MAX_QUOTES: ${{ github.event.inputs.max_quotes || '250' }}
        run: |
          f=nba/TRIGGER_NBA_PP_MAP.txt
          val() { grep -E "^$1:" "$f" | head -1 | sed "s/^$1:[[:space:]]*//" || true; }
          if [ -f "$f" ]; then
            Q=$(val max_quotes); if [ -n "${Q:-}" ]; then export PP_MAX_QUOTES="$Q"; fi
            A=$(val altalt);     if [ -n "${A:-}" ]; then export PP_ALTALT="$A"; fi
            M=$(val mode);       if [ -n "${M:-}" ]; then export PP_MODE="$M"; fi
            D=$(val drift);      if [ -n "${D:-}" ]; then export PP_DRIFT_SAMPLE="$D"; fi
            L=$(val league);     if [ -n "${L:-}" ]; then LG="$L"; fi
          fi
          # LEAGUE (line "league: nba|wnba", default nba). WNBA writes its OWN directory and table - never NBA's.
          case "${LG:-nba}" in
            wnba) export PP_LEAGUE=3 PP_OUT_DIR=nba/data/pp_payouts_wnba PP_MINED_TABLE=nba_market.pp_mined_leg_wnba ;;
            *)    export PP_LEAGUE=7 PP_OUT_DIR=nba/data/pp_payouts PP_MINED_TABLE=nba_market.pp_mined_leg ;;
          esac
          echo "PP_OUT_DIR=$PP_OUT_DIR" >> "$GITHUB_ENV"
          echo "PP_MINED_TABLE=$PP_MINED_TABLE" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "schedule" ]; then export PP_MODE=delta; fi
          echo "league: ${LG:-nba} ($PP_LEAGUE) | mode: ${PP_MODE:-full} | quote budget: $PP_MAX_QUOTES | altalt: ${PP_ALTALT:-20} | drift: ${PP_DRIFT_SAMPLE:-10}"
          python nba/pp_payout_map.py

      - name: Commit payout map
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/pp_payouts/*.json || true
          git add nba/data/pp_payouts_wnba/*.json || true
          if git diff --cached --quiet; then echo "No map output."; else
            git commit -m "PP payout map [skip ci]"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
            done
          fi

      - name: Load per-leg prices into Postgres
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/load_pp_mined_legs.py
