name: NBA Whole-number Line Research

# §31s G1: read-only - whole-number lines priced from the adjacent half rungs, checked against real outcomes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Research
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/integer_line_research.py
