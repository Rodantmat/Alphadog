name: NBA Whole-Number Selection Fit

# §31s G1 gate 2b: stores nba_score.wn_currency_map + classification_config['whole_number_selection'] (pooled both seasons) for the
# live engine. write=0 prints only.
on:
  workflow_dispatch:
    inputs:
      write:
        default: "0"
        required: true

permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy
      - name: Fit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WS_WRITE: ${{ github.event.inputs.write }}
        run: python -u nba/fit_wn_selection.py
