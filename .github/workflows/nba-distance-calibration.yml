name: NBA Distance Calibration Research

# §31s / O5b: read-only - distance-aware calibration of the favored side of standard legs, cross-season.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" numpy
      - name: Research
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/distance_calibration_research.py
