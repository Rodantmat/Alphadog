name: NBA ROI Curve

# §31m: exact expected ROI of the real daily portfolio vs leg-hit deficit (read-only).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Curve
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/roi_curve.py
