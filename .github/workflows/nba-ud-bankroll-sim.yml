name: NBA UD Bankroll Simulation

# §30w: Monte Carlo drawdown envelopes, drought alarm thresholds, sizing rules and the CUSUM edge-decay monitor.
on:
  workflow_dispatch:
    inputs:
      portfolio:
        default: "P5"
        required: false
      n:
        default: "10000"
        required: false
      tables:
        default: "nba_score.ud_slip_engine_slips_dlt_orig2,nba_score.ud_slip_engine_slips_dlt_recert2"
        required: false

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Simulate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIM_PORTFOLIO: ${{ github.event.inputs.portfolio }}
          SIM_N: ${{ github.event.inputs.n }}
          SIM_TABLES: ${{ github.event.inputs.tables }}
        run: python -u nba/simulate_ud_bankroll.py
