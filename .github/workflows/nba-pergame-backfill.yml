name: NBA Per-Game Backfill (starters + officials)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_PERGAME_BACKFILL.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-pergame-backfill
  cancel-in-progress: false

jobs:
  pergame:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip curl_cffi

      - name: "Resolve season slug and steps from the trigger file (slug and steps lines)"
        id: cfg
        run: |
          f=nba/TRIGGER_NBA_PERGAME_BACKFILL.txt
          S=$(grep -E '^slug:' $f 2>/dev/null | head -1 | sed 's/^slug:[[:space:]]*//'); T=$(grep -E '^steps:' $f 2>/dev/null | head -1 | sed 's/^steps:[[:space:]]*//')
          echo "slug=${S:-2024_25}" >> $GITHUB_OUTPUT; echo "steps=${T:-starters,officials}" >> $GITHUB_OUTPUT

      - name: Starter status (boxscoretraditionalv3, one call per game)
        if: contains(steps.cfg.outputs.steps, 'starters')
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SEASON_SLUG: ${{ steps.cfg.outputs.slug }}
        run: python nba/scrape_nba_starter_status.py
        continue-on-error: true

      - name: Game officials (boxscoresummaryv3, one call per game)
        if: contains(steps.cfg.outputs.steps, 'officials')
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SEASON_SLUG: ${{ steps.cfg.outputs.slug }}
        run: python nba/scrape_nba_game_officials.py
        continue-on-error: true

      - name: Commit to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/nba_starter_status_*.json nba/data/nba_game_officials_*.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "NBA per-game backfill (starters/officials) ${{ steps.cfg.outputs.slug }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
          done
          exit 1
