name: NBA Whole-number Final HP

# §31s G1: price every whole-number board line into nba_score.final_hp_derived (never final_hp). One date or a range;
# dry run unless write=1.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "single date YYYY-MM-DD (leave empty to use from/to)"
        default: ""
        required: false
      from:
        default: ""
        required: false
      to:
        default: ""
        required: false
      write:
        description: "'1' = write; anything else = dry run"
        default: "0"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" numpy pandas requests
      - name: Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WN_DATE: ${{ github.event.inputs.date }}
          WN_FROM: ${{ github.event.inputs.from }}
          WN_TO: ${{ github.event.inputs.to }}
          WN_WRITE: ${{ github.event.inputs.write }}
        run: python -u nba/build_whole_number_hp.py
