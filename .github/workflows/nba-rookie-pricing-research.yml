name: NBA Rookie Pricing Research

# §31s G3: read-only - rookie debut legs priced from the cross-fitted prior and checked against real outcomes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" scipy
      - name: Research
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/rookie_pricing_research.py
