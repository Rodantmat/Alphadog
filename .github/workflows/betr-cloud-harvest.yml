name: Betr Cloud Harvest

on:
  workflow_dispatch:
    inputs:
      league:
        description: "Override league (blank = auto: WNBA until 2026-10-20, then NBA)"
        default: ""
  schedule:
    # Pacific board windows: ~10:45 and ~13:15 PT = 17:45 and 20:15 UTC
    - cron: '45 17 * * *'
    - cron: '15 20 * * *'

concurrency:
  group: betr-cloud-harvest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # PROXY FROM THE CREDENTIAL STORE (2026-10-08, full-system certification). The owner's rule keeps API keys and
      # credentials in nba_config.external_credentials; the proxy URL now lives there too ('proxy_url'), so a provider or
      # credential change is ONE row, not a secret edit in 30 workflows. The PROXY_URL secret stays as the fallback.
      # Every later step reads ${{ env.PROXY_URL || secrets.PROXY_URL }}. psql ships on the GitHub runner image.
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store -> $(echo "$P" | sed 's#.*@##')"
          else
            echo "proxy: credential store has no proxy_url row - using the PROXY_URL secret"
          fi

      - name: Resolve league (auto-switch to NBA on opening night)
        id: lg
        run: |
          OVERRIDE="${{ github.event.inputs.league }}"
          if [ -n "$OVERRIDE" ]; then
            L="$OVERRIDE"
          else
            # NBA opening night 2026-10-20; before that WNBA is the live board
            TODAY="$(date -u +%Y-%m-%d)"
            if [ "$TODAY" \> "2026-10-19" ]; then L="NBA"; else L="WNBA"; fi
          fi
          echo "league=$L" >> "$GITHUB_OUTPUT"
          echo "Resolved league: $L (today $(date -u +%Y-%m-%d) UTC)"
      - name: System deps (Chrome fonts + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2t64 libgbm1 || \
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2 libgbm1
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase "proxy.py" "psycopg[binary]"
          sbase get chromedriver || true
      # SELF-RENEWING SESSION (2026-10-09): the harvester reads the seeded session from the credential store first (the copy it
      # renewed last time), refreshes the Keycloak tokens inside it when the access token nears expiry, and persists the renewal
      # (nba_config.external_credentials 'betr_session_state'). BETR_SESSION_STATE is the seed / fallback only.
      - name: Harvest Betr board
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          BETR_SESSION_STATE: ${{ secrets.BETR_SESSION_STATE }}
          BETR_CLIENT_ID: ${{ secrets.BETR_CLIENT_ID }}
          BETR_LEAGUE: ${{ steps.lg.outputs.league }}
        run: |
          python nba/betr_harvest_cloud.py
      - name: Commit the board file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          lg="$(echo "${{ steps.lg.outputs.league }}" | tr '[:upper:]' '[:lower:]')"
          git add boards/betr_${lg}_current.json boards/betr_${lg}_current_meta.json boards/betr_nba_current.json 2>/dev/null || true
          git commit -m "Betr ${lg} board (cloud harvest) [skip ci]" || echo "no change"
          git pull --rebase --autostash || true
          git push || echo "push skipped"
