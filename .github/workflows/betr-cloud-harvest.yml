name: Betr Cloud Harvest

# WHEN IT RUNS (owner 2026-10-09: "strategic times that match my slip-placing times and our system needs - that reduces
# traffic cost"). No crons: P3 dispatches this harvest at the WINDOW (min(13:15 PT, first tip - 30 min), the decision
# board the slips are built from) with label=window, once per slate. It is the heaviest proxy user (a full Chrome session),
# and the two old crons (10:45 / 13:15 PT) captured a board nothing used plus a duplicate of the window. An NBA board is
# archived into Postgres by this run itself (label from the dispatch), because P3 archives before the harvest can land.
on:
  workflow_dispatch:
    inputs:
      league:
        description: "Override league (blank = auto: WNBA until 2026-10-20, then NBA)"
        default: ""
      label:
        description: "board snapshot label for the archive: window (P3's dispatch) | close | routine"
        default: "routine"

concurrency:
  group: betr-cloud-harvest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # three harvest attempts (~5 min each) + pauses + archive
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # the conflict-safe push rebases onto origin/main - needs history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # PROXY FROM THE CREDENTIAL STORE (2026-10-08, full-system certification). The owner's rule keeps API keys and
      # credentials in nba_config.external_credentials; the proxy URL now lives there too ('proxy_url'), so a provider or
      # credential change is ONE row, not a secret edit in 30 workflows. The PROXY_URL secret stays as the fallback.
      # Every later step reads ${{ env.PROXY_URL || secrets.PROXY_URL }}. psql ships on the GitHub runner image.
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=""
          for i in 1 2 3; do
            P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null) && break
            echo "credential store not reachable (attempt $i/3)"; P=""; sleep $((i * 4))
          done
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store -> $(echo "$P" | sed 's#.*@##')"
          else
            echo "proxy: credential store has no proxy_url row - using the PROXY_URL secret"
          fi

      - name: Resolve league (auto-switch to NBA on opening night)
        id: lg
        run: |
          OVERRIDE="${{ github.event.inputs.league }}"
          if [ -n "$OVERRIDE" ]; then
            L="$OVERRIDE"
          else
            # NBA opening night 2026-10-20; before that WNBA is the live board
            TODAY="$(date -u +%Y-%m-%d)"
            if [ "$TODAY" \> "2026-10-19" ]; then L="NBA"; else L="WNBA"; fi
          fi
          echo "league=$L" >> "$GITHUB_OUTPUT"
          echo "Resolved league: $L (today $(date -u +%Y-%m-%d) UTC)"
      - name: System deps (Chrome fonts + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2t64 libgbm1 || \
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2 libgbm1
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase "proxy.py" "psycopg[binary]"
          sbase get chromedriver || true
      # SELF-RENEWING SESSION (2026-10-09): the harvester reads the seeded session from the credential store first (the copy it
      # renewed last time), refreshes the Keycloak tokens inside it when the access token nears expiry, and persists the renewal
      # (nba_config.external_credentials 'betr_session_state'). BETR_SESSION_STATE is the seed / fallback only.
      - name: Harvest Betr board
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          BETR_SESSION_STATE: ${{ secrets.BETR_SESSION_STATE }}
          BETR_CLIENT_ID: ${{ secrets.BETR_CLIENT_ID }}
          BETR_LEAGUE: ${{ steps.lg.outputs.league }}
        # RETRIES (owner 2026-10-09: proper retry logic on every external step). Up to 3 runs of the harvester, each on a
        # NEW sticky proxy session (new exit IP), with a growing jittered pause:
        #   exit 4 = the proxy carried no Betr traffic (run 38007254948)                    -> retried
        #   exit 2 = no authenticated traffic (session refused OR the auth calls dropped)  -> retried (a dropped auth
        #            call through a bad exit IP looks the same as an expired session; a real expiry fails every try)
        #   exit 3 = Betr has not opened this league (the chip does not route)              -> NOT retried (cannot change)
        #   any other non-zero (Chrome crashed, the script died)                            -> retried
        run: |
          set +e
          rc=1; pause=20
          for t in a b c; do
            BETR_SESSION_ID="betr${GITHUB_RUN_ID}${t}" python nba/betr_harvest_cloud.py; rc=$?
            if [ $rc -eq 0 ] || [ $rc -eq 3 ] || [ "$t" = "c" ]; then break; fi
            echo "::warning::harvest attempt ${t} exited ${rc} - retrying on a fresh proxy session"
            sleep $(( pause + RANDOM % 20 )); pause=$(( pause * 2 ))
          done
          exit $rc
      - name: Commit the board file
        # ONE push helper (nba/git_push_retry.sh): the old single `git push || echo` lost the board silently on a race.
        run: |
          lg="$(echo "${{ steps.lg.outputs.league }}" | tr '[:upper:]' '[:lower:]')"
          bash nba/git_push_retry.sh "Betr ${lg} board (cloud harvest) [skip ci]" \
            boards/betr_${lg}_current.json boards/betr_${lg}_current_meta.json boards/betr_nba_current.json
      # ARCHIVE THE NBA BOARD HERE (2026-10-09). P3 dispatches this harvest at the window and archives its own boards a few
      # minutes later - before this harvest can land - so P3 only ever archived the PREVIOUS Betr board (dated by its games
      # and labelled window a day late). This run archives the board it just captured, with the dispatch's label.
      - name: Archive the NBA board into Postgres
        if: ${{ success() && steps.lg.outputs.league == 'NBA' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARCHIVE_APPS: "betr"
          ARCHIVE_SPORT: "nba"
          ARCHIVE_LABEL: ${{ github.event.inputs.label || 'routine' }}
        run: |
          for i in 1 2 3; do
            python nba/archive_live_boards.py && exit 0
            echo "archive attempt $i failed - retrying"; sleep $((i * 10))
          done
          echo "::error::Betr board archive failed after 3 attempts"; exit 1
