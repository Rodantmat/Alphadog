name: NBA P2 Overnight Heavy

# PIPELINE 2 OF 3 (COMPASS fact 107). The heavy overnight run: mine last night's games, then rebuild
# the baseline for today's slate.
#
# CRON IS LIVE (2026-09-23): '45 15 * * *' - see the SCHEDULE block below for why the morning slot, the
# DST drift, and the measured runtime. The file name still says "overnight" for continuity with every
# document that references it; the pipeline itself now runs in the morning, after the referee posting.
# Until the season opens there are no games to mine, so runs will certify with "no games scheduled" and
# stay green rather than red - the certifier is season-aware.
#
# THIS IS A DELTA. It adds last night to a cumulative store, which has exactly one dangerous failure
# mode: a missed night is SILENT. Row counts still rise, nothing errors, and every as-of value computed
# after the hole is quietly wrong. So the pipeline AUDITS ITSELF against the schedule (step 2) and
# CERTIFIES its output (step 6), and both fail the job loudly. No `|| echo failed` anywhere — that
# pattern is how a missing 44% of the board went unnoticed for two days.

# SCHEDULE (owner decision 2026-09-23): P2 runs in the MORNING, not overnight.
#
# WHY THE MORNING. Two inputs decide it. (1) D1 referee assignments publish ~6-7 AM PT and are never
# archived, and this pipeline scrapes them as a baseline-stage factor - the old target of 09:00 UTC
# = 01:00 PT was five to six hours too early, which is exactly why nba_ref.referee_assignments held 0
# rows while the step ran nightly. (2) Last night's box scores must be final for the grading and delta
# steps, which they are by early morning. Nothing else pins this pipeline to the small hours.
#
# THE CRON AND DST. GitHub cron is UTC and does not shift with daylight time, and the season crosses the
# change (PDT -> PST on 2026-11-01), so the local hour drifts by one:
#     15:45 UTC = 08:45 PT during PDT (Oct)   = 07:45 PT during PST (Nov-Mar)
# Both land AFTER the 6-7 AM PT posting with wiggle room, and both leave the pipeline finishing around
# 10:40 / 09:40 PT against P3's 13:15 PT cutoff - roughly three hours of slack for a retry.
# The dedicated capture job (nba-referees.yml, 15:30 UTC) runs 15 minutes earlier, so the crew is
# usually already stored and P2's own scrape is an idempotent upsert on (game_date, matchup, slot).
#
# MEASURED RUNTIME (replay 2026-09-23, slate 2026-04-10, 5/5 certified): 2h10m total - grading 34 min,
# baseline singles ~18 min, periods ~43 min, combos and components ~15 min, as-of calibration 3m50s,
# confidence refit 12m27s, final_hp 2m03s. The grading window is now a rolling 7 days instead of every
# date since 2024-10, which removes ~32 min, so a full run with mining is ~1h55m.
on:
  schedule:
    - cron: '45 15 * * *'
  workflow_dispatch:
    inputs:
      asof:
        description: "slate date to build (blank = today PT). Use a past date to REPLAY/simulate."
        default: ""
        required: false
      skip_mining:
        description: "true = skip the scrape and only rebuild the baseline (for replay on existing data)"
        default: "false"
        required: false
      season:
        description: "season override for the gap audit and the confidence refit (blank = resolve from the date)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: alphadog-nba-p2-overnight
  cancel-in-progress: false

jobs:
  overnight:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy curl_cffi lxml html5lib

      - name: Resolve slate date
        id: d
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          A="${{ github.event.inputs.asof }}"
          if [ -z "$A" ]; then A=$(TZ=America/Los_Angeles date +%F); fi
          echo "asof=$A" >> $GITHUB_OUTPUT
          echo "Building slate for $A"
          # EMPTY SLATE GUARD (2026-09-23). On a date with no games the ladder builder dies with
          # KeyError: 'GAME_DATE' - the virtual-slate frame is empty, so the column never exists. The NBA
          # has off days all season (and every day before opening night), so an unattended P2 would go RED
          # on each one for a reason that is not a fault. The schedule decides: no games -> skip the
          # slate-dependent steps and let the certifier pass, which it already does season-aware.
          # Mining, the gap audit and grading still run: late box-score corrections land on off days.
          python - "$A" <<'EOF'
          import os, sys, psycopg
          slate = sys.argv[1]
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              # PRESEASON IS NOT A SLATE (2026-09-24). The documented decision: preseason is rejected for the
              # projection pipeline - never in player_game_log, rotations chaotic, stars rest - and is used
              # only for board and multiplier learning. nba_calendar.games labels those games 'Preseason', so
              # the gate counts REGULAR-SEASON games only: on a preseason day P2 does its mining and grading
              # and skips the build, exactly like an off day. Preseason starts 2026-10-03; opening night is
              # 2026-10-20, which is when the first baseline is built.
              n = c.execute("""SELECT count(*) FROM nba_calendar.games
                               WHERE game_date = %s AND coalesce(game_label, '') <> 'Preseason'""", (slate,)).fetchone()[0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_games={'1' if n else '0'}\n")
          print(f"{n} games scheduled on {slate}"
                + ("" if n else " - slate steps will be skipped, nothing is due"))
          EOF

      # 1) MINE last night. Bulk current-season refresh + per-game starters/officials for new games.
      - name: Daily delta ingestion
        if: ${{ github.event.inputs.skip_mining != 'true' }}
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          python nba/scrape_nba_daily_delta.py
          python nba/scrape_nba_per_game_delta.py

      # The DAY-BEFORE injury report (due 5 PM local the day before) is an overnight input: it is what
      # the baseline uses for availability before the day-of report lands in P3.
      - name: Injury report (day-before filing)
        if: ${{ github.event.inputs.skip_mining != 'true' }}
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # INJURY_MODE, not IR_MODE (verified in the script; my first guess was wrong). "daily" is the
          # default and is what an unattended run wants - it pulls the current snapshots. The other
          # modes are "probe" (a CDN diagnostic) and the backfill path, which needs INJURY_FROM/TO.
          INJURY_MODE: "daily"
        run: python nba/scrape_nba_injury_report.py

      # Per the parity doc's stage table these are BASELINE-stage factors, not day-of:
      #   D1 referee crew      - assignments post ~6-7 AM PT (9-10 AM ET), "crews rarely change after posting"
      #   M1 defender quality  - matchup shards from last night; a scratch only shifts it as a phase-2
      #                          DELTA, not a recompute
      # ⏰ TIMING IS WHAT MAKES THIS WORK (owner decision 2026-09-23). This step is correct HERE, but only
      # if P2 runs AFTER the morning posting. The old target cron (09:00 UTC = 01:00 PT) was five to six
      # hours too early, which is why nba_ref.referee_assignments held 0 rows while this ran nightly.
      # The cron below now starts P2 after the posting, with wiggle room. The logic is unchanged.
      - name: Referee assignments and per-game matchups (baseline-stage factors)
        if: ${{ github.event.inputs.skip_mining != 'true' }}
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REF_DATE: ${{ steps.d.outputs.asof }}
        run: |
          python nba/scrape_referee_assignments.py
          python nba/scrape_nba_matchups_pergame.py

      - name: Baseline inputs - season files, quarters, schedule
        if: ${{ github.event.inputs.skip_mining != 'true' }}
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PERIODS_SEASONS: "1"
        run: |
          python nba/sync_season_files_from_delta.py
          python nba/scrape_nba_periods.py
          python nba/scrape_nba_schedule.py

      - name: Commit mined data
        if: ${{ github.event.inputs.skip_mining != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/*.json || true
          if git diff --cached --quiet; then echo "No data changes."; else
            git commit -m "NBA P2 overnight mining [skip ci]"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
            done
          fi

      # 2) AUDIT THE DELTA. The one check that catches a silent hole - against the SCHEDULE, not itself.
      - name: Delta gap audit (no missing dates, games, teams or rosters)
        env:
          # BLANK = let check_delta_gaps.py resolve it with active_stats_season() (T23-2). A literal
          # here would override the script's fix and reintroduce the stale-season audit.
          GAP_SEASON: ${{ github.event.inputs.season }}
        run: python nba/check_delta_gaps.py

      # 3) GRADE last night's board. This must happen BEFORE the calibration refit, because the
      # as-of calibration and the confidence deductions both learn from graded outcomes - ungraded
      # legs mean yesterday's evidence is invisible to today's cells.
      - name: Grade last night's board outcomes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/grade_board_outcomes.py

      # 3a) RETENTION (owner rule 2026-09-24): "whatever shows on the board, we save; if a player shows
      # one leg, we save one leg." Yesterday's baseline was the full spectrum because the board was not
      # known when it was built. Now it is graded and the board is archived, so the off-board rungs have
      # no consumer - the build never reads a previous baseline (verified: zero references in the recipe
      # or the patcher), final_hp is built board-scoped, the refits join from graded board legs, and
      # interpolation was recorded day-of in board_scored. Measured 2026-04-10: 4,863 of 49,816 standard
      # rungs were on the PrizePicks board - 9.8%. Off days: the script refuses to delete when a slate has
      # no board keys, so a missing archive can never be mistaken for an empty board.
      - name: Prune yesterday's baseline to the board
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # KEYS FIRST (2026-09-26). P3 refreshes the day's keys at 13:15 PT; any board captured after
          # that (a late window, a close snapshot) is not in them, and the prune would delete those
          # rungs. The prune therefore refreshes yesterday's keys from the archive as it stands now.
          # One "yesterday", in Pacific time, for both.
          export PRUNE_DATE="$(TZ=America/Los_Angeles date -d yesterday +%F)"
          python - <<'EOF'
          import os, psycopg
          d = os.environ["PRUNE_DATE"]
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              n = c.execute("SELECT nba_market.refresh_board_rung_keys(%s, %s)", (d, d)).fetchone()[0]
              c.commit()
              print(f"board_rung_keys {d}: {n:,} keys (refreshed before the prune)", flush=True)
          EOF
          python nba/prune_baseline_to_board.py

      # 3b) PAPER TRADING (2026-09-21): fill hit / miss / void for logged picks from the freshly graded board.
      - name: Grade paper-trading picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              n = c.execute("SELECT nba_score.grade_paper_picks()").fetchone()[0]
          print(f"PAPER_GRADED|{n} picks")
          EOF

      # 4) MARKET inputs the baseline needs (blowout + matchup run on the real market line)
      - name: Market spreads and totals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/export_market_spreads.py

      # 5) BUILD the baseline ladder for today's slate - PER PROP PAIR. The builder is written to run
      # one pair per invocation (~8 min each); calling it once would silently produce only the default
      # pair and the slate would be missing most of the 30 props.
      # ENV NAMES ARE FROM THE SCRIPT, NOT GUESSED: BT_ASOF (slate), BT_PROPS (pair), BT_REPLAY (allow
      # a finished game when replaying), BT_CUTOFF (which as-of cutoff from nba_asof.py to read the
      # injury report at). The overnight run uses "baseline" = 09:00 ET.
      - name: Build baseline ladder (all prop pairs)
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          BT_ASOF: ${{ steps.d.outputs.asof }}
          BT_CUTOFF: "baseline"
          BT_REPLAY: ${{ github.event.inputs.asof != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          for PAIR in "points,rebounds" "assists,threes_made" "fga,fg3a" "ftm,fta" \
                      "fgm,dreb" "steals,blocks" "turnovers,personal_fouls" "oreb"; do
            echo "=== baseline pair: $PAIR"
            BT_PROPS="$PAIR" python nba/baseline/build_baseline_ladder.py
          done

      # Combos and periods have their own DAILY builders (the *_history.py versions are the season
      # backfills). Combos need the singles COMPONENTS pickled first - that is what BT_SAVE_COMPONENTS
      # does - so the order here is: components -> combos -> periods. Getting this order wrong produces
      # a slate with no combos, which is 44% of the board.
      - name: Components, combos and periods for today's slate
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          BT_ASOF: ${{ steps.d.outputs.asof }}
          BT_CUTOFF: "baseline"
          # NO BT_LADDER_STEPS - setting it would override the measured PER-PROP depth table in
          # classification_ladder_v12.py (LADDER_DEPTH). Points needs 14 rungs, steals needs 2; one
          # number cannot be right for both. Set it only to force a uniform depth for a diagnostic.
          BT_INJURY: "1"
          BT_REPLAY: ${{ github.event.inputs.asof != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p nba/backtest/reports
          for pair in points,rebounds assists,steals blocks,turnovers; do
            echo "=== components :: $pair"
            BT_SAVE_COMPONENTS=1 BT_PROPS=$pair python nba/baseline/build_baseline_ladder.py
          done
          python nba/baseline/build_combos_ladder.py
          python nba/baseline/build_periods_ladder.py

      # MERGE the per-pair artefacts into the single file the loader reads. The builder writes
      # nba_baseline_ladder_<asof>_<pair>.json per invocation; load_baseline_ladder.py reads
      # nba_baseline_ladder_<asof>.json. Without this step the loader finds nothing and aborts.
      # (It also has its own guard - "ABORT: artifact has no combo props" - which is why combos must
      # be built before the merge, not after.)
      - name: Merge per-pair ladders
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          BT_ASOF: ${{ steps.d.outputs.asof }}
        run: |
          set -euo pipefail
          rm -f nba/backtest/reports/_comp_*.pkl nba/backtest/reports/_p10_*.pkl nba/backtest/reports/_rel_stage1.pkl
          python - <<'EOF'
          import json, glob, os
          asof = os.environ["BT_ASOF"]; rows = []; meta = None
          for f in sorted(glob.glob(f"nba/data/nba_baseline_ladder_{asof}_*.json")):
              d = json.load(open(f)); rows += d["ladder"]; meta = meta or d["meta"]
          if not meta:
              raise SystemExit(f"ABORT: no per-pair ladder files for {asof} - the builds produced nothing")
          meta["rows"] = len(rows)
          meta["props"] = sorted({r["prop"] for r in rows})
          meta["players"] = len({r["player_id"] for r in rows})
          json.dump({"meta": meta, "ladder": rows}, open(f"nba/data/nba_baseline_ladder_{asof}.json", "w"))
          json.dump({"meta": meta, "ladder": rows}, open("nba/data/nba_baseline_ladder_latest.json", "w"))
          print("merged ladder:", {k: v for k, v in meta.items() if k not in ("factor_fits",)})
          for f in glob.glob(f"nba/data/nba_baseline_ladder_{asof}_*.json"):
              os.remove(f)
          EOF

      # COMMIT BEFORE LOADING. load_baseline_ladder.py fetches the artefact over HTTP from the repo
      # (raw.githubusercontent), NOT from the runner's local disk - so a ladder built but not committed
      # is invisible to it and the load 404s. This step is what makes the merged file reachable.
      - name: Commit the merged ladder
        if: ${{ steps.d.outputs.has_games == '1' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/nba_baseline_ladder_*.json || true
          if git diff --cached --quiet; then
            echo "ABORT: nothing to commit - the merge produced no ladder file"; exit 1
          fi
          git commit -m "NBA P2 baseline ladder ${{ steps.d.outputs.asof }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
          done
          exit 1

      - name: Load baseline into Postgres
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOAD_ASOF: ${{ steps.d.outputs.asof }}
        run: python nba/load_baseline_ladder.py

      # 6) REFIT the learned layers on everything graded up to LAST NIGHT - strictly before today,
      # so today's scoring never sees its own outcome.
      # SKIPPED ON A NO-GAME DAY (2026-09-23). These learn from graded outcomes; on an off day the grader
      # found no new dates, so a refit reproduces the cells it already wrote - measured at ~16 minutes
      # (calibration 3m50s + blowout 2s + confidence 12m27s) for an identical result. Off days are common
      # in season, so this is pure waste, not caution. The next game day refits as normal.
      - name: As-of ladder calibration
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # NO AC_SEASONS HERE (removed 2026-09-21). Passing one season made the builder delete EVERY season and
          # rebuild one; on 2026-09-20 03:24 UTC that wiped the whole calibration history. The builder now
          # rebuilds every season in final_hp, oldest first, and refuses to write an empty build.
        run: python nba/build_asof_calibration.py

      - name: Refit the blowout model
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/build_blowout_model.py

      - name: Refit the confidence deduction model
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # BLANK = build_confidence_v3.py uses stats_seasons(2) - the two most recent seasons with
          # real game data, which rolls by itself (T23-2).
          C3_SEASONS: ${{ github.event.inputs.season }}
        run: python nba/build_confidence_v3.py

      # 6b) FINAL_HP — THE SYSTEM'S HEADLINE OUTPUT, AND UNTIL NOW NO PIPELINE OWNED IT.
      # Recorded as "final_hp is rebuilt by NOTHING" (NBA_SYSTEM_DESIGN §4b). The cause was mechanical:
      # build_final_hp.py deleted season+prop while FE_DATE scoped the SELECT to one slate, so a daily
      # run would have wiped the season's history. That write scope is fixed (2026-09-23), so P2 can
      # own it. ORDER MATTERS: it reads ladder_calibration_asof and the confidence model, so it runs
      # AFTER both refits above - today's slate is built on cells refit from everything graded up to
      # last night. FE_DATE = this slate (seconds, not the ~90 minutes a full rebuild takes);
      # FE_SEASONS blank so the script resolves the live season itself; FE_WRITE=1 or it only reports.
      - name: Build final_hp for the slate
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FE_DATE: ${{ steps.d.outputs.asof }}
          FE_WRITE: "1"
        run: python nba/build_final_hp.py

      # 6) CERTIFY: today's baseline exists, >= 25 props, zero invalid probabilities
      - name: Certify P2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPE: "p2"
          CERT_DATE: ${{ steps.d.outputs.asof }}
        run: python nba/certify_pipeline.py
