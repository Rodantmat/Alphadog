name: NBA P2 Overnight Heavy (RETIRED - use P2A + P2B)

# RETIRED 2026-10-02 (owner decision: split P2 into P2A + P2B; strategy doc §29z-b/c).
#   nba-p2a-results.yml  - last night's results (mining, loads, gap audit, grading, prune, paper + slip grades)
#   nba-p2b-slate.yml    - today's slate (injury report, referee crews, morning line, refits, baseline, final_hp)
# Both are fired by the scheduler worker (alphadog-v2-nba-scheduler) at times computed from each day's first tip,
# and each is run-once guarded. This file is kept only so links and documents that name it resolve; it has no
# schedule and refuses to run, because running it would repeat P2A's and P2B's work (owner rule: no pipeline runs
# twice). The full previous content is in git history (last version before retirement: commit 0d00ec1).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::NBA P2 is retired (2026-10-02). Run nba-p2a-results.yml (last night) and nba-p2b-slate.yml (today's slate) instead - both run-once guarded."
          exit 1
