name: NBA Certify Candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Certify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/certify_candidates.py
