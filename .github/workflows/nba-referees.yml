name: NBA Referee Assignments (daily capture)

# D1: assignments post each MORNING (~6-7 AM PT) and are never archived. The historical crew comes from
# box scores (a faithful reconstruction - officials post before our 2:30 PM window, COMPASS fact 58),
# but the published ASSIGNMENT only exists going forward if we store it. This starts that archive.
#
# Phase 1 / baseline stage: a morning fact, not a window fact.
#
# 2026-10-07 (full-system certification pass G): the daily capture is OWNED BY P2B (nba-p2b-slate.yml "Referee crews", polled
# from the slate run until every game has a crew or the day's deadline; the scheduler recovers a dead P2B). This workflow's
# own 15:30 UTC cron ran the same scrape a second time every day (and at 07:30 PT in winter, not 08:30 - the comment assumed
# a fixed UTC-7). One capture path per fact: the cron is removed; the workflow stays for MANUAL recapture of a date.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "game date YYYY-MM-DD (blank = today Pacific)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-referees
  cancel-in-progress: false

jobs:
  referees:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" curl_cffi
      # PROXY FROM THE CREDENTIAL STORE (2026-10-08, full-system certification). The owner's rule keeps API keys and
      # credentials in nba_config.external_credentials; the proxy URL now lives there too ('proxy_url'), so a provider or
      # credential change is ONE row, not a secret edit in 30 workflows. The PROXY_URL secret stays as the fallback.
      # Every later step reads ${{ env.PROXY_URL || secrets.PROXY_URL }}. psql ships on the GitHub runner image.
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store -> $(echo "$P" | sed 's#.*@##')"
          else
            echo "proxy: credential store has no proxy_url row - using the PROXY_URL secret"
          fi

      - name: Capture referee assignments
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          REF_DATE: ${{ github.event.inputs.date || '' }}
        run: python nba/scrape_referee_assignments.py
