name: NBA Playoff Unders - gates and stress (research)

# strategy §31z: nba/research_playoff_unders.py - the pre-registered variant grid of the Playoff Unders rule through every gate
# (G1-G6) and stress (envelopes, decay, correlation, regular seasons); writes classification_config['playoff_unders'] (write_cfg=1).
on:
  workflow_dispatch:
    inputs:
      nulls:
        description: "walk-forward nulls"
        default: "50"
        required: false
      write_cfg:
        description: "1 = write the chosen rule to classification_config['playoff_unders']"
        default: "1"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-playoff-unders-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PU_NULL: ${{ github.event.inputs.nulls }}
      PU_WRITE_CFG: ${{ github.event.inputs.write_cfg }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy
      - name: Playoff Unders gates and stress
        run: python -u nba/research_playoff_unders.py
