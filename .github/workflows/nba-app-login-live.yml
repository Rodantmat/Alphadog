name: NBA App Login - live view (owner finishes the sign-in)

# Owner 2026-10-26 09:09 PT: "Give me the link for sleeper, let me try to resolve the puzzle and access just like you are doing".
# Same sign-in as nba-app-login.yml (same proxy session, location, device, pace), but the browser draws on this run's own screen and
# the owner sees and uses it through a PRIVATE link: noVNC behind a VNC password, exposed by a temporary Cloudflare quick tunnel (free,
# no account). The link and password are written ONLY to nba_config.external_credentials '<app>_live_view' (never to this public
# log) and deleted when the run ends. The worker types the login; the OWNER solves any challenge and finishes; the worker then
# stores the signed-in session ('<app>_session_state') exactly as the normal login does. Nothing creates or submits an entry.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "sleeper | fliff"
        required: true
        default: "sleeper"
      wait_minutes:
        description: "how long the live view waits for the owner (minutes)"
        required: false
        default: "25"

concurrency:
  group: nba-app-auth-${{ github.event.inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve proxy (credential store)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store"
          else
            echo "proxy: none"
          fi
      - name: System deps (Chrome fonts + Xvfb + VNC)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils x11vnc novnc websockify fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2t64 libgbm1 || \
          sudo apt-get install -y xvfb x11-utils x11vnc novnc websockify fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2 libgbm1
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase "proxy.py" "psycopg[binary]" curl_cffi
          sbase get chromedriver || true
      - name: Start the private live view
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP: ${{ github.event.inputs.app }}
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1400x950x24 >/dev/null 2>&1 &
          sleep 2
          PW=$(openssl rand -hex 6)
          echo "::add-mask::$PW"
          mkdir -p ~/.vnc && x11vnc -storepasswd "$PW" ~/.vnc/pw >/dev/null 2>&1
          x11vnc -display :99 -rfbauth ~/.vnc/pw -forever -shared -localhost -rfbport 5900 -quiet >/dev/null 2>&1 &
          websockify --web /usr/share/novnc 6080 localhost:5900 >/dev/null 2>&1 &
          /tmp/cloudflared tunnel --no-autoupdate --url http://localhost:6080 > /tmp/cf.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { echo "tunnel did not come up"; exit 1; }
          echo "::add-mask::$URL"
          VAL="{\"url\": \"$URL/vnc.html?autoconnect=1&resize=scale\", \"password\": \"$PW\"}"
          psql "$DATABASE_URL" -q -v k="${APP}_live_view" -v v="$VAL" <<'SQL'
          DELETE FROM nba_config.external_credentials WHERE credential_key = :'k';
          INSERT INTO nba_config.external_credentials (credential_key, credential_value_encrypted, updated_at) VALUES (:'k', :'v', now());
          SQL
          echo "live view up - link and password stored in the credential store (not printed)"
      - name: Sign in (owner finishes in the live view)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP: ${{ github.event.inputs.app }}
          APP_MODE: login
          LIVE_VIEW: "1"
          DISPLAY: ":99"
          SLEEPER_EMAIL: ${{ secrets.SLEEPER_EMAIL }}
          SLEEPER_PASSWORD: ${{ secrets.SLEEPER_PASSWORD }}
          FLIFF_EMAIL: ${{ secrets.FLIFF_EMAIL }}
          FLIFF_PASSWORD: ${{ secrets.FLIFF_PASSWORD }}
        run: |
          export LIVE_WAIT_S=$(( ${{ github.event.inputs.wait_minutes }} * 60 ))
          python nba/app_login.py
      - name: Close the live view
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP: ${{ github.event.inputs.app }}
        run: |
          psql "$DATABASE_URL" -q -c "DELETE FROM nba_config.external_credentials WHERE credential_key = '${APP}_live_view'" || true
          pkill -f cloudflared || true
          echo "live view closed"
