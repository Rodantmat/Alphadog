name: NBA Ladder Tail Research

# §31s G2: is the PRODUCTION probability (walk-forward monthly Platt; raw where a cell has < 1,000 samples) calibrated BEYOND
# each prop's current production depth? The production builders exit right after writing the ladder (raise SystemExit(0)),
# before any report, so this runs RESEARCH COPIES whose single change is to dump the in-memory reliability frame just before
# that exit. Builders run exactly as P2B does (components -> combos) at BT_LADDER_STEPS=24. Analysis de-duplicates rungs per
# (player, game, prop, line) keeping the last offset EXACTLY as the builder does (floor-collapsed rungs repeat), and reads each
# prop's current production depth FROM THE CODE (singles: LADDER_DEPTH in the production builder; combos: the BT_LADDER_STEPS
# default in the combos builder, which P2B leaves unset). Runner files only; no DB writes.
on:
  workflow_dispatch:
    inputs:
      asof:
        default: "2026-04-10"
        required: false
      steps:
        default: "24"
        required: false

permissions:
  contents: read

jobs:
  tails:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BT_ASOF: ${{ github.event.inputs.asof }}
      BT_REPLAY: "1"
      BT_CUTOFF: baseline
      BT_LADDER_STEPS: ${{ github.event.inputs.steps }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy curl_cffi lxml html5lib pdfplumber
      - name: Research copies (dump the reliability frame before the production exit)
        run: |
          python - <<'EOF'
          from pathlib import Path
          dump = ('rel[["prop","offset","p_over","actual","month","line","PLAYER_ID","GAME_ID"]].to_pickle("nba/backtest/reports/_tailrel_" + '
                  '(os.environ.get("BT_PROPS") or "combos").replace(",", "-") + ".pkl"); raise SystemExit(0)')
          for src, dst in (("nba/baseline/build_baseline_ladder.py", "nba/baseline/_tail_main.py"),
                           ("nba/baseline/build_combos_ladder.py", "nba/baseline/_tail_combos.py")):
              t = Path(src).read_text()
              n = t.count("raise SystemExit(0)")
              assert n == 1, f"{src}: expected exactly one production exit, found {n}"
              Path(dst).write_text(t.replace("raise SystemExit(0)", dump))
              print("research copy:", dst)
          EOF
      - name: Components (as P2B)
        run: |
          set -o pipefail
          mkdir -p nba/backtest/reports logs
          for pair in points,rebounds assists,steals blocks,turnovers; do
            echo "=== components :: $pair"
            BT_SAVE_COMPONENTS=1 BT_PROPS=$pair python nba/baseline/_tail_main.py > "logs/comp_${pair//,/_}.log" 2>&1 || { tail -40 "logs/comp_${pair//,/_}.log"; exit 1; }
          done
      - name: Combos (as P2B)
        run: |
          set -o pipefail
          python nba/baseline/_tail_combos.py > logs/combos.log 2>&1 || { tail -60 logs/combos.log; exit 1; }
      - name: Calibration within vs beyond each prop's current production depth
        run: |
          python - <<'EOF'
          import ast, glob, re, numpy as np, pandas as pd
          from pathlib import Path
          main_src = Path("nba/backtest/classification_ladder_v12.py").read_text()
          m = re.search(r"LADDER_DEPTH = (\{.*?\})", main_src, re.S); assert m, "LADDER_DEPTH not found in the certified recipe"
          singles_depth = ast.literal_eval(m.group(1))
          cm = re.search(r'BT_LADDER_STEPS", "(\d+)"', Path("nba/baseline/build_combos_ladder.py").read_text()); assert cm, "combos default depth not found"
          combos_depth = int(cm.group(1))
          print("production depth (read from code): singles", singles_depth, "| combos builder default", combos_depth)
          frames = []
          for f in sorted(glob.glob("nba/backtest/reports/_tailrel_*.pkl")):
              d = pd.read_pickle(f); d["src"] = "combos" if f.endswith("_combos.pkl") else "main"; frames.append(d); print("frame", f, len(d))
          rel = pd.concat(frames, ignore_index=True)
          rel = rel[rel["p_over"].notna() & rel["actual"].notna()]
          before = len(rel)
          rel = rel.sort_values("offset").drop_duplicates(subset=["PLAYER_ID", "GAME_ID", "prop", "line"], keep="last")
          print(f"rungs {before:,} -> {len(rel):,} after production de-duplication")
          def ll(p, y):
              p = np.clip(p, 1e-6, 1 - 1e-6); return float(-np.mean(y * np.log(p) + (1 - y) * np.log(1 - p)))
          for (src, prop), g in rel.groupby(["src", "prop"]):
              depth = combos_depth if src == "combos" else singles_depth.get(prop, 10)
              w = g[g["offset"].abs() <= depth]; b = g[g["offset"].abs() > depth]
              line = f"\n== {prop} [{src}] production depth {depth}: WITHIN n {len(w):,} pred {w['p_over'].mean():.4f} act {w['actual'].mean():.4f} ll {ll(w['p_over'].values, w['actual'].values):.4f}"
              if len(b):
                  line += f" | BEYOND n {len(b):,} pred {b['p_over'].mean():.4f} act {b['actual'].mean():.4f} ll {ll(b['p_over'].values, b['actual'].values):.4f}"
              print(line)
              if len(b):
                  for lo, hi in ((0, .02), (.02, .1), (.1, .3), (.3, .7), (.7, .9), (.9, .98), (.98, 1.01)):
                      h = b[(b["p_over"] >= lo) & (b["p_over"] < hi)]
                      if len(h) >= 200:
                          print(f"     beyond, pred {lo:.2f}-{hi:.2f}: n {len(h):>8,} | pred {h['p_over'].mean():.4f} | actual {h['actual'].mean():.4f} | gap {100*(h['actual'].mean()-h['p_over'].mean()):+.2f} pp")
          EOF
