name: NBA Research Angles

# §30y: new research angles (travel/circadian, public Over bias, count skew, correlated-parlay liability), both apps. Read-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Research
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/research_angles.py
