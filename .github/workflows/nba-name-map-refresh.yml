name: NBA Name Map Refresh

# §31b: on-demand run of the daily player name map refresh (P2B runs it every day).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/refresh_player_name_map.py
