name: NBA Gate-2 Backtest

# §31s gate 2: slip-engine backtest of a test leg source against a same-day control, main + steals-free families, then the
# comparison and cleanup. The certified tables are never written (every build has a suffix; the engine REFUSES a test source
# without one).
on:
  workflow_dispatch:
    inputs:
      legs_table:
        description: "test leg source, e.g. nba_score.tier_map_legs_wi"
        default: "nba_score.tier_map_legs_wi"
        required: false
      tag:
        description: "short tag for the test arm's table suffix (letters only)"
        default: "wi"
        required: false
      new_legs:
        description: "SQL predicate on a legs_json element j marking a new leg"
        default: "(j->>'line')::numeric = floor((j->>'line')::numeric)"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-slip-engine
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SE_CAP: "6"
      SE_SIZES: "3,4,5"
      SE_DIVERSIFY: "1"
      SE_SAMETEAM: "0"
      SE_LOWFOUL: "1"
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Builds (control + test, main + steals-free)
        env:
          TEST_LEGS: ${{ github.event.inputs.legs_table }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[a-z]+$ ]] || { echo "invalid tag"; exit 1; }
          b () { echo "=== build $1 (legs '${2:-certified}', exclude '$3') $(date -u +%H:%M:%S)"
                 SE_TABLE_SUFFIX="$1" SE_LEGS_TABLE="${2:-nba_score.tier_map_legs}" SE_EXCLUDE_CELLS="$3" python -u nba/build_slip_engine.py | tail -2; }
          b "_g2_ctrl"              ""            ""
          b "_g2_${TAG}"            "$TEST_LEGS"  ""
          b "_nosteals_g2_ctrl"     ""            "steals_R,steals_R_U"
          b "_nosteals_g2_${TAG}"   "$TEST_LEGS"  "steals_R,steals_R_U"
      - name: Compare
        env:
          G2_ARMS: "ctrl:_g2_ctrl,test:_g2_${{ github.event.inputs.tag }}"
          G2_NEW_LEGS: ${{ github.event.inputs.new_legs }}
        run: python -u nba/gate2_compare.py
      - name: Drop the test slip tables
        if: always()
        run: |
          python - <<'EOF'
          import os, psycopg
          tag = os.environ["TAG"]
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              for base in ("slip_engine_slips", "slip_engine_legs"):
                  for sfx in ("_g2_ctrl", f"_g2_{tag}", "_nosteals_g2_ctrl", f"_nosteals_g2_{tag}"):
                      c.execute(f"DROP TABLE IF EXISTS nba_score.{base}{sfx}")
              print("test slip tables dropped")
          EOF
