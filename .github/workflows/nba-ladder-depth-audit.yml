name: NBA Ladder Depth Audit

# §31s G2: read-only - unscored half-point board legs vs the modelled ladder edge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/ladder_depth_audit.py
