name: NBA Daily Delta Ingestion

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_DAILY_DELTA.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-daily-delta
  cancel-in-progress: false

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip curl_cffi

      - name: Run daily delta ingestion (current season bulk refresh)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_daily_delta.py
        continue-on-error: true

      - name: Commit delta JSON to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in nba/data/nba_delta_player_game_log.json nba/data/nba_delta_player_game_log_advanced.json nba/data/nba_delta_team_game_log.json nba/data/nba_delta_team_game_log_advanced.json nba/data/nba_daily_delta_meta.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No delta JSON changes to commit."
            exit 0
          fi
          git commit -m "NBA daily delta ingestion data [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
