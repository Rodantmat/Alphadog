name: NBA Integration Test (rolled back)

# §31q: PP pick -> grade -> edge monitor and UD pick -> grade -> edge monitor through the production entry points on a real
# slate, inside one transaction that is rolled back. Fails the run if any assertion fails or the ledgers change.
on:
  workflow_dispatch:
    inputs:
      date:
        default: "2026-01-10"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy
      - name: Integration test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IT_DATE: ${{ github.event.inputs.date }}
          UD_EXCL_CENTER: "1"
        run: python -u nba/integration_test_rollback.py
