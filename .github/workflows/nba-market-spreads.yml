name: NBA Export Market Spreads

# Puts the morning market spread and total per game into nba/data/ so the baseline recipe (which runs on
# Actions with no database access) can use the real line instead of its derived proxy (r=0.46, MAE 11.5).
# The morning snapshot is 08:00 PT, before any phase-1 build, so it is as-of legal on a past day.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "comma-separated"
        default: "2024-25,2025-26"
        required: false

permissions:
  contents: write

concurrency:
  group: alphadog-nba-market-spreads
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MS_SEASONS: ${{ github.event.inputs.seasons || '2024-25,2025-26' }}
        run: python nba/export_market_spreads.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/nba_market_spreads_*.json || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "NBA market spreads export [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
          done
          exit 1
