name: NBA P2B Slate (today's baseline)

# PIPELINE 2B OF 4 (2026-10-02, owner decision: split P2 into P2A + P2B; strategy doc §29z-b/c).
# Everything about TODAY's slate that must exist before P3: the day-before injury report as of 09:00 ET (the
# baseline cutoff, nba_asof.BASELINE_CUTOFF_LOCAL), the referee crews (a baseline-stage factor, D1), today's
# MORNING game line (captured live here - it was never captured live before, §29z-c), the market export, the model
# refits on everything P2A just graded, today's baseline ladder, final_hp, certification.
#
# WHEN: fired by the scheduler worker at min(08:05 PT, P3 - 110 min) and only after P2A succeeded. 08:05 PT on a normal
# day is right after the 08:00 PT morning-line snapshot the baseline is validated on, with the crews posted (~6-7 AM
# PT, ~9 AM ET). On an early slate it runs earlier, uses the line as it stands then, and waits for the crews only as
# long as the day allows (below); a crew still missing falls back to the documented D1 fallback model.
# Every build step was taken verbatim from P2 (nba-p2-overnight-heavy.yml, now retired).
#
# RUN-ONCE (owner rule): the claim job stops any second run for the same slate date.

on:
  # NO GitHub schedule: P2B depends on P2A, so only the scheduler worker starts it (it waits for P2A to finish).
  # An independent GitHub fire could claim and start P2B while P2A was still running.
  workflow_dispatch:
    inputs:
      force:
        description: "'true' = run even if this slate already ran (deliberate recovery only; the run-once guard records it)"
        default: ""
        required: false
      asof:
        description: "slate date to build (blank = today PT). Use a past date to REPLAY/simulate."
        default: ""
        required: false
      skip_mining:
        description: "true = skip the scrapes and only rebuild the baseline (for replay on existing data)"
        default: "false"
        required: false
      season:
        description: "season override for the confidence refit (blank = resolve from the date)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: alphadog-nba-p2b
  cancel-in-progress: false

jobs:
  # RUN-ONCE GUARD (owner rule: NO PIPELINE RUNS TWICE).
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proceed: ${{ steps.c.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "psycopg[binary]"
      - name: Run-once claim
        id: c
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: claim
          PIPELINE: P2B
          IN_ASOF: ${{ github.event.inputs.asof }}
          FORCE: ${{ github.event.inputs.force }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: python -u nba/pipeline_claim.py

  slate:
    needs: claim
    if: ${{ needs.claim.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300   # crew poll (up to P3 - build budget) + ~110 min build/load must fit (round 2 P2B#15)
    outputs:
      soft_failed: ${{ steps.soft.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy curl_cffi lxml html5lib pdfplumber

      - name: Resolve slate date and the day's deadlines
        id: d
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          A="${{ github.event.inputs.asof }}"
          if [ -z "$A" ]; then A=$(TZ=America/Los_Angeles date +%F); fi
          echo "asof=$A" >> $GITHUB_OUTPUT
          python - "$A" <<'EOF'
          import os, sys, psycopg
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          PT = ZoneInfo("America/Los_Angeles")
          slate = sys.argv[1]
          # REGULAR-SEASON games only (preseason is not a slate - documented decision 2026-09-24); the same label
          # pattern as the live engine's season_block() so postseason/All-Star events never count.
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              # ... the ONE slate predicate since round 2 (2026-10-08): nba_calendar.regular_season_games (game-id prefix 002)
              # §31w P-6 (2026-10-08): the SLATE predicate is nba_calendar.slate_games (002 + play-in 005 + playoffs 004; preseason,
              # All-Star and the Cup Final stay out) - a play-in / playoff morning builds its slate like any other
              n, first = c.execute("""SELECT count(*), min(game_datetime_utc) FROM nba_calendar.slate_games WHERE game_date = %s""",
                                   (slate,)).fetchone()
          d = datetime.fromisoformat(slate).date()
          cutoff = datetime(d.year, d.month, d.day, 13, 15, tzinfo=PT)
          p3 = min(cutoff, first.astimezone(PT) - timedelta(minutes=30)) if first else cutoff
          # the crews may be waited for until the build would no longer finish before P3. BUILD BUDGET (round-2 P2B#15,
          # 2026-10-08): the full-slate build is ~95 min (8 pairs + components + combos + periods) plus loads, refits and
          # final_hp (~15 min); the old 85-min allowance let a late crew post push the build past P3 on a normal day
          # (P3 13:15, poll until 11:50, build to 13:25). Tunable: nba_config.classification_config 'p2b_build_budget_min'
          # ({"minutes": N}); default 125. The job timeout is 300 min for the same reason.
          budget = 125
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              row = c.execute("SELECT config_json FROM nba_config.classification_config WHERE config_key = 'p2b_build_budget_min'").fetchone()
          if row:
              try:
                  import json as _json
                  budget = int((row[0] if isinstance(row[0], dict) else _json.loads(row[0]))["minutes"])
              except Exception as exc:  # noqa: BLE001
                  print(f"p2b_build_budget_min unreadable ({exc}) - default {budget}")
          ref_deadline = p3 - timedelta(minutes=budget)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"has_games={'1' if n else '0'}\n")
              f.write(f"ref_deadline={ref_deadline.astimezone(timezone.utc).isoformat()}\n")
          print(f"{n} regular-season games on {slate}; first tip {first.astimezone(PT):%H:%M} PT" if first else f"no games on {slate}")
          print(f"P3 at {p3:%H:%M} PT; crews waited for until {ref_deadline:%H:%M} PT at the latest")
          EOF

      # The DAY-BEFORE injury report (due 5 PM local the day before) as the baseline reads it at its 09:00 ET cutoff.
      # DAILY ROSTERS (§31r, 2026-10-05). Rosters were refreshed only by P1 (weekly, Mondays): a Tuesday trade was invisible
      # until the next Monday, and the ladder builder projected only each team's last-3-games participants (traded, returning
      # and early-season players unprojectable - 2.6-3% of played board player-days, which the certified backtest DID score).
      # commonallplayers is ONE request; refreshed here every morning it feeds the builder's current-roster rule (file) and the
      # live loader's roster fallback (nba_ref.players). A failed scrape restores the committed weekly file (never an empty one).
      # PROXY FROM THE CREDENTIAL STORE (2026-10-08, full-system certification). The owner's rule keeps API keys and
      # credentials in nba_config.external_credentials; the proxy URL now lives there too ('proxy_url'), so a provider or
      # credential change is ONE row, not a secret edit in 30 workflows. The PROXY_URL secret stays as the fallback.
      # Every later step reads ${{ env.PROXY_URL || secrets.PROXY_URL }}. psql ships on the GitHub runner image.
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store -> $(echo "$P" | sed 's#.*@##')"
          else
            echo "proxy: credential store has no proxy_url row - using the PROXY_URL secret"
          fi

      - name: Refresh today's rosters (commonallplayers)
        id: soft_rosters
        continue-on-error: true
        env:
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
        run: |
          python nba/scrape_nba_stats_players.py || {
            echo "::warning::roster scrape failed - restoring the committed weekly roster file (P1)"
            git checkout -- nba/data/nba_players_current.json nba/data/nba_players_current_meta.json
            exit 1
          }

      - name: Apply today's rosters to nba_ref.players
        id: soft_rosters_apply
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/sync_current_rosters.py

      # PLAYER NAME MAP REFRESH (§31b, 2026-10-03 wiring audit): every name join on both apps resolves through
      # nba_ref.player_name_map; its source register is refreshed only manually and lacked every 2026-27 newcomer
      # (44 of 629 active players unresolved - their legs silently dropped). Incremental from the P1-maintained roster,
      # collision-safe, never deletes. Before the baseline / final_hp so today's scores include every active player.
      - name: Refresh the player name map
        id: soft_namemap
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/refresh_player_name_map.py

      - name: Injury report (day-before filing)
        id: soft_injury
        if: ${{ github.event.inputs.skip_mining != 'true' }}
        continue-on-error: true   # the builder has a documented fallback (last committed report / P(plays) prior); visible in the soft list
        env:
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          INJURY_MODE: "daily"
          INJURY_EXPECT: ${{ steps.d.outputs.has_games == '1' && '1' || '0' }}   # a slate day must find the day-before filings (round 2 P3#14)
        run: timeout --signal=TERM --kill-after=30s 600 python nba/scrape_nba_injury_report.py

      # STORE THE DAY-BEFORE SNAPSHOTS TOO (retention audit 2026-10-08): the morning scrape was committed as JSON but only P3
      # loaded injury snapshots into nba_daily.injury_report_snapshots, so a missed P3 lost the day's filings from the DB.
      # The loader is idempotent per (game_date, snapshot_ts, team, player); P3's load later adds the day-of filings.
      - name: Load the day-before injury snapshots into Postgres
        if: ${{ github.event.inputs.skip_mining != 'true' && steps.soft_injury.outcome == 'success' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INJURY_LOAD_MODE: "current"
        run: python nba/load_injury_report.py

      # D1 REFEREE CREWS - a baseline-stage factor that posts ~6-7 AM PT (~9 AM ET) and is never archived. Poll until
      # every scheduled game has a crew, or until the day's own deadline (so an early slate is never made late by
      # waiting); a crew still missing then falls back to the documented D1 fallback model. Never fails the slate.
      - name: Referee crews (polled until posted or the day's deadline)
        if: ${{ github.event.inputs.skip_mining != 'true' && steps.d.outputs.has_games == '1' }}
        env:
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REF_DATE: ${{ steps.d.outputs.asof }}
          REF_DEADLINE: ${{ steps.d.outputs.ref_deadline }}
        run: |
          set +e
          python - <<'EOF'
          import os, subprocess, time, psycopg
          from datetime import datetime, timezone
          deadline = datetime.fromisoformat(os.environ["REF_DEADLINE"])
          slate = os.environ["REF_DATE"]
          def status():
              with psycopg.connect(os.environ["DATABASE_URL"]) as c:
                  games = c.execute("SELECT count(*) FROM nba_calendar.regular_season_games WHERE game_date=%s", (slate,)).fetchone()[0]
                  crews = c.execute("SELECT count(DISTINCT matchup) FROM nba_ref.referee_assignments WHERE game_date=%s", (slate,)).fetchone()[0]
              return games, crews
          attempt = 0
          while True:
              attempt += 1
              r = subprocess.run(["python", "nba/scrape_referee_assignments.py"], capture_output=True, text=True)
              print(r.stdout[-1500:], r.stderr[-800:], flush=True)
              games, crews = status()
              print(f"attempt {attempt}: crews for {crews} of {games} games", flush=True)
              if games and crews >= games:
                  print("all crews posted"); break
              if datetime.now(timezone.utc) >= deadline:
                  print(f"::warning::{slate}: crews for {crews} of {games} games by the deadline - the rest use the D1 fallback model"); break
              time.sleep(min(300, max(30, (deadline - datetime.now(timezone.utc)).total_seconds())))
          EOF
          exit 0

      # TODAY'S MORNING GAME LINE, captured live (§29z-c) - as of min(08:00 PT, now). Then the export the baseline
      # reads. Both never fail the slate: the baseline has a documented fallback (the derived spread proxy).
      - name: Morning game line (live capture) and market export
        id: soft_line
        if: ${{ steps.d.outputs.has_games == '1' }}
        continue-on-error: true   # "never fail the slate" (the recipe falls back to the derived spread, printed); round 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GL_DATE: ${{ steps.d.outputs.asof }}
        run: |
          python nba/capture_game_lines_morning.py
          python nba/export_market_spreads.py

      # MORNING DFS BOARD SNAPSHOT (§30y, 2026-10-03). Operator line shading - does a line PrizePicks / Underdog RAISES
      # during the day carry Under value? - needs a DFS board BEFORE the 1:15 PM PT window; only window and close
      # existed. Research capture only: continue-on-error, each board capped at 5 minutes, never blocks the slate.
      - name: Morning DFS board snapshot (research capture)
        id: soft_morning_board
        if: ${{ steps.d.outputs.has_games == '1' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          BT_ASOF: ${{ steps.d.outputs.asof }}
          PP_NBA_OUT_DIR: "boards"          # NBA-owned PrizePicks producer (round 2 P3#10; equivalence probe 37744844157)
          PP_NBA_MIN_FUTURE_ROWS: "50"
          UNDERDOG_SPORTS: "NBA"
          UNDERDOG_OUT_DIR: "boards"
          ARCHIVE_LABEL: "morning"
          ARCHIVE_SPORT: "nba"
          ARCHIVE_APPS: "prizepicks,underdog"
        run: |
          set -uo pipefail
          # ARCHIVE ONLY WHAT THIS RUN CAPTURED (round-2 P2B#17, 2026-10-08, the G-7 rule applied here): a timed-out or failed
          # pull leaves the checked-out file from an earlier run on disk; archiving it as today's 'morning' snapshot would
          # stamp stale lines with a fresh label. Apps are added to ARCHIVE_APPS only when their scraper exited 0.
          ok=""
          if timeout --signal=TERM --kill-after=30s 300 python nba/scrape_prizepicks_nba_board.py > /tmp/pp_morning.log 2>&1; then ok="$ok,prizepicks"; else echo "=== PrizePicks morning pull failed/timed out"; fi
          tail -n 10 /tmp/pp_morning.log
          if timeout --signal=TERM --kill-after=30s 300 python nba/scrape_underdog_board.py > /tmp/ud_morning.log 2>&1; then ok="$ok,underdog"; else echo "=== Underdog morning pull failed/timed out"; fi
          tail -n 10 /tmp/ud_morning.log
          # SLEEPER + FLIFF MORNING SNAPSHOTS (retention audit 2026-10-08): these boards reached Postgres once a day (P3's
          # 'window' label); their 2-hourly pulls lived only as git commits of a *_current.json. Captured here in parallel
          # (each bounded 5 min) so every app has a morning and a window record, like PrizePicks and Underdog.
          SLEEPER_SPORTS=nba SLEEPER_OUT_DIR=boards timeout --signal=TERM --kill-after=30s 300 python nba/scrape_sleeper_board.py > /tmp/sl_morning.log 2>&1 & p_sl=$!
          FLIFF_SPORTS=nba timeout --signal=TERM --kill-after=30s 300 python nba/scrape_fliff_board.py > /tmp/fl_morning.log 2>&1 & p_fl=$!
          if wait $p_sl; then ok="$ok,sleeper"; else echo "=== Sleeper morning pull failed/timed out"; fi; tail -n 5 /tmp/sl_morning.log
          if wait $p_fl; then ok="$ok,fliff"; else echo "=== Fliff morning pull failed/timed out"; fi; tail -n 5 /tmp/fl_morning.log
          ok="${ok#,}"
          if [ -z "$ok" ]; then echo "::warning::no morning board captured - nothing archived as 'morning'"; else
            echo "archiving morning boards for: $ok"
            ARCHIVE_APPS="$ok" python nba/archive_live_boards.py
          fi
          # THE KEYS final_hp PRICES AGAINST (2026-10-08, certification round 2): build_final_hp reads TODAY's rungs from
          # nba_market.board_rung_keys, which only P2A (for yesterday) and P3 (after its 13:16 PT archive) refreshed - so the
          # slate's final_hp covered the board as of YESTERDAY's window and missed every rung posted overnight / this morning
          # (new players above all; the derived +-10 rungs cover line moves of players already on the board). Refresh here,
          # after the morning archive and before the ladder build, for the slate date.
          python - <<'EOF'
          import os, psycopg
          d = os.environ["BT_ASOF"]
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              n = c.execute("SELECT nba_market.refresh_board_rung_keys(%s, %s)", (d, d)).fetchone()[0]
              c.commit()
              print(f"board_rung_keys {d}: {n:,} keys (refreshed after the morning archive, before the ladder build)", flush=True)
          EOF

      - name: Commit today's inputs
        # conflict-safe commit (2026-10-07, nba/git_push_retry.sh): P1 and P2B both refresh the roster files
        run: bash nba/git_push_retry.sh "NBA P2B inputs ${{ steps.d.outputs.asof }} [skip ci]" nba/data/*.json || echo "::warning::P2B input files did not reach the repo (the build below uses the runner's copies)"

      # 5) BUILD the baseline ladder for today's slate - PER PROP PAIR (from P2; BT_CUTOFF "baseline" = 09:00 ET).
      - name: Build baseline ladder (all prop pairs)
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          BT_ASOF: ${{ steps.d.outputs.asof }}
          BT_CUTOFF: "baseline"
          BT_REPLAY: ${{ github.event.inputs.asof != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          # the current season's input files must EXIST (empty is fine) so the first slates are modelled as a new season,
          # not as late games of the previous one (nba/ensure_season_files.py - certification round 2); never committed.
          python nba/ensure_season_files.py
          for PAIR in "points,rebounds" "assists,threes_made" "fga,fg3a" "ftm,fta" \
                      "fgm,dreb" "steals,blocks" "turnovers,personal_fouls" "oreb"; do
            echo "=== baseline pair: $PAIR"
            BT_PROPS="$PAIR" python nba/baseline/build_baseline_ladder.py
          done

      # Components -> combos -> periods (order matters: no combos = 44% of the board missing).
      - name: Components, combos and periods for today's slate
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          BT_ASOF: ${{ steps.d.outputs.asof }}
          BT_CUTOFF: "baseline"
          BT_INJURY: "1"
          BT_REPLAY: ${{ github.event.inputs.asof != '' && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p nba/backtest/reports
          for pair in points,rebounds assists,steals blocks,turnovers; do
            echo "=== components :: $pair"
            BT_SAVE_COMPONENTS=1 BT_PROPS=$pair python nba/baseline/build_baseline_ladder.py
          done
          python nba/baseline/build_combos_ladder.py
          python nba/baseline/build_periods_ladder.py

      - name: Merge per-pair ladders
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          BT_ASOF: ${{ steps.d.outputs.asof }}
        run: |
          set -euo pipefail
          rm -f nba/backtest/reports/_comp_*.pkl nba/backtest/reports/_p10_*.pkl nba/backtest/reports/_rel_stage1.pkl
          python - <<'EOF'
          import json, glob, os
          asof = os.environ["BT_ASOF"]; rows = []; meta = None
          for f in sorted(glob.glob(f"nba/data/nba_baseline_ladder_{asof}_*.json")):
              d = json.load(open(f)); rows += d["ladder"]; meta = meta or d["meta"]
          if not meta:
              raise SystemExit(f"ABORT: no per-pair ladder files for {asof} - the builds produced nothing")
          # ONE ROW PER RUNG (round-2 P2B#13, 2026-10-08): the components step rebuilds assists/steals/blocks/turnovers that
          # the ladder loop already built (measured: 4,107 duplicate keys, identical values), so the merged file carried
          # them twice and meta.rows was inflated; the loader deduped them silently. Dedupe here, first copy wins.
          seen, uniq, dups = set(), [], 0
          for r in rows:
              k = (r.get("player_id"), r.get("game_id"), r.get("prop"), r.get("period") or "FULL", r.get("line"))
              if k in seen:
                  dups += 1; continue
              seen.add(k); uniq.append(r)
          rows = uniq
          print(f"merge: {dups:,} duplicate rungs dropped (component pairs rebuilt by the components step)")
          meta["rows"] = len(rows)
          meta["props"] = sorted({r["prop"] for r in rows})
          meta["players"] = len({r["player_id"] for r in rows})
          # the dated record is GZIPPED (round-2 P2B#18, 2026-10-08): 15-38 MB of JSON per slate x ~165 slates was ~4 GB of
          # repo growth per season; gzip is ~8x smaller. 'latest' stays plain JSON for the loader and any local reader;
          # the loader reads either form (nba_baseline_ladder_<asof>.json or .json.gz).
          import gzip
          with gzip.open(f"nba/data/nba_baseline_ladder_{asof}.json.gz", "wt", encoding="utf-8") as g:
              json.dump({"meta": meta, "ladder": rows}, g)
          json.dump({"meta": meta, "ladder": rows}, open("nba/data/nba_baseline_ladder_latest.json", "w"))
          print("merged ladder:", {k: v for k, v in meta.items() if k not in ("factor_fits",)})
          for f in glob.glob(f"nba/data/nba_baseline_ladder_{asof}_*.json"):
              os.remove(f)
          EOF

      # COMMIT BEFORE LOADING: the loader fetches the artefact over HTTP from the repo.
      - name: Commit the merged ladder
        if: ${{ steps.d.outputs.has_games == '1' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the merge must have PRODUCED the slate's ladder file; an UNCHANGED file is fine (a forced recovery after a
          # failure downstream of this commit rebuilds a byte-identical ladder - "one set per day" - and used to die here
          # with "nothing to commit"; certification round 2, 2026-10-08)
          if [ ! -s "nba/data/nba_baseline_ladder_${{ steps.d.outputs.asof }}.json.gz" ]; then
            echo "ABORT: the merge produced no ladder file for ${{ steps.d.outputs.asof }}"; exit 1
          fi
          git add nba/data/nba_baseline_ladder_*.json nba/data/nba_baseline_ladder_*.json.gz || true
          if git diff --cached --quiet; then
            echo "ladder for ${{ steps.d.outputs.asof }} is unchanged from the committed copy (rerun) - nothing to commit, continuing"
          fi
          git reset -q   # the helper stages, commits and pushes conflict-safely (2026-10-07)
          bash nba/git_push_retry.sh "NBA P2B baseline ladder ${{ steps.d.outputs.asof }} [skip ci]" nba/data/nba_baseline_ladder_*.json nba/data/nba_baseline_ladder_*.json.gz

      - name: Load baseline into Postgres
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOAD_ASOF: ${{ steps.d.outputs.asof }}
        run: python nba/load_baseline_ladder.py

      # 6) REFIT the learned layers on everything P2A graded up to last night (kept in the morning, as P2 did, so they
      # see what the backtest saw - including overnight stat corrections). Skipped on a no-game day (identical result).
      - name: As-of ladder calibration
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/build_asof_calibration.py

      - name: Refit the blowout model
        id: soft_blowout
        if: ${{ steps.d.outputs.has_games == '1' }}
        continue-on-error: true   # nba_score.blowout_model has NO production reader (the recipe derives P_BLOWOUT in-run) - research on the critical path; round 2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/build_blowout_model.py

      - name: Refit the confidence deduction model
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          C3_SEASONS: ${{ github.event.inputs.season }}
        run: python nba/build_confidence_v3.py

      # 6a-bis) PARAMETER HISTORY (retention audit 2026-10-08): the three refit tables are whole-table replaces and the as-of
      #   calibration is rebuilt per season, so the parameters that priced a past slate were unrecoverable. Snapshot them,
      #   as of this slate, into nba_score.model_params_history (append-only, idempotent) BEFORE final_hp reads them.
      - name: Snapshot the slate's model parameters (history)
        if: ${{ steps.d.outputs.has_games == '1' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SNAP_DATE: ${{ steps.d.outputs.asof }}
          # the as-of calibration keeps one fit per as_of_date (47 over two seasons); the slate reads the latest fit at or before
          # its date, so that is the row set snapshotted under the slate's date
          SNAP_TABLES: "nba_score.blowout_model,nba_score.confidence_model,nba_score.confidence_verification,nba_score.ladder_calibration_asof|as_of_date=(SELECT max(as_of_date) FROM nba_score.ladder_calibration_asof WHERE as_of_date<='{d}')"
        run: python nba/snapshot_model_params.py

      # 6b) FINAL_HP for the slate - AFTER both refits (it reads the calibration and the confidence model).
      - name: Build final_hp for the slate
        if: ${{ steps.d.outputs.has_games == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FE_DATE: ${{ steps.d.outputs.asof }}
          FE_WRITE: "1"
        run: python nba/build_final_hp.py

      # WHOLE-NUMBER LINES (§31s G1, COMPASS 134; owner directive "every leg gets a final HP"): priced from the adjacent rungs
      # + the stored recalibration into nba_score.final_hp_derived - NEVER final_hp (selection excluded: gate 2 not adopted).
      # Isolated: a failure here never blocks certification or P3.
      - name: Price whole-number board lines (final_hp_derived)
        id: soft_wn
        if: ${{ steps.d.outputs.has_games == '1' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WN_DATE: ${{ steps.d.outputs.asof }}
          WN_WRITE: "1"
        run: python -u nba/build_whole_number_hp.py

      # 7) CERTIFY: today's baseline exists, >= 25 props, zero invalid probabilities (season-aware: off days pass).
      - name: Certify P2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPE: "p2"
          CERT_DATE: ${{ steps.d.outputs.asof }}
        run: python nba/certify_pipeline.py

      # SOFT FAILURES MADE VISIBLE (2026-10-07, certification pass G): the continue-on-error steps above never fail the run,
      # so a failed roster refresh / name map / whole-number pricing was invisible in nba_control.pipeline_runs. Collected here,
      # recorded on the run row by the finish job (SOFT_FAILED) as a run warning + note.
      - name: Collect soft-step failures
        id: soft
        if: always()
        run: |
          L=""
          [ "${{ steps.soft_rosters.outcome }}" = "failure" ] && L="$L roster-refresh"
          [ "${{ steps.soft_rosters_apply.outcome }}" = "failure" ] && L="$L roster-apply"
          [ "${{ steps.soft_namemap.outcome }}" = "failure" ] && L="$L player-name-map"
          [ "${{ steps.soft_morning_board.outcome }}" = "failure" ] && L="$L morning-board-snapshot"
          [ "${{ steps.soft_injury.outcome }}" = "failure" ] && L="$L injury-report"
          [ "${{ steps.soft_line.outcome }}" = "failure" ] && L="$L morning-game-line"
          [ "${{ steps.soft_blowout.outcome }}" = "failure" ] && L="$L blowout-refit"
          [ "${{ steps.soft_wn.outcome }}" = "failure" ] && L="$L whole-number-pricing"
          L="${L# }"
          echo "list=$L" >> "$GITHUB_OUTPUT"
          if [ -n "$L" ]; then echo "::warning::soft-failed steps (run stays green): $L"; else echo "no soft-step failures"; fi

  # Records this run's outcome (the scheduler dispatches P3 only after a success here, or at P3's own deadline).
  finish:
    needs: [claim, slate]
    if: ${{ always() && needs.claim.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "psycopg[binary]"
      - name: Record the result
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODE: finish
          PIPELINE: P2B
          IN_ASOF: ${{ github.event.inputs.asof }}
          RUN_ID: ${{ github.run_id }}
          RESULT: "${{ needs.slate.result }}"
          SOFT_FAILED: "${{ needs.slate.outputs.soft_failed }}"
        run: python -u nba/pipeline_claim.py
