name: NBA Tier Map WI2 (whole-number legs, same currency)

# §31s G1 gate 2b: builds nba_score.tier_map_legs_wi2 (certified legs copied untouched + whole-number legs priced with a
# safety discount and tie EV, placed in the cells' own score currency, all cross-fitted). Read-only on the certified tables.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy
      - name: Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/build_tier_map_wi2.py
