name: NBA Live Board Archiver

# Boards into nba_market.board_snapshots so the live season accumulates the same history the two-season
# backfill holds. Without this the scrapers just overwrite boards/<app>_<sport>_current.json and opening
# day produces no queryable archive.
#
# Cadence once the season starts (Pacific):
#   window  - 2:45 PM PT (or first tip - 2h on early slates) = the decision snapshot
#   close   - a late pull for line movement
#   routine - any other cron pull
# Runs on demand now; the Coworker task schedules window/close during the season.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "window | close | routine"
        default: "routine"
        required: false
      sport:
        description: "nba | mlb"
        default: "nba"
        required: false
      apps:
        description: "comma-separated"
        default: "prizepicks,underdog,sleeper,fliff,betr"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-board-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Archive current boards
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ARCHIVE_LABEL: ${{ github.event.inputs.label || 'routine' }}
          ARCHIVE_SPORT: ${{ github.event.inputs.sport || 'nba' }}
          ARCHIVE_APPS: ${{ github.event.inputs.apps || 'prizepicks,underdog,sleeper,fliff,betr' }}
        run: python nba/archive_live_boards.py
