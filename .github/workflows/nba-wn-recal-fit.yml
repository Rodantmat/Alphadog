name: NBA Whole-number Recal Fit

# §31s G1: fit the whole-number recalibration on both seasons and (write=1) store it in nba_config.classification_config.
on:
  workflow_dispatch:
    inputs:
      write:
        description: "'1' = store the fit; anything else = dry run"
        default: "0"
        required: false

permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Fit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WN_WRITE: ${{ github.event.inputs.write }}
        run: python -u nba/fit_whole_number_recal.py
