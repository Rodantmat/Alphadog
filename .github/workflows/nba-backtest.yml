name: NBA Backtest

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_BACKTEST.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip pandas numpy scipy

      - name: Minutes model v1
        run: python nba/backtest/minutes_model_v1.py
        continue-on-error: true

      - name: Classification + ladder calibration (canonical, leg-level) - 2025-26, points+rebounds
        run: BT_TAG=final BT_PROPS=points,rebounds python nba/backtest/classification_ladder_v12.py
        continue-on-error: true

      - name: Classification - 2025-26, assists+threes
        run: BT_TAG=final BT_PROPS=assists,threes_made python nba/backtest/classification_ladder_v12.py
        continue-on-error: true

      - name: Classification - 2024-25 holdout (history 2023-24), points+rebounds
        run: BT_TRAIN=2023-24 BT_TEST=2024-25 BT_TAG=final BT_PROPS=points,rebounds python nba/backtest/classification_ladder_v12.py
        continue-on-error: true

      - name: Classification - 2024-25 holdout, assists+threes
        run: BT_TRAIN=2023-24 BT_TEST=2024-25 BT_TAG=final BT_PROPS=assists,threes_made python nba/backtest/classification_ladder_v12.py
        continue-on-error: true

      - name: Extension - blocks+steals, 2025-26
        run: BT_TAG=ext BT_PROPS=blocks,steals python nba/backtest/classification_ladder_v12.py
        continue-on-error: true

      - name: Extension - blocks+steals, 2024-25 holdout
        run: BT_TRAIN=2023-24 BT_TEST=2024-25 BT_TAG=ext BT_PROPS=blocks,steals python nba/backtest/classification_ladder_v12.py
        continue-on-error: true

      - name: Extension - turnovers+fouls, both seasons
        run: |
          BT_TAG=ext BT_PROPS=turnovers,personal_fouls python nba/backtest/classification_ladder_v12.py || true
          BT_TRAIN=2023-24 BT_TEST=2024-25 BT_TAG=ext BT_PROPS=turnovers,personal_fouls python nba/backtest/classification_ladder_v12.py || true
        continue-on-error: true

      - name: Extension - fga+fg3a, both seasons
        run: |
          BT_TAG=ext BT_PROPS=fga,fg3a python nba/backtest/classification_ladder_v12.py || true
          BT_TRAIN=2023-24 BT_TEST=2024-25 BT_TAG=ext BT_PROPS=fga,fg3a python nba/backtest/classification_ladder_v12.py || true
        continue-on-error: true

      - name: Extension - ftm, both seasons
        run: |
          BT_TAG=ext BT_PROPS=ftm python nba/backtest/classification_ladder_v12.py || true
          BT_TRAIN=2023-24 BT_TEST=2024-25 BT_TAG=ext BT_PROPS=ftm python nba/backtest/classification_ladder_v12.py || true
        continue-on-error: true

      - name: Components for combos (both seasons) + combos + double-double
        run: |
          for pair in points,rebounds assists,steals blocks,turnovers; do
            BT_SAVE_COMPONENTS=1 BT_TAG=comp BT_PROPS=$pair python nba/backtest/classification_ladder_v12.py || true
            BT_SAVE_COMPONENTS=1 BT_TRAIN=2023-24 BT_TEST=2024-25 BT_TAG=comp BT_PROPS=$pair python nba/backtest/classification_ladder_v12.py || true
          done
          python nba/backtest/combos_ladder_v1.py || true
          BT_TRAIN=2023-24 BT_TEST=2024-25 python nba/backtest/combos_ladder_v1.py || true
        continue-on-error: true

      - name: Commit reports to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/backtest/reports/*.json nba/backtest/reports/*.md || true
          if git diff --cached --quiet; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "NBA backtest reports [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
