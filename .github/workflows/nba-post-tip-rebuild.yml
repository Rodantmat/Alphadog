name: NBA Post-Tip Rebuild (PrizePicks + Underdog, owner override)

# 2026-11-15: the owner moved P3 to 12:20 PM PT (after the 10:00 AM tip) so the injury reports were in. The PrizePicks and
# Underdog engines refused on their own post-tip guard (live_slip_engine.post_tip), so neither app got slips. This runs ONLY
# those two picks with LS_ALLOW_POST_TIP=1 (both engines read the same guard), then exposure, quotes and the Slips screen warm.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "slate date (YYYY-MM-DD)"
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: alphadog-nba-post-tip-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy
      - name: PrizePicks slip pick
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LS_MODE: "pick"
          LS_DATE: ${{ github.event.inputs.day }}
          LS_ALLOW_POST_TIP: "1"
        run: python -u nba/live_slip_engine.py
      - name: Exposure rules (PrizePicks)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXP_DATE: ${{ github.event.inputs.day }}
          EXP_APPS: "prizepicks"
        run: python -u nba/slip_exposure_coordinator.py
      - name: Dispatch the PrizePicks quote gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -o /tmp/d.json -w "%{http_code}\n" --max-time 30 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/nba-pp-payout-map.yml/dispatches" \
            -d '{"ref":"main","inputs":{"mode":"slipq","max_quotes":"60"}}'
      - name: Underdog pick
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UDL_MODE: "pick"
          UDL_DATE: ${{ github.event.inputs.day }}
          LS_ALLOW_POST_TIP: "1"
        run: python -u nba/ud_live_slip_engine.py
      - name: Exposure rules (Underdog)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXP_DATE: ${{ github.event.inputs.day }}
          EXP_APPS: "underdog"
        run: python -u nba/slip_exposure_coordinator.py
      - name: Warm the Slips screen
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/warm.json -w "%{http_code}" --max-time 120 -X POST -H "content-type: application/json" -d '{}' \
              "https://alphadog-v2-nba-main-ui.rodolfoaamattos.workers.dev/api/slips/high-hit?refresh=1") || code=000
            echo "slips snapshot warm (attempt $i): http $code"
            [ "$code" = "200" ] && exit 0
            sleep $((i * 10))
          done
          exit 1
