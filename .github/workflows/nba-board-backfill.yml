name: NBA Board Backfill (Odds API history)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start Pacific game date YYYY-MM-DD"
        default: "2024-10-22"
        required: false
      end:
        description: "End Pacific game date YYYY-MM-DD"
        default: "2026-04-12"
        required: false
      max_events:
        description: "Test cap on events (0 = no cap)"
        default: "0"
        required: false
      regions:
        description: "Odds API regions"
        default: "us_dfs,us"
        required: false
      snapshots:
        description: "Snapshot labels (window,close)"
        default: "window,close"
        required: false
      key_env:
        description: "Read the key from this env var instead of the credentials table (ODDS2_API_KEY)"
        default: ""
        required: false
      credit_floor:
        description: "Stop below this many credits"
        default: "250000"
        required: false
      window_from_db:
        description: "1 = read the books at the day's PrizePicks window snapshot time"
        default: "0"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-board-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests
      - name: Backfill board snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOARD_START: ${{ github.event.inputs.start || '2024-10-22' }}
          BOARD_END: ${{ github.event.inputs.end || '2026-04-12' }}
          BOARD_MAX_EVENTS: ${{ github.event.inputs.max_events || '0' }}
          BOARD_REGIONS: ${{ github.event.inputs.regions || 'us_dfs,us' }}
          BOARD_CREDIT_FLOOR: ${{ github.event.inputs.credit_floor || '250000' }}
          BOARD_SNAPSHOTS: ${{ github.event.inputs.snapshots || 'window,close' }}
          ODDS_KEY_ENV: ${{ github.event.inputs.key_env || '' }}
          BOARD_WINDOW_FROM_DB: ${{ github.event.inputs.window_from_db || '0' }}
          ODDS2_API_KEY: ${{ secrets.ODDS2_API_KEY }}
        run: python nba/backfill_board_snapshots.py
