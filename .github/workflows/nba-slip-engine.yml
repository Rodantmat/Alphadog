name: NBA Slip Engine

on:
  workflow_dispatch:
    inputs:
      cap:
        default: "10"
        required: false
      sizes:
        default: "2,3,4,5,6"
        required: false
      exclude_cells:
        description: "comma list of cells to remove from every composition (e.g. steals_R,steals_R_U)"
        default: ""
        required: false
      table_suffix:
        description: "write to slip_engine_slips<suffix>; blank = the certified tables"
        default: ""
        required: false
      delta:
        description: "'1' = build only days past the table's high-water mark"
        default: ""
        required: false
      diversify:
        description: "'1' = prefer >=4 distinct cells per 5-pick on broad boards (29k, opt-in)"
        default: ""
        required: false
      sameteam:
        description: "'1' = same-team pairs rank with cross-game, opposing-team pairs lowest (pass 41, rejected)"
        default: ""
        required: false
      lowfoul:
        description: "'1' = prefer legs on players under 1.8 fouls/game (pass 64, validating)"
        default: ""
        required: false
      legs_table:
        description: "leg source: nba_score.tier_map_legs_sel (certified map + whole-number legs, as live selects) or nba_score.tier_map_legs (cell design only)"
        default: "nba_score.tier_map_legs_sel"
        required: false
      star_under:
        description: "§31n TEST: 'points,pra,combo' star-line thresholds whose balanced Unders are excluded before ranking (blank = off; needs a table_suffix)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-slip-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Build slips
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SE_CAP: ${{ github.event.inputs.cap }}
          SE_SIZES: ${{ github.event.inputs.sizes }}
          SE_EXCLUDE_CELLS: ${{ github.event.inputs.exclude_cells }}
          SE_TABLE_SUFFIX: ${{ github.event.inputs.table_suffix }}
          SE_DELTA: ${{ github.event.inputs.delta }}
          SE_DIVERSIFY: ${{ github.event.inputs.diversify || '1' }}
          SE_SAMETEAM: ${{ github.event.inputs.sameteam || '0' }}
          SE_LOWFOUL: ${{ github.event.inputs.lowfoul || '1' }}
          SE_LEGS_TABLE: ${{ github.event.inputs.legs_table || 'nba_score.tier_map_legs_sel' }}
          STAR_UNDER: ${{ github.event.inputs.star_under }}
        run: |
          set -euo pipefail
          if [ -n "${STAR_UNDER}" ]; then
            IFS=, read -r P R C <<< "${STAR_UNDER}"
            export SE_EXCL_STAR_UNDER=1 SE_STAR_POINTS="$P" SE_STAR_PRA="$R" SE_STAR_COMBO="$C"
            echo "star-Under exclusion ON: points >= $P, pra >= $R, pts_ast/pts_reb >= $C -> table suffix '${SE_TABLE_SUFFIX}'"
          fi
          python -u nba/build_slip_engine.py
