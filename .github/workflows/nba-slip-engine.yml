name: NBA Slip Engine

on:
  workflow_dispatch:
    inputs:
      cap:
        default: "10"
        required: false
      sizes:
        default: "2,3,4,5,6"
        required: false
      exclude_cells:
        description: "comma list of cells to remove from every composition (e.g. steals_R,steals_R_U)"
        default: ""
        required: false
      table_suffix:
        description: "write to slip_engine_slips<suffix>; blank = the certified tables"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-slip-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Build slips
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SE_CAP: ${{ github.event.inputs.cap }}
          SE_SIZES: ${{ github.event.inputs.sizes }}
        run: python -u nba/build_slip_engine.py
