name: Fliff Probe (all future games x sharp market)

# SEPARATE STRUCTURE (owner 2026-10-20): code lives in fliff_probe/, output only in fliff_probe/out/.
# Nothing else in the repo is edited; the DB is only READ (credential lookup). Manual dispatch only - no schedule.
#   step=discover  -> fliff_probe/discover.py   (sample-first structure map)
#   step=run       -> fliff_probe/run_probe.py  (full probe + ranked strategy report)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "discover | run"
        default: "run"
        required: false
      sports:
        description: "run: comma list of ParlayAPI sport keys, or 'auto' (every mapped sport with Fliff events in the window)"
        default: "auto"
        required: false
      hours:
        description: "run: look-ahead window in hours"
        default: "48"
        required: false
      max_events:
        description: "run: cap on Fliff event boards pulled (sample runs: 20-40)"
        default: "250"
        required: false

permissions:
  contents: write

concurrency:
  group: fliff-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip curl_cffi requests "psycopg[binary]"
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=""
          for i in 1 2 3; do
            P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null) && break
            P=""; sleep $((i * 4))
          done
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"
          fi
      - name: Run probe step
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          PROBE_SPORTS: ${{ github.event.inputs.sports || 'auto' }}
          PROBE_HOURS: ${{ github.event.inputs.hours || '48' }}
          PROBE_MAX_EVENTS: ${{ github.event.inputs.max_events || '250' }}
        run: |
          STEP="${{ github.event.inputs.step || 'run' }}"
          case "$STEP" in
            discover) python fliff_probe/discover.py ;;
            discover_props) python fliff_probe/discover_props.py ;;
            discover_ladder) python fliff_probe/discover_ladder.py ;;
            pairs) python fliff_probe/pairings.py ;;
            *) python fliff_probe/run_probe.py ;;
          esac
      - name: Commit probe output (fliff_probe/out only)
        if: always()
        run: bash nba/git_push_retry.sh "Fliff probe output [skip ci]" fliff_probe/out
