name: Fliff Probe (all future games x sharp market)

# SEPARATE STRUCTURE (owner 2026-10-20): code lives in fliff_probe/, output only in fliff_probe/out/.
# Nothing else in the repo is edited; the DB is only READ (credential lookup). Manual dispatch only - no schedule.
#   step=discover  -> fliff_probe/discover.py   (sample-first structure map)
#   step=run       -> fliff_probe/run_probe.py  (full probe + ranked strategy report)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "discover | run"
        default: "run"
        required: false
      sports:
        description: "run: comma list of ParlayAPI sport keys, or 'auto' (every mapped sport with Fliff events in the window)"
        default: "auto"
        required: false
      hours:
        description: "run: look-ahead window in hours"
        default: "48"
        required: false
      max_events:
        description: "run: cap on Fliff event boards pulled (sample runs: 20-40)"
        default: "250"
        required: false
      mode:
        description: "pairs: safe (default) | wide"
        default: "safe"
        required: false
      balance:
        description: "pairs: current Fliff balance in $ (sets the flat 5% stake)"
        default: "0"
        required: false

permissions:
  contents: write

concurrency:
  group: fliff-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip curl_cffi requests "psycopg[binary]"
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=""
          for i in 1 2 3; do
            P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null) && break
            P=""; sleep $((i * 4))
          done
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"
          fi
      - name: Run probe step
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          PROBE_SPORTS: ${{ github.event.inputs.sports || 'auto' }}
          PROBE_HOURS: ${{ github.event.inputs.hours || '48' }}
          PROBE_MAX_EVENTS: ${{ github.event.inputs.max_events || '250' }}
          PROBE_MODE: ${{ github.event.inputs.mode || 'safe' }}
          PROBE_BALANCE: ${{ github.event.inputs.balance || '0' }}
        run: |
          STEP="${{ github.event.inputs.step || 'run' }}"
          case "$STEP" in
            discover) python fliff_probe/discover.py ;;
            discover_props) python fliff_probe/discover_props.py ;;
            discover_ladder) python fliff_probe/discover_ladder.py ;;
            discover_bundle) python fliff_probe/discover_bundle.py ;;
            discover_skipper) python fliff_probe/discover_skipper.py ;;
            discover_version) python fliff_probe/discover_version.py ;;
            check_board)
              # read-only health check of the pipeline's own Fliff scraper: runs it into a scratch dir, prints its meta
              mkdir -p /tmp/fliffchk
              FLIFF_SPORTS=nba FLIFF_OUT_DIR=/tmp/fliffchk timeout 300 python nba/scrape_fliff_board.py | tail -n 15
              python -c "import json;d=json.load(open('/tmp/fliffchk/fliff_nba_current_meta.json'));print('CHECK', {k:d.get(k) for k in ('ok','fetched_at','app_version','events','markets','legs','players','errors')})" ;;
            pairs) python fliff_probe/pairings.py ;;
            export_history) python fliff_probe/export_history.py ;;
            export_scored) EXPORT_ONLY=scored,box,props,pickem python fliff_probe/export_history.py ;;
            discover_quote) python fliff_probe/discover_quote.py ;;
            discover_quote_calls) python fliff_probe/discover_quote_calls.py ;;
            discover_boosts) python fliff_probe/discover_boosts.py ;;
            discover_formula)
              QUOTE_WORDS='(correlationFactor|SGPCoeff|sgpProb|FlexPlayCoeff|FlexProbability|FlexPlayUtils|calcFlex|SGP_PLUS|SAME_GAME_V|play_through_progress|play_through_target|play_through_multiplier|sgp_quote_info|min_contest_multiplier|minContestMultiplier|chef_choice_min|early_payout)' \
              QUOTE_PER_WORD=8 QUOTE_CTX=2500 QUOTE_OUT=discovery_formula.json python fliff_probe/discover_quote.py ;;
            *) python fliff_probe/run_probe.py ;;
          esac
      - name: Commit probe output (fliff_probe/out only)
        if: always()
        run: bash nba/git_push_retry.sh "Fliff probe output [skip ci]" fliff_probe/out
