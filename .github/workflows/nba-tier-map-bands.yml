name: NBA Tier Map Bands

# Granular sweep of nba_score.tier_map_legs -> tier_map_bands / tier_map_summary.
# Every n and every pct per (rank, window, prop, tier). Writes only those two tables.

on:
  workflow_dispatch:
    inputs:
      rank:
        description: "comma list of rank_key values present in tier_map_legs"
        default: "final_hp"
        required: false
      nmax:
        description: "max n"
        default: "25"
        required: false
      pctmax:
        description: "max pct"
        default: "30"
        required: false
      rebuild:
        description: "1 = rebuild tier_map_legs from pp_leg_price (system tier + current per-line price) before sweeping"
        default: "0"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-tier-bands
  cancel-in-progress: false

jobs:
  bands:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Sweep
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TM_RANK: ${{ github.event.inputs.rank }}
          TM_NMAX: ${{ github.event.inputs.nmax }}
          TM_PCTMAX: ${{ github.event.inputs.pctmax }}
        run: python -u nba/build_tier_map_bands.py
