name: NBA P3 Afternoon Light

# PIPELINE 3 OF 3 (COMPASS fact 107). The day-of run, after the injury-report cutoff.
#
# CUTOFF 1:15 PM PT — and that number is EVIDENCE, not inheritance. The game-day injury report is due
# 11am-1pm LOCAL TO EACH GAME'S MARKET, so Eastern clubs file by 10 AM PT and PACIFIC clubs are last at
# 1:00 PM PT. Every other daily input lands earlier: referees ~6-7 AM, market spread from the 08:00
# snapshot, projected lineups through the morning, boards on demand. The injury report is the ONLY
# binding constraint, so 1:15 PM PT is the first moment the full slate is knowable.
# (The old "2:30 PM PT" was my drift - it came from a list of observed injury-PDF timestamps in
# EASTERN. 2:30 PM ET is 11:30 AM PT. See COMPASS fact 107 for the full trace.)
#
# NO CRON YET — the NBA season opens in October. A scheduled job failing nightly against an empty
# slate teaches everyone to ignore red builds. Cron goes in at season start: '15 21 * * *' = 21:15 UTC
# = 1:15 PM PST (and 2:15 PM PDT, which still clears the earliest 4 PM PT tip by 105 minutes).
#
# NO SCENARIO PRECOMPUTE. Its whole value was "enumerate every availability branch now, SELECT the
# realised one at a later window". With ONE window there is nothing to select with, so enumeration is
# pure cost (~0.5-1M rows/day). Residual availability uncertainty is carried by N1 probability-weighted
# availability inside the projection, where it belongs.
#
# NO FRESHNESS GATE. At a single cutoff every leg carries the same report generation - a freshness term
# would penalise uniformly and discriminate nothing.

on:
  workflow_dispatch:
    inputs:
      asof:
        description: "slate date (blank = today PT). Use a past date to REPLAY/simulate."
        default: ""
        required: false
      skip_scrape:
        description: "true = skip live scrapes, score from what is already stored (replay)"
        default: "false"
        required: false
      season:
        description: "season override (blank = resolve from the date)"
        default: ""
        required: false

permissions:
  contents: write

concurrency:
  group: alphadog-nba-p3-afternoon
  cancel-in-progress: false

jobs:
  afternoon:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy curl_cffi lxml html5lib

      - name: Resolve slate date and assert the cutoff has passed
        id: d
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          A="${{ github.event.inputs.asof }}"
          if [ -z "$A" ]; then A=$(TZ=America/Los_Angeles date +%F); fi
          echo "asof=$A" >> $GITHUB_OUTPUT
          echo "Slate $A"
          # THE CUTOFF IS NOT A FIXED CLOCK (fixed 2026-09-23). 1:15 PM PT is the LATEST useful moment -
          # it lets the day-of injury reports land (Pacific clubs file until 1:00 PM PT). But roughly 38
          # dates a season tip BEFORE that, and on those days a 13:15 run scored a slate that had already
          # started and still certified green: picks recorded after the fact, silently.
          # The real rule is "as late as possible, but before the first tip". The schedule is the
          # authority, so the effective cutoff is min(13:15 PT, first tip - 30 min).
          python - "$A" <<'EOF'
          import os, sys
          from datetime import datetime, timedelta, timezone
          import psycopg
          slate = sys.argv[1]
          now = datetime.now(timezone.utc)
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              first_tip, games = c.execute(
                  "SELECT min(game_datetime_utc), count(*) FROM nba_calendar.games WHERE game_date = %s",
                  (slate,)).fetchone()
          today_pt = datetime.now(timezone(timedelta(hours=-8))).date().isoformat()
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          print(f"games scheduled: {games}; first tip (UTC): {first_tip}")
          if games == 0:
              print("::notice::No games scheduled for this slate - nothing is due.")
              out.write("late=0\n"); raise SystemExit(0)
          if slate != today_pt:
              print("Replay of a past/other date - cutoff checks do not apply.")
              out.write("late=0\n"); raise SystemExit(0)
          latest = datetime.fromisoformat(f"{slate}T21:15:00+00:00")   # 13:15 PT during DST
          effective = min(latest, first_tip - timedelta(minutes=30))
          print(f"effective cutoff (UTC): {effective}  |  now: {now}")
          if now < effective:
              print(f"::error::Too early. This slate's effective cutoff is {effective} UTC "
                    f"(first tip {first_tip}). Injury reports are still landing.")
              raise SystemExit(1)
          if now > first_tip:
              print(f"::warning::LATE RUN - the first game tipped at {first_tip} UTC, before this run. "
                    f"Legs for games already underway are stale; picks from them are post-tip.")
              out.write("late=1\n")
          else:
              out.write("late=0\n")
          out.close()
          EOF

      # 1) THE BINDING INPUT: the day-of injury report
      - name: Day-of injury report
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          INJURY_MODE: "daily"        # verified name; IR_MODE does not exist
        run: python nba/scrape_nba_injury_report.py

      # A5 LINEUP CHANGE IS CLOSED — REJECTED (parity doc §factor table, tested 2026-09-13): a derived
      # as-of proxy is REDUNDANT, negative on every prop, because the allocator's recent-5 minutes
      # already encode starting continuously. "No projected lineups needed -> no leak to mitigate."
      # So there is NO lineup scrape here. Referees are a BASELINE-stage factor and run in P2.
      #
      # A6 late scratch and A9 suspension come from the SAME injury-report scrape above - they are
      # statuses within it, not separate sources.

      # 2) THE BOARD: what is actually offered today, across every app.
      # PrizePicks FIRST - it is the app the owner actually plays, and its producer lives at the repo
      # root (main.py, league_id 7 for NBA) rather than in nba/. Leaving it out would score against a
      # board that does not include the primary book.
      # PRIZEPICKS IS NOT WIRED FOR NBA YET - and this is a HARD GAP, not a configuration detail.
      # main.py at the repo root is the MLB producer and it is HARDCODED: league_id=2 appears as a
      # literal in all four URLs and the output is fixed to prizepicks_mlb_current.json. There is NO
      # environment variable - a PP_LEAGUE_ID would do nothing. Running it here would have scraped
      # BASEBALL, written it to the MLB file, and left P3 believing it had the NBA board.
      # COMPASS fact 176 says "PrizePicks stays the MLB producer (repo root) with league_id=7 for NBA",
      # so the NBA producer is planned but does not exist. Until it does, PrizePicks legs reach the
      # board only via the Odds API feed (bookmaker='prizepicks' in board_snapshots), which carries the
      # standard markets but NOT the DFS-only ones (fantasy_score, period props) or the goblin/demon
      # multipliers.
      # TODO before opening day: parameterise main.py for league_id/output, or add an NBA producer.
      - name: Other board scrapers
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # VERIFIED NAMES, and they are NOT uniform - each scraper has its own. A generic SPORT does
          # nothing. Sleeper's default is multi-sport ("mlb,nba"), so leaving it unset silently scrapes
          # MLB too and doubles the runtime of a pipeline that must finish in minutes.
          SLEEPER_SPORTS: "nba"
          # OUTPUT DIRS ARE ALSO NOT UNIFORM: Sleeper defaults to "." (the repo ROOT) while Underdog
          # defaults to "boards". The commit step below only adds boards/ and nba/data/, so an unset
          # SLEEPER_OUT_DIR drops the file at the root where it is never committed - and the archiver,
          # which reads committed files, would silently never see Sleeper's board.
          SLEEPER_OUT_DIR: "boards"
          UNDERDOG_OUT_DIR: "boards"
        run: |
          python nba/scrape_sleeper_board.py
          python nba/scrape_underdog_board.py
          python nba/scrape_fliff_board.py

      - name: Archive boards into Postgres
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # MUST be "window". archive_live_boards.py defaults ARCHIVE_LABEL to "routine", and the
          # decision snapshot has to be distinguishable from any other cron pull - the grader, the
          # line-movement measurement and every backtest key off this label. P3's pull IS the decision
          # moment (1:15 PM PT, COMPASS fact 107), so it is labelled as such.
          ARCHIVE_LABEL: "window"
          ARCHIVE_SPORT: "nba"
          ARCHIVE_APPS: "prizepicks,underdog,sleeper,fliff,betr"
        run: python nba/archive_live_boards.py

      # Classify every board leg as standard / goblin / demon with its tier and anchor. The score and
      # the slip engine both need this - a rung's break-even depends on which variation it is.
      # 🔴 FIXED 2026-09-23: this step ran `nba/maintenance_shrink_board_index.py` - a ONE-OFF
      # maintenance job (it replaces board_snapshots' 7-column primary key with a compact expression
      # index on 25.7M rows). So tiers were NEVER built for the decision-moment board, and a heavy
      # index rebuild ran on the critical path at the cutoff, against the table the scorer reads next.
      # The real builder is build_board_tiers_v2.py (four-way taxonomy, signed by position vs anchor).
      # ⚠ BT2_APPS is prizepicks only - that is the script's own default and the only app whose
      # goblin/demon rungs this taxonomy describes. Tiers for the other archived apps are NOT built here.
      - name: Board tiers (goblin / standard / demon)
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BT2_APPS: "prizepicks"
        run: python nba/build_board_tiers_v2.py

      # 3) THE MARKET at the window - de-vigged book probability per rung
      - name: Market snapshot and rung market
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python nba/export_market_spreads.py
          python nba/build_rung_market.py

      - name: Commit day-of data
        if: ${{ github.event.inputs.skip_scrape != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/*.json boards/*.json || true
          if git diff --cached --quiet; then echo "No day-of file changes."; else
            git commit -m "NBA P3 day-of data [skip ci]"
            for i in 1 2 3 4 5; do
              if git push origin HEAD:main; then break; fi
              git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
            done
          fi

      # 4) SCORE THE BOARD. P3 IS BOARD-SCOPED: every leg the apps actually offer - all prop lines,
      # every ladder rung, both directions, goblins/standards/demons, across PrizePicks, Underdog,
      # Sleeper and Fliff. NOT the full internal ladder.
      #
      # WHY THIS SHAPE, measured: an earlier version rebuilt all 8 prop pairs here and ran 35+ minutes
      # without finishing. That is disqualifying for a pipeline that must start at 1:15 PM PT and be
      # done before ~1:30. The cost is NOT per-player scoring - it is REFITTING the recipe (tier tables,
      # factor betas, dispersion) over three seasons, ~8 minutes per pair.
      #
      # And that refit CANNOT have changed: it uses only games strictly BEFORE today, so it is identical
      # at 1 AM (P2) and 1:15 PM (P3). P3 refitting it is 64 minutes spent recomputing a model that is
      # provably unchanged.
      #
      # What DOES change between P2 and P3 is the availability list. A player moves Questionable -> Out,
      # the allocator redistributes his minutes, and the projection shifts FOR HIS TEAM ONLY.
      #
      # So: load P2's fit, apply the availability delta to affected teams, and score exactly the legs
      # the board offers. Cost then tracks BOARD SIZE and NUMBER OF STATUS CHANGES - both bounded - not
      # the fitting cost, which is fixed and belongs overnight. This is also the only shape that scales
      # as the board grows with new goblins/demons and full ladders across four apps.
      - name: Availability delta (which teams changed since the day-before report)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DELTA_ASOF: ${{ steps.d.outputs.asof }}
          DELTA_FROM: "baseline"
          DELTA_TO: "phase1"
        run: python nba/build_availability_delta.py

      - name: Score the board (all apps, all rungs, both directions)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BS_ASOF: ${{ steps.d.outputs.asof }}
          BS_SEASON: ${{ github.event.inputs.season }}
        run: python nba/score_board_legs.py

      # 4b) PAPER TRADING (2026-09-21): record tonight's standards_3pick_v1 picks with a pre-game timestamp. First log
      #     wins - a night already logged is never overwritten. Graded by P2 next morning; see nba_score.paper_results.
      - name: Log paper-trading picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAPER_DATE: ${{ steps.d.outputs.asof }}
        run: |
          python - <<'EOF'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"]) as c:
              n = c.execute("SELECT nba_score.log_paper_picks(%s)", (os.environ["PAPER_DATE"],)).fetchone()[0]
          print(f"PAPER_LOGGED|{os.environ['PAPER_DATE']}|{n} picks (0 = already logged, or nothing qualified)")
          EOF

      # 5) CERTIFY: today's legs scored, confidence non-null, score in 0-100, board captured
      - name: Certify P3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPE: "p3"
          CERT_DATE: ${{ steps.d.outputs.asof }}
        run: python nba/certify_pipeline.py
