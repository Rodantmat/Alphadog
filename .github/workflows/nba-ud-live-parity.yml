name: NBA UD Live Parity (multi-slate)

# §31f: read-only - the Underdog live engine's own selection + settlement vs the backtest over every 2025-26 slate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/verify_ud_live_parity.py
