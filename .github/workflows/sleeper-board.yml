name: Sleeper Board Scraper

# NBA CAPTURE TIMES (owner 2026-10-09: "the boards should be captured not multiple times a day but at strategic times that
# match my slip-placing times and our system needs - that reduces traffic cost"). The NBA board is captured ONLY by the
# scheduler-timed pipelines, each anchored to the day's first tip: MORNING (P2B, <= 08:05 PT, line-shading research,
# PrizePicks + Underdog), WINDOW (P3, min(13:15 PT, first tip - 30 min) - the decision board, every app, right before the
# slips are placed) and CLOSE (first tip - 25 min, closing lines). This workflow's SCHEDULED runs therefore scrape MLB
# only (MLB's own cadence, unchanged - no MLB edits); NBA was 12 redundant 'routine' pulls a day that nothing reads.
# A manual dispatch can still name any sport.

on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      sports:
        description: "Sleeper sport tags, comma-separated"
        default: "mlb,nba"
        required: false
  push:
    paths:
      - 'nba/TRIGGER_SLEEPER_BOARD.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-sleeper-board
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip curl_cffi
      # PROXY FROM THE CREDENTIAL STORE (owner rule: the proxy URL lives in nba_config.external_credentials 'proxy_url'),
      # read with retries; the PROXY_URL secret stays as the fallback.
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=""
          for i in 1 2 3; do
            P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null) && break
            echo "credential store not reachable (attempt $i/3)"; P=""; sleep $((i * 4))
          done
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store -> $(echo "$P" | sed 's#.*@##')"
          else
            echo "proxy: credential store has no proxy_url row (or is unreachable) - using the PROXY_URL secret"
          fi
      - name: Produce Sleeper board JSON
        env:
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          SLEEPER_SPORTS: ${{ github.event.inputs.sports || 'mlb' }}
          SLEEPER_OUT_DIR: boards
        run: |
          mkdir -p boards
          python nba/scrape_sleeper_board.py
      # ONE push helper (nba/git_push_retry.sh): the old loop died on the first rebase conflict under `set -e`.
      - name: Commit board JSON to main (conflict-safe retry)
        run: bash nba/git_push_retry.sh "Update Sleeper board JSON [skip ci]" boards/sleeper_*.json
