name: NBA UD Signal Matrix

# Underdog candidate x signal matrix (strategy doc §30l) -> nba_score.ud_cand_leg_features / ud_cand_signal_matrix.
# Mirror of nba-cand-signal-matrix.yml (PrizePicks). Writes only those two tables.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "features | matrix | both"
        default: "both"
        required: false
      min_lift:
        default: "0.02"
        required: false
      min_legs:
        default: "60"
        required: false
      max_depth:
        default: "3"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-ud-matrix
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CM_STAGE: ${{ github.event.inputs.stage }}
          CM_MIN_LIFT: ${{ github.event.inputs.min_lift }}
          CM_MIN_LEGS: ${{ github.event.inputs.min_legs }}
          CM_MAX_DEPTH: ${{ github.event.inputs.max_depth }}
        run: python -u nba/build_ud_signal_matrix.py
