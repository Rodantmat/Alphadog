name: NBA Absence Panel

# The fitting set for the enrichment layer's largest factors (A2 redistribution, A2b dependent branch,
# A5 role change, B4 opponent availability, M1 defender quality). Pre-game ruled-out absences only,
# residuals measured against the day-by-day baseline, with team conservation totals. Fails loudly.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "comma-separated (2023-24 has no injury archive)"
        default: "2024-25,2025-26"
        required: false
      sample_dates:
        description: "test on the first N dates only (0 = full season)"
        default: "0"
        required: false
      allocator:
        description: "1 = allocator fit test, 2 = redistribution counterfactual"
        default: "0"
        required: false
      write:
        description: "1 = write redistribution_factors (only after the sample test passes)"
        default: "0"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-absence-panel
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy
      - name: Build absence panel
        if: ${{ github.event.inputs.allocator != '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANEL_SEASONS: ${{ github.event.inputs.seasons || '2024-25,2025-26' }}
          PANEL_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
          SHRINK_K: '5'
        run: python nba/build_redistribution_panel.py
      - name: Fit minutes allocator (sample test)
        if: ${{ github.event.inputs.allocator == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOC_SEASONS: ${{ github.event.inputs.seasons || '2025-26' }}
          ALLOC_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '60' }}
        run: python nba/fit_minutes_allocator.py
      - name: Rate response + end-to-end points test
        if: ${{ github.event.inputs.allocator == '3' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RATE_TRAIN_SEASON: "2024-25"
          RATE_TEST_SEASON: "2025-26"
          RATE_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/fit_rate_response.py
      - name: Redistribution factors (allocator counterfactual)
        if: ${{ github.event.inputs.allocator == '2' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOC_SEASONS: ${{ github.event.inputs.seasons || '2025-26' }}
          ALLOC_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '60' }}
          ALLOC_WRITE: ${{ github.event.inputs.write || '0' }}
        run: python nba/build_redistribution_factors.py
