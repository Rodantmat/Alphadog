name: NBA Absence Panel

# The fitting set for the enrichment layer's largest factors (A2 redistribution, A2b dependent branch,
# A5 role change, B4 opponent availability, M1 defender quality). Pre-game ruled-out absences only,
# residuals measured against the day-by-day baseline, with team conservation totals. Fails loudly.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "comma-separated (2023-24 has no injury archive)"
        default: "2024-25,2025-26"
        required: false
      sample_dates:
        description: "test on the first N dates only (0 = full season)"
        default: "0"
        required: false
      allocator:
        description: "1 = allocator fit test, 2 = redistribution counterfactual"
        default: "0"
        required: false
      write:
        description: "1 = write redistribution_factors (only after the sample test passes)"
        default: "0"
        required: false
      prop:
        description: "prop for the edge backtest"
        default: "points"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-absence-panel
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy
      - name: Build absence panel
        if: ${{ github.event.inputs.allocator == '0' || github.event.inputs.allocator == '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PANEL_SEASONS: ${{ github.event.inputs.seasons || '2024-25,2025-26' }}
          PANEL_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
          SHRINK_K: '5'
        run: python nba/build_redistribution_panel.py
      - name: Fit minutes allocator (sample test)
        if: ${{ github.event.inputs.allocator == '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOC_SEASONS: ${{ github.event.inputs.seasons || '2025-26' }}
          ALLOC_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '60' }}
        run: python nba/fit_minutes_allocator.py
      - name: Rate response + end-to-end points test
        if: ${{ github.event.inputs.allocator == '3' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RATE_TRAIN_SEASON: "2024-25"
          RATE_TEST_SEASON: "2025-26"
          RATE_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/fit_rate_response.py
      - name: Per-prop A2 value test
        if: ${{ github.event.inputs.allocator == '4' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RATE_TEST_SEASON: ${{ github.event.inputs.seasons || '2025-26' }}
          RATE_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/test_a2_per_prop.py
      - name: Factor B4 opponent availability
        if: ${{ github.event.inputs.allocator == '5' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          B4_TRAIN_SEASON: "2024-25"
          B4_TEST_SEASON: "2025-26"
          B4_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/fit_b4_opponent.py
      - name: Factor B4 v2 (expected defender quality)
        if: ${{ github.event.inputs.allocator == '6' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          B4_TRAIN_SEASON: "2024-25"
          B4_TEST_SEASON: "2025-26"
          B4_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/fit_b4_defender_quality.py
      - name: Factor N1 - P(plays | status) at the 2:30 PM PT cutoff
        if: ${{ github.event.inputs.allocator == '7' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          N1_SEASONS: "2024-25,2025-26"
        run: python nba/measure_n1_status_resolution.py
      - name: A2 under window-time information
        if: ${{ github.event.inputs.allocator == '8' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          A2W_TEST_SEASON: ${{ github.event.inputs.seasons || '2025-26' }}
          A2W_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/test_a2_window_information.py
      - name: Factor A5 projected lineups
        if: ${{ github.event.inputs.allocator == '9' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          A5_SEASONS: ${{ github.event.inputs.seasons || '2025-26' }}
          A5_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/fit_a5_projected_lineups.py
      - name: Factor M1 defender quality level
        if: ${{ github.event.inputs.allocator == '10' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          M1_TRAIN_SEASON: "2024-25"
          M1_TEST_SEASON: "2025-26"
          M1_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/fit_m1_defender_level.py
      - name: B4 sub-case - rim protection
        if: ${{ github.event.inputs.allocator == '11' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIM_TRAIN_SEASON: "2024-25"
          RIM_TEST_SEASON: "2025-26"
          RIM_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/fit_b4_rim_protection.py
      - name: Build defender ratings (two-way, offence-adjusted)
        if: ${{ github.event.inputs.allocator == '12' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEF_SEASONS: ${{ github.event.inputs.seasons || '2025-26' }}
          DEF_CADENCE_DAYS: '7'
          DEF_RIDGE: '50'
          DEF_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: |
          python -m pip install -q scipy
          python nba/build_defender_ratings.py
      - name: Re-test defender factors (proper ratings + interactions)
        if: ${{ github.event.inputs.allocator == '13' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RT_TRAIN_SEASON: "2024-25"
          RT_TEST_SEASON: "2025-26"
          RT_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/retest_defender_factors.py
      - name: Fit the A2 usage allocation
        if: ${{ github.event.inputs.allocator == '14' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UA_TRAIN_SEASON: "2024-25"
          UA_TEST_SEASON: "2025-26"
          UA_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: python nba/fit_usage_allocation.py
      - name: Funnel + leg-level factor gate
        if: ${{ github.event.inputs.allocator == '15' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FN_TRAIN_SEASON: "2024-25"
          FN_TEST_SEASON: "2025-26"
          FN_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: |
          python -m pip install -q scipy
          python nba/test_funnel_leg_level.py
      - name: Factors on top of the certified baseline
        if: ${{ github.event.inputs.allocator == '16' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IT_SEASON: ${{ github.event.inputs.seasons || '2025-26' }}
          IT_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: |
          python -m pip install -q scipy
          python nba/test_factors_on_baseline.py
      - name: Component-level factor application
        if: ${{ github.event.inputs.allocator == '17' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CL_SEASON: ${{ github.event.inputs.seasons || '2025-26' }}
          CL_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: |
          python -m pip install -q scipy
          python nba/test_component_application.py
      - name: A2 novelty weighting
        if: ${{ github.event.inputs.allocator == '18' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NV_SEASON: ${{ github.event.inputs.seasons || '2025-26' }}
          NV_LOOKBACK: '10'
          NV_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '0' }}
        run: |
          python -m pip install -q scipy
          python nba/test_a2_novelty.py
      - name: Edge backtest vs the board
        if: ${{ github.event.inputs.allocator == '19' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EB_SEASONS: "2024-25,2025-26"
          EB_PROP: ${{ github.event.inputs.prop || 'points' }}
        run: python nba/backtest_edge_vs_board.py
      - name: Tier selection value
        if: ${{ github.event.inputs.allocator == '20' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SV_THRESHOLD: '0.66'
          SV_BREAKEVEN: '0.56'
        run: python nba/backtest_tier_selection_value.py
      - name: Ladder calibration correction
        if: ${{ github.event.inputs.allocator == '21' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CC_TRAIN: "2024-25"
          CC_TEST: "2025-26"
          CC_K: '400'
        run: python nba/apply_ladder_calibration.py
      - name: Calibrate ALL props
        if: ${{ github.event.inputs.allocator == '22' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LC_TRAIN: "2024-25"
          LC_TEST: "2025-26"
          LC_K: '400'
        run: python nba/calibrate_all_props.py
      - name: Blowout model v2 (market spread)
        if: ${{ github.event.inputs.allocator == '23' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BM_SEASONS: "2024-25,2025-26"
        run: python nba/build_blowout_model.py
      - name: Redistribution factors (allocator counterfactual)
        if: ${{ github.event.inputs.allocator == '2' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALLOC_SEASONS: ${{ github.event.inputs.seasons || '2025-26' }}
          ALLOC_SAMPLE_DATES: ${{ github.event.inputs.sample_dates || '60' }}
          ALLOC_WRITE: ${{ github.event.inputs.write || '0' }}
        run: python nba/build_redistribution_factors.py
