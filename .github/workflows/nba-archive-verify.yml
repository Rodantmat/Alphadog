name: NBA Archive Restore Verify (read-only)

# Proves that tables archived to a db-archive-<date> release restore row-for-row (row count + whole-content fingerprint) before
# any of them may leave the database (nba/verify_archive_restore.py). Never drops anything.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. db-archive-2026-10-14"
        required: true
      tables:
        description: "comma list of schema.table"
        required: true
      seasons:
        default: "2024-25,2025-26"
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Restore each table into a temp copy and compare
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFY_TAG: ${{ github.event.inputs.tag }}
          VERIFY_TABLES: ${{ github.event.inputs.tables }}
          VERIFY_SEASONS: ${{ github.event.inputs.seasons }}
        run: python -u nba/verify_archive_restore.py
