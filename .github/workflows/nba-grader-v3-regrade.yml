name: NBA Grader v3 Regrade + Certify (one-off)

# 2026-10-18 (owner: "Having the boards now, be sure we are using the proper multipliers, prove, analyze and understand each of the
# available tables"). Grader v3 (PP_PAYOUT_FINDINGS §0l) re-prices every PrizePicks backtest slip (old payout kept in
# payout_grader_v2) and the frozen certification pass runs on the result - the same two steps P5 now runs weekly (3g + 4),
# dispatched once so the new payouts are certified before opening night. Shares P5's concurrency group: never overlaps it.

on:
  workflow_dispatch:
    inputs:
      keep_col:
        description: "optional column that keeps each changed row's payout before this regrade (e.g. payout_v3_pre_20261021)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-p5
  cancel-in-progress: false

jobs:
  regrade:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy
      - name: Regrade every PrizePicks backtest slip to grader v3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REGRADE_KEEP_COL: ${{ github.event.inputs.keep_col }}
        run: python -u nba/regrade_pp_payout_v3.py
      - name: Certification pass (frozen invariant list)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/certify_slip_system.py
