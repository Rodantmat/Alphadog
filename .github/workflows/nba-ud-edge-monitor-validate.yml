name: NBA UD Edge Monitor Validate

# §31o: the PRODUCTION Underdog edge-monitor functions on both backtest seasons, plus the DB wrapper on today's ledger.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UD_EXCL_CENTER: "1"
        run: python -u nba/validate_ud_edge_monitor.py
