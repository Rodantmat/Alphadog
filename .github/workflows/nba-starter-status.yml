name: NBA Starter Status Backfill

on:
  # Standalone, targeted workflow - deliberately NOT added as another step in nba-backfill.yml,
  # which would force re-running all its earlier steps (career totals, historical seasons,
  # splits - already completed and verified) just to add this one new piece. Same one-time,
  # not-part-of-the-weekly-cycle reasoning as nba-backfill.yml.
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_STARTER_STATUS.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-starter-status
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip curl_cffi

      - name: Backfill per-game starter/bench status (2025-26 only)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_starter_status.py
        continue-on-error: true

      - name: Commit starter status JSON to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in nba/data/nba_starter_status_2025_26.json nba/data/nba_starter_status_2025_26_meta.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No starter status JSON changes to commit."
            exit 0
          fi
          git commit -m "NBA starter status backfill data [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5) - retrying with rebase..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          echo "Failed to push after 5 attempts."
          exit 1
