name: NBA Certify Slip System

# Frozen invariant list. Three consecutive runs with zero FAIL = certified.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Certification pass
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -u nba/certify_slip_system.py
