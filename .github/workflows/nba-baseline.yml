name: NBA Baseline Ladder

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_BASELINE.txt'
  # No cron for now (owner 2026-09-09): scheduling will be set up via Claude Coworker closer to the season.

permissions:
  contents: write

concurrency:
  group: alphadog-nba-baseline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip pandas numpy scipy

      - name: Resolve ASOF (from nba/TRIGGER_NBA_BASELINE.txt 'asof:' line, else today)
        id: asof
        run: |
          A=$(grep -E '^asof:' nba/TRIGGER_NBA_BASELINE.txt 2>/dev/null | head -1 | sed 's/^asof:[[:space:]]*//')
          R=$(grep -E '^replay:' nba/TRIGGER_NBA_BASELINE.txt 2>/dev/null | head -1 | sed 's/^replay:[[:space:]]*//')
          L=$(grep -E '^ladder_steps:' nba/TRIGGER_NBA_BASELINE.txt 2>/dev/null | head -1 | sed 's/^ladder_steps:[[:space:]]*//')
          [ -z "$A" ] && A=$(date -u +%F)
          echo "asof=$A" >> $GITHUB_OUTPUT; echo "replay=${R:-0}" >> $GITHUB_OUTPUT; echo "steps=${L:-10}" >> $GITHUB_OUTPUT
          echo "ASOF=$A replay=${R:-0} ladder_steps=${L:-10}"

      - name: Build the baseline ladder (single-stat full-game props, per prop pair)
        env:
          BT_ASOF: ${{ steps.asof.outputs.asof }}
          BT_REPLAY: ${{ steps.asof.outputs.replay }}
          BT_LADDER_STEPS: ${{ steps.asof.outputs.steps }}
        run: |
          # NO "|| echo failed": a silent failure here is how the combos ladder went missing and left
          # 44% of the 2026-03-15 board with no baseline probability. Fail loudly instead.
          set -e
          for pair in points,rebounds assists,steals blocks,turnovers; do
            BT_SAVE_COMPONENTS=1 BT_PROPS=$pair python nba/baseline/build_baseline_ladder.py
          done
          for pair in threes_made,fg3a fga,ftm personal_fouls; do
            BT_PROPS=$pair python nba/baseline/build_baseline_ladder.py
          done
          python nba/baseline/build_combos_ladder.py || echo "combos failed"
          # PERIOD PROPS (certified/at-standard set; each call ~8 min): 1Q/1H/2H/4Q points, 1Q rebounds/assists/threes, 4Q OT-excluded (Sleeper)
          for per in q1 h1 h2 q4; do BT_PERIODS=$per BT_PROPS=points python nba/baseline/build_periods_ladder.py || echo "period $per points failed"; done
          for prop in rebounds assists threes_made; do BT_PERIODS=q1 BT_PROPS=$prop python nba/baseline/build_periods_ladder.py || echo "period q1 $prop failed"; done
          BT_PERIODS=q4 BT_PROPS=points BT_OT=exclude python nba/baseline/build_periods_ladder.py || echo "period q4 OT-exclude failed"
          rm -f nba/backtest/reports/_comp_*.pkl nba/backtest/reports/_p10_*.pkl nba/backtest/reports/_rel_stage1.pkl
          python - <<'EOF'
          import json, glob, os
          asof = os.environ["BT_ASOF"]; rows = []; meta = None
          for f in sorted(glob.glob(f"nba/data/nba_baseline_ladder_{asof}_*.json")):
              d = json.load(open(f)); rows += d["ladder"]; meta = meta or d["meta"]
          if meta:
              meta["rows"] = len(rows); meta["props"] = sorted({r["prop"] for r in rows}); meta["players"] = len({r["player_id"] for r in rows})
              json.dump({"meta": meta, "ladder": rows}, open(f"nba/data/nba_baseline_ladder_{asof}.json", "w"))
              json.dump({"meta": meta, "ladder": rows}, open("nba/data/nba_baseline_ladder_latest.json", "w"))
              print("merged ladder:", {k: v for k, v in meta.items() if k not in ("factor_fits",)})
          for f in glob.glob(f"nba/data/nba_baseline_ladder_{asof}_*.json"): os.remove(f)
          EOF

      - name: Commit ladder to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/nba_baseline_ladder_*.json || true
          if git diff --cached --quiet; then echo "No ladder changes."; exit 0; fi
          git commit -m "NBA baseline ladder ${{ steps.asof.outputs.asof }} [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2))
          done
          exit 1
