name: Temu Probe (no commit)

# Cloud test: can a GitHub runner read Temu products + prices with no owner laptop? Real Chrome (SeleniumBase UC + Xvfb).
# Runs two jobs: plain runner IP and the residential proxy. Logged out; nothing bought; commits nothing.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search keyword to test"
        default: "dog shirt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        proxy: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve proxy (credential store first, secret as fallback)
        if: matrix.proxy == '1'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store"
          else
            echo "proxy: using the PROXY_URL secret"
          fi
      - name: System deps (Chrome fonts + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2t64 libgbm1 || \
          sudo apt-get install -y xvfb x11-utils fonts-liberation fonts-noto-color-emoji fonts-noto-cjk \
            libnss3 libxss1 libasound2 libgbm1
      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase "proxy.py" "psycopg[binary]"
          sbase get chromedriver || true
      - name: Run the probe
        env:
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          TEMU_PROXY: ${{ matrix.proxy }}
          TEMU_QUERY: ${{ github.event.inputs.query }}
          BETR_SESSION_ID: temu${{ github.run_id }}
        run: python temu/temu_probe.py
