name: NBA Roster Rule Replay Validation

# §31r: the REAL ladder builder replayed on past slates with a historical PROXY roster (team at next appearance - validation
# only), then coverage of board players who played: NEW builder output vs the OLD last-3-games rule. Runner files only; no DB
# writes, no commits.
on:
  workflow_dispatch:
    inputs:
      dates:
        default: '["2025-10-22","2025-11-30","2026-02-08","2026-02-24"]'
        required: false

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        date: ${{ fromJSON(github.event.inputs.dates) }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RV_DATE: ${{ matrix.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy curl_cffi lxml html5lib pdfplumber
      - name: Proxy roster for the date (validation only)
        env:
          RV_MODE: proxy
        run: python -u nba/validate_roster_replay.py
      - name: Real builder, replay (one prop pair - rosters are prop-independent)
        env:
          BT_ASOF: ${{ matrix.date }}
          BT_REPLAY: "1"
          BT_CUTOFF: baseline
          BT_PROPS: "points,rebounds"
        run: python nba/baseline/build_baseline_ladder.py 2>&1 | grep -E "current roster|slate |ASOF|Traceback|Error" || true
      - name: Coverage - new builder vs old rule
        env:
          RV_MODE: compare
        run: python -u nba/validate_roster_replay.py
