name: NBA Engine Test (no-write, separate queue)

# WHY THIS EXISTS. Every analysis toggle lived in nba-absence-panel.yml under ONE concurrency group, so
# a 4-minute sample test queued behind a 45-minute full-season write. That cost hours of waiting on
# 2026-09-18 alone: a sample sat `pending` with no runner while a season rebuild held the group.
#
# This workflow carries the READ-ONLY tests on their OWN concurrency group, so validation can always run
# immediately - including WHILE a write job is in flight. Nothing here writes to nba_score.final_hp;
# FE_WRITE is hard-coded to 0, so it cannot collide with a build.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "final_hp | confidence | calibration | reliability"
        default: "final_hp"
        required: true
      props:
        description: "comma-separated, or ALL. Default spans every prop archetype."
        default: "points,blocks,pra,points_q1,double_double,oreb"
        required: false
      season:
        description: "2024-25 or 2025-26"
        default: "2025-26"
        required: false
      date:
        description: "single slate date for a scoped run (blank = all dates)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-engine-test        # deliberately NOT the panel/build group
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" pandas numpy scipy

      - name: Final engine dry run (no write)
        if: ${{ github.event.inputs.task == 'final_hp' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FE_SEASONS: ${{ github.event.inputs.season }}
          FE_PROPS: ${{ github.event.inputs.props }}
          FE_DATE: ${{ github.event.inputs.date }}
          FE_WRITE: '0'
        run: python nba/build_final_hp.py

      - name: Availability delta (simulate P3 step 4a)
        if: ${{ github.event.inputs.task == 'delta' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DELTA_ASOF: ${{ github.event.inputs.date }}
          DELTA_SEASON: ${{ github.event.inputs.season }}
        run: python nba/build_availability_delta.py

      - name: Score the board (simulate P3 scoring)
        if: ${{ github.event.inputs.task == 'board' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BS_ASOF: ${{ github.event.inputs.date }}
          BS_SEASON: ${{ github.event.inputs.season }}
          BS_SOURCE: "archive"
        run: python nba/score_board_legs.py

      - name: Delta gap audit (simulate P2 step 2)
        if: ${{ github.event.inputs.task == 'gaps' }}
        env:
          GAP_SEASON: ${{ github.event.inputs.season }}
        run: python nba/check_delta_gaps.py

      - name: Certify a pipeline (p1 / p2 / p3)
        if: ${{ github.event.inputs.task == 'certify' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPE: ${{ github.event.inputs.props }}
          CERT_STRICT: '0'
        run: python nba/certify_pipeline.py

      - name: Report cutoff measurement (is 1 PM PT enough?)
        if: ${{ github.event.inputs.task == 'cutoff' }}
        env:
          IRT_SEASONS: "2024-25,2025-26"
        run: python nba/measure_report_cutoff.py

      - name: Storage diet (VACUUM FULL + index audit)
        if: ${{ github.event.inputs.task == 'diet' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIET_TABLES: ${{ github.event.inputs.props }}
        run: python nba/run_storage_diet.py

      - name: Confidence v3 (epistemic thermometer + group sampling)
        if: ${{ github.event.inputs.task == 'confidence_v3' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          C3_SEASONS: "2024-25,2025-26"
        run: python nba/build_confidence_v3.py

      - name: Confidence v2 (data thermometer)
        if: ${{ github.event.inputs.task == 'confidence_v2' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CV2_SEASONS: "2024-25,2025-26"
        run: python nba/build_confidence_v2.py

      - name: Confidence verification
        if: ${{ github.event.inputs.task == 'confidence' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MC_SEASONS: "2024-25,2025-26"
          MC_MIN_N: '400'
        run: python nba/build_mondrian_confidence.py

      - name: Prop calibration check
        if: ${{ github.event.inputs.task == 'calibration' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAL_PROPS: ${{ github.event.inputs.props }}
          CAL_SEASONS: ${{ github.event.inputs.season }}
        run: python nba/check_prop_calibration.py

      - name: Prop reliability score
        if: ${{ github.event.inputs.task == 'reliability' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REL_SEASONS: "2024-25,2025-26"
          REL_PROPS: ${{ github.event.inputs.props }}
        run: python nba/score_prop_reliability.py
