name: NBA Close Capture

# CLOSE BOARD CAPTURE (strategy doc §31c, 2026-10-03 wiring audit). Fired by the scheduler once per game day at
# first tip - 25 min (it dispatches workflows WITHOUT inputs, so the label is hard-coded here - nba-boards-market.yml's
# input would default to 'routine'). PrizePicks + Underdog, archived as snapshot_label 'close' (today's games only - legs
# for future slates are archived as 'routine', §31g). Feeds: PrizePicks' grader line-movement annotation (optional) and the
# line-movement research (§30w); the record-only late pick it once fed is retired (§31p). Grading does
# NOT depend on it. Each board capped at 5 minutes; a failed board never blocks the other.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphadog-nba-close-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy curl_cffi lxml html5lib pdfplumber
      # PROXY FROM THE CREDENTIAL STORE (2026-10-08, full-system certification). The owner's rule keeps API keys and
      # credentials in nba_config.external_credentials; the proxy URL now lives there too ('proxy_url'), so a provider or
      # credential change is ONE row, not a secret edit in 30 workflows. The PROXY_URL secret stays as the fallback.
      # Every later step reads ${{ env.PROXY_URL || secrets.PROXY_URL }}. psql ships on the GitHub runner image.
      - name: Resolve proxy (credential store first, secret as fallback)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store -> $(echo "$P" | sed 's#.*@##')"
          else
            echo "proxy: credential store has no proxy_url row - using the PROXY_URL secret"
          fi

      - name: Close boards (PrizePicks + Underdog) and archive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROXY_URL: ${{ env.PROXY_URL || secrets.PROXY_URL }}
          PP_NBA_OUT_DIR: "boards"          # NBA-owned PrizePicks producer (round 2 P3#10; equivalence probe 37744844157)
          PP_NBA_MIN_FUTURE_ROWS: "50"
          UNDERDOG_SPORTS: "NBA"
          UNDERDOG_OUT_DIR: "boards"
          ARCHIVE_LABEL: "close"
          ARCHIVE_SPORT: "nba"
          ARCHIVE_APPS: "prizepicks,underdog"
        run: |
          set -uo pipefail
          # archive only what THIS run captured (round-2 P2B#17 / G-7 rule): a stale file must not become today's 'close'
          ok=""
          if timeout --signal=TERM --kill-after=30s 300 python nba/scrape_prizepicks_nba_board.py > /tmp/pp_close.log 2>&1; then ok="$ok,prizepicks"; else echo "=== PrizePicks close pull failed/timed out"; fi
          tail -n 10 /tmp/pp_close.log
          if timeout --signal=TERM --kill-after=30s 300 python nba/scrape_underdog_board.py > /tmp/ud_close.log 2>&1; then ok="$ok,underdog"; else echo "=== Underdog close pull failed/timed out"; fi
          tail -n 10 /tmp/ud_close.log
          # Sleeper + Fliff close snapshots (retention audit 2026-10-08): the close record was PrizePicks/Underdog only;
          # the priced boards' line movement window->close is exactly what the §31v ledger will need. Parallel, bounded.
          SLEEPER_SPORTS=nba SLEEPER_OUT_DIR=boards timeout --signal=TERM --kill-after=30s 300 python nba/scrape_sleeper_board.py > /tmp/sl_close.log 2>&1 & p_sl=$!
          FLIFF_SPORTS=nba timeout --signal=TERM --kill-after=30s 300 python nba/scrape_fliff_board.py > /tmp/fl_close.log 2>&1 & p_fl=$!
          if wait $p_sl; then ok="$ok,sleeper"; else echo "=== Sleeper close pull failed/timed out"; fi; tail -n 5 /tmp/sl_close.log
          if wait $p_fl; then ok="$ok,fliff"; else echo "=== Fliff close pull failed/timed out"; fi; tail -n 5 /tmp/fl_close.log
          ok="${ok#,}"
          if [ -z "$ok" ]; then echo "::warning::no close board captured - nothing archived as 'close'"; else
            echo "archiving close boards for: $ok"
            ARCHIVE_APPS="$ok" python nba/archive_live_boards.py
          fi
