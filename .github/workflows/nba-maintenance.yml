name: NBA Maintenance

# Manual/maintenance tasks that are not part of P1/P2/P3's nightly path.
#
#   final_hp   - rebuild nba_score.final_hp for a season. NEEDED: final_hp covers 2024-25 completely
#                (162 dates) but only 1 of 163 dates in 2025-26, so the system's headline output has no
#                rows for the live season - and the as-of calibration, which learns from final_hp, has
#                been inheriting 2024-25 cells because 2025-26 had nothing of its own.
#                Full rebuild (FE_DATE blank) deletes and rewrites season+prop, which is its correct
#                scope for a backfill. Do NOT run while P2 is running: P2 owns final_hp for the slate.
#   freshness  - report every factor's storage freshness and whether a fallback is silently carrying it.
#   injury     - load the daily injury file into Postgres (the archive load has its own workflow).

on:
  workflow_dispatch:
    inputs:
      task:
        description: "final_hp | freshness | injury"
        default: "freshness"
        required: true
      season:
        description: "season for final_hp (e.g. 2025-26)"
        default: "2025-26"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy

      - name: Rebuild final_hp for the season
        if: ${{ github.event.inputs.task == 'final_hp' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FE_SEASONS: ${{ github.event.inputs.season }}
          FE_WRITE: "1"
        run: python nba/build_final_hp.py

      - name: Factor freshness
        if: ${{ github.event.inputs.task == 'freshness' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FF_STRICT: "0"
        run: python nba/check_factor_freshness.py

      - name: Load today's injury report
        if: ${{ github.event.inputs.task == 'injury' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INJURY_LOAD_MODE: "current"
        run: python nba/load_injury_report.py
