name: NBA Season Tables

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_SEASON_TABLES.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-season-tables
  cancel-in-progress: false

jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip curl_cffi

      - name: "Resolve options from trigger file (seasons_n, tables, mode, matchups lines)"
        id: cfg
        run: |
          f=nba/TRIGGER_NBA_SEASON_TABLES.txt
          N=$(grep -E '^seasons_n:' $f 2>/dev/null | head -1 | sed 's/^seasons_n:[[:space:]]*//'); T=$(grep -E '^tables:' $f 2>/dev/null | head -1 | sed 's/^tables:[[:space:]]*//')
          M=$(grep -E '^mode:' $f 2>/dev/null | head -1 | sed 's/^mode:[[:space:]]*//'); G=$(grep -E '^matchups:' $f 2>/dev/null | head -1 | sed 's/^matchups:[[:space:]]*//')
          echo "seasons_n=${N:-3}" >> $GITHUB_OUTPUT; echo "tables=$T" >> $GITHUB_OUTPUT; echo "mode=${M:-season}" >> $GITHUB_OUTPUT; echo "matchups=$G" >> $GITHUB_OUTPUT

      - name: Scrape season tables (season or asof_weekly mode)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SEASONS_N: ${{ steps.cfg.outputs.seasons_n }}
          TABLES: ${{ steps.cfg.outputs.tables }}
          MODE: ${{ steps.cfg.outputs.mode }}
        run: python nba/scrape_nba_season_tables.py
        continue-on-error: true

      - name: Per-game matchups (matchups line = backfill:<season> or delta)
        if: steps.cfg.outputs.matchups != ''
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          M="${{ steps.cfg.outputs.matchups }}"
          case "$M" in
            backfill:*) MATCHUPS_MODE=backfill SEASON="${M#backfill:}" python nba/scrape_nba_matchups_pergame.py ;;
            delta) MATCHUPS_MODE=delta python nba/scrape_nba_matchups_pergame.py ;;
          esac
        continue-on-error: true

      - name: Commit to main (small files first, then matchup shards with a size guard)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push() { for i in 1 2 3 4 5; do if git push origin HEAD:main; then return 0; fi; git fetch origin main; git rebase origin/main; sleep $((RANDOM % 5 + 2)); done; return 1; }
          git add nba/data/nba_matchups_20*.json nba/data/nba_pt_defend_*.json nba/data/nba_hustle_*.json nba/data/nba_clutch_*.json nba/data/nba_preseason_logs_*.json nba/data/nba_season_tables_summary.json nba/data/nba_season_tables_asof_summary.json nba/data/nba_all_players.json nba/data/nba_coaches_*.json nba/data/nba_matchups_pergame_probe.json nba/data/nba_matchups_pergame_*_index.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "NBA season tables (as-of/defend/hustle/clutch/preseason/index) [skip ci]"; push; fi
          for f in nba/data/nba_matchups_pergame_*_20*.json; do
            [ -f "$f" ] || continue
            sz=$(stat -c %s "$f"); if [ "$sz" -gt 95000000 ]; then echo "SKIP $f ($sz bytes > 95 MB)"; continue; fi
            git add "$f"; if ! git diff --cached --quiet; then git commit -m "NBA per-game matchups shard $(basename $f) [skip ci]"; push; fi
          done
          echo "commit step done"
