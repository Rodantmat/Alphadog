name: NBA Periods Scrape

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'nba/TRIGGER_NBA_PERIODS.txt'

permissions:
  contents: write

concurrency:
  group: alphadog-nba-periods
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip curl_cffi requests

      - name: Scrape per-quarter player game logs (Period=1..4, 3 seasons)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python nba/scrape_nba_periods.py

      - name: Commit data to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba/data/nba_player_game_log_q*.json nba/data/nba_player_game_log_periods_summary.json || true
          if git diff --cached --quiet; then
            echo "No period data changes to commit."
            exit 0
          fi
          git commit -m "Update NBA per-quarter player game logs [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
