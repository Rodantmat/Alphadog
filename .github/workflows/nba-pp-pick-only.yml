name: NBA PrizePicks Pick Only (re-pick one slate, then quote)

# 2026-11-10: today portfolio B built 2 slips and the quote gate skipped both (Ace Bailey blocks 0.5 is a goblin on PrizePicks), so the
# thin-night fallback never fired (its trigger counts slips BUILT, not slips that survive the gate). This re-runs ONLY the PrizePicks pick
# for one slate (live_slip_engine inserts with ON CONFLICT DO NOTHING - existing rows are untouched) and then dispatches the quote gate.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "slate date (YYYY-MM-DD)"
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: alphadog-nba-pp-pick-only
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip "psycopg[binary]" requests pandas numpy scipy
      - name: PrizePicks slip pick (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LS_MODE: "pick"
          LS_DATE: ${{ github.event.inputs.day }}
        run: python -u nba/live_slip_engine.py
      - name: Dispatch the PrizePicks quote gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=000
          for i in 1 2 3; do
            code=`curl -s -o /tmp/d.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/nba-pp-payout-map.yml/dispatches" \
              -d '{"ref":"main","inputs":{"mode":"slipq","max_quotes":"60"}}'` || code=000
            echo "slip quotes dispatch (attempt ${i}): http ${code}"
            [ "${code}" = "204" ] && exit 0
            sleep `expr ${i} \* 8`
          done
          exit 1
