name: NBA UD Live (paper)

# Underdog live paper engine (strategy doc §30z), manual entry point. The scheduled legs run inside P3 (pick) and P2A (grade).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pick | grade"
        default: "pick"
        required: false
      date:
        description: "slate date YYYY-MM-DD (grade: blank = every ungraded slate before today)"
        default: ""
        required: false
      force:
        description: "1 = rebuild a slate already logged"
        default: "0"
        required: false
      add_flex:
        description: "1 = pick mode only: add portfolio C's Flex unit to an already-logged slate (touches nothing else)"
        default: "0"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-ud-live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]" numpy
      - name: Underdog live engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UDL_MODE: ${{ github.event.inputs.mode }}
          UDL_DATE: ${{ github.event.inputs.date }}
          UDL_FORCE: ${{ github.event.inputs.force }}
          UDL_ADD_FLEX: ${{ github.event.inputs.add_flex }}
        run: python -u nba/ud_live_slip_engine.py
