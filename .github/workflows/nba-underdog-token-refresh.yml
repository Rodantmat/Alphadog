name: NBA Underdog Token Refresh

# Owner 2026-10-21 17:37 PT: "create a token refresher so we can always have a fresh token like betr". Keeps the Underdog session
# alive (refresh token rotated and saved under a row lock - nba/underdog_auth.py); if Underdog refused the stored token it logs in
# again from the GitHub secrets UD_EMAIL / UD_PASSWORD. Proves the token with one read-only signed-in call. Prints no secret.
# Twice a day: 08:41 and 20:41 PT (15:41 / 03:41 UTC) - before the morning work and after the night's games.
on:
  schedule:
    - cron: '41 15,3 * * *'
  workflow_dispatch: {}

concurrency:
  group: nba-underdog-auth
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip curl_cffi "psycopg[binary]"
      - name: Resolve proxy (credential store)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          P=$(psql "$DATABASE_URL" -Atqc "SELECT credential_value_encrypted FROM nba_config.external_credentials WHERE credential_key='proxy_url'" 2>/dev/null || true)
          if [ -n "$P" ]; then
            echo "::add-mask::$P"; echo "::add-mask::$(echo "$P" | sed -e 's#^[a-z]*://##' -e 's#@.*$##')"
            echo "PROXY_URL=$P" >> "$GITHUB_ENV"; echo "proxy: credential store"
          else
            echo "proxy: none"
          fi
      - name: Refresh (log in again only if needed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UD_EMAIL: ${{ secrets.UD_EMAIL }}
          UD_PASSWORD: ${{ secrets.UD_PASSWORD }}
        run: python nba/underdog_auth.py
