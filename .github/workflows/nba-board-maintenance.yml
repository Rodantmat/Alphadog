name: NBA Maintenance - Shrink Board Index

on:
  workflow_dispatch:
    inputs:
      task:
        description: "shrink | derived | map | curves | rungs | coverage"
        default: "derived"
        required: false
      date:
        description: "slate date for coverage check / props for calibration"
        default: "2026-03-15"
        required: false
      season:
        description: "season for the calibration check"
        default: "2025-26"
        required: false
      props:
        description: "props for the reliability score (blank = every prop in baseline_history)"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-board-maintenance
  cancel-in-progress: false

jobs:
  shrink:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Shrink board_snapshots index
        if: ${{ github.event.inputs.task == 'shrink' || github.event.inputs.task == '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/maintenance_shrink_board_index.py
      - name: Build derived market tables
        if: ${{ github.event.inputs.task == 'derived' || github.event.inputs.task == 'map' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DERIVED_STEP: ${{ github.event.inputs.task == 'map' && 'map' || 'all' }}
        run: python nba/build_market_derived.py
      - name: Build book curves and calibration
        if: ${{ github.event.inputs.task == 'curves' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STEP: all
        run: python nba/build_book_curves.py
      - name: Build rung market (chunked monthly)
        if: ${{ github.event.inputs.task == 'rungs' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/build_rung_market.py
      - name: Baseline vs board coverage
        if: ${{ github.event.inputs.task == 'coverage' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COVER_DATE: ${{ github.event.inputs.date || '2026-03-15' }}
        run: python nba/check_baseline_board_coverage.py
      - name: OREB opportunity model test
        if: ${{ github.event.inputs.task == 'oreb' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OREB_SEASONS: "2024-25,2025-26"
        run: |
          python -m pip install -q pandas scipy
          python nba/test_oreb_opportunity_model.py
      - name: OREB rate estimator test
        if: ${{ github.event.inputs.task == 'oreb_rate' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OREB_SEASONS: "2024-25,2025-26"
        run: |
          python -m pip install -q pandas
          python nba/test_oreb_rate_estimator.py
      - name: OREB basis test (mean only)
        if: ${{ github.event.inputs.task == 'oreb_mean' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OREB_SEASONS: "2024-25,2025-26"
        run: |
          python -m pip install -q pandas
          python nba/test_oreb_basis_mean.py
      - name: Prop reliability score
        if: ${{ github.event.inputs.task == 'reliability' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REL_SEASONS: "2024-25,2025-26"
          REL_PROPS: ${{ github.event.inputs.props || '' }}
        run: |
          python -m pip install -q pandas
          python nba/score_prop_reliability.py
      - name: Prop calibration check
        if: ${{ github.event.inputs.task == 'calibration' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAL_PROPS: ${{ github.event.inputs.date || 'oreb' }}
          CAL_SEASONS: ${{ github.event.inputs.season || '2025-26' }}
        run: |
          python -m pip install -q pandas
          python nba/check_prop_calibration.py
      - name: Season-wide coverage (history vs board, with name resolution)
        if: ${{ github.event.inputs.task == 'season_coverage' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COVER_SEASON: ${{ github.event.inputs.date || '2025-26' }}
        run: |
          python -m pip install -q pandas
          python nba/check_season_coverage.py
