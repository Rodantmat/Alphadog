name: NBA Maintenance - Shrink Board Index

on:
  workflow_dispatch:
    inputs:
      task:
        description: "shrink | derived"
        default: "derived"
        required: false

permissions:
  contents: read

concurrency:
  group: alphadog-nba-board-maintenance
  cancel-in-progress: false

jobs:
  shrink:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip "psycopg[binary]"
      - name: Shrink board_snapshots index
        if: ${{ github.event.inputs.task == 'shrink' || github.event.inputs.task == '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/maintenance_shrink_board_index.py
      - name: Build derived market tables
        if: ${{ github.event.inputs.task == 'derived' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python nba/build_market_derived.py
